/* ===== island 4: light ===== */
LAB.c4l1 = {t:'لعبة المرايات', goal:'وجّهي ضوء الكشاف لحد ما يوصل لمشمش! دوسي على المرايات علشان تلفّيها.',
  found:'الضوء بيمشي في خطوط مستقيمة، ولما يقابل مراية بينعكس ويغيّر اتجاهه. وده اللي بيخلينا نشوف صورتنا في المراية.',
  run(host, api){
    const LV = [
      {start:[0, 1], dir:'r', target:[4, 3], mirrors:{'2,1':'\\', '2,3':'\\'}},
      {start:[0, 0], dir:'r', target:[1, 3], mirrors:{'3,0':'\\', '3,2':'/', '1,2':'/'}}
    ];
    let lv = 0, M = {};
    const S = 70, OX = 25, OY = 10;
    const flip = k => { M[k] = M[k] === '/' ? '\\' : '/'; };
    const load = () => { M = {...LV[lv].mirrors}; const ks = Object.keys(M); ks.forEach(k => { if(Math.random() < .6) flip(k); }); if(trace().hit) flip(ks[0]); draw(); };
    const trace = () => {
      const L = LV[lv]; let [x, y] = L.start, d = L.dir; const pts = [[x, y]], seen = new Set();
      for(let n = 0; n < 30; n++){
        const st = {r:[1, 0], l:[-1, 0], u:[0, -1], d:[0, 1]}[d]; x += st[0]; y += st[1];
        if(x < 0 || y < 0 || x > 5 || y > 3){ pts.push([x, y]); return {pts, hit:false}; }
        pts.push([x, y]);
        if(x === L.target[0] && y === L.target[1]) return {pts, hit:true};
        const m = M[x + ',' + y];
        if(m){ const key = x + ',' + y + d; if(seen.has(key)) break; seen.add(key); d = m === '/' ? {r:'u', u:'r', l:'d', d:'l'}[d] : {r:'d', d:'r', l:'u', u:'l'}[d]; }
      }
      return {pts, hit:false};
    };
    const c = ([x, y]) => [OX + x * S + S / 2, OY + y * S + S / 2];
    const draw = () => {
      const L = LV[lv], T = trace();
      host.querySelector('svg').innerHTML = `<rect width="450" height="300" fill="#26304F"/>
        ${Array.from({length:6 * 4}, (_, k) => `<rect x="${OX + (k % 6) * S}" y="${OY + Math.floor(k / 6) * S}" width="${S}" height="${S}" fill="none" stroke="#3B4770" stroke-width="1"/>`).join('')}
        <polyline points="${T.pts.map(p => c(p).join(',')).join(' ')}" fill="none" stroke="#FFE35A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
        ${emo(...c(L.start), '🔦', 36)}
        ${emo(...c(L.target), T.hit ? '😻' : '🐱', 42)}
        ${Object.entries(M).map(([k, m]) => { const [x, y] = k.split(',').map(Number), [cx, cy] = c([x, y]); return `<g class="mir" data-m="${k}" role="button"><rect x="${cx - 30}" y="${cy - 30}" width="60" height="60" fill="transparent"/><line x1="${cx - 22}" y1="${m === '/' ? cy + 22 : cy - 22}" x2="${cx + 22}" y2="${m === '/' ? cy - 22 : cy + 22}" stroke="#BFE8FF" stroke-width="9" stroke-linecap="round"/><line x1="${cx - 22}" y1="${m === '/' ? cy + 22 : cy - 22}" x2="${cx + 22}" y2="${m === '/' ? cy - 22 : cy + 22}" stroke="#2B2233" stroke-width="2"/></g>`; }).join('')}`;
      host.querySelectorAll('.mir').forEach(g => g.onclick = () => { const k = g.dataset.m; M[k] = M[k] === '/' ? '\\' : '/'; sfxTick(); draw(); });
      if(T.hit){ api.good(); if(lv === 0){ api.say('😻 الضوء وصل! المراية عكست الضوء وغيرت اتجاهه. يلا المستوى التاني...'); lv = 1; setTimeout(() => { if(document.contains(host)) load(); }, 1500); } else { api.say('🌟 برافو! عكستي الضوء بكذا مراية لحد ما وصل.'); api.done(); host.querySelectorAll('.mir').forEach(g => g.onclick = null); } }
    };
    host.innerHTML = `<svg class="lab-svg tap" viewBox="0 0 450 300"></svg>${labMsg('دوسي على المرايات علشان تلفّيها')}`;
    load();
  }};

LAB.c4l2 = {t:'تجميع ضوء الشمس', goal:'حركي العدسة المكبرة لفوق ولتحت لحد ما الضوء يتجمع في نقطة صغيرة على الورقة، وجربي ورقة سودا وورقة بيضا.',
  found:'العدسة المكبرة بتجمّع ضوء الشمس في نقطة صغيرة فتسخن جدًا ممكن تحرق الورقة. والورقة السودا بتتحرق أسرع من البيضا لأنها بتمتص الضوء أكتر. وممنوع نعمل كده من غير الكبار!',
  run(host, api){
    let h = 40, black = true, heat = {b:0, w:0}, burnt = {b:false, w:false};
    const F = 110;
    const draw = () => {
      const lensY = 200 - h - 40, r = Math.max(3, Math.abs(h + 40 - F) * .55), k = black ? 'b' : 'w';
      host.querySelector('svg').innerHTML = `${SKY(250, '#FFF8DC')}<circle cx="200" cy="0" r="34" fill="#F5B700" stroke="#2B2233" stroke-width="3"/>
        <polygon points="140,0 260,0 ${200 + 60},${lensY} ${200 - 60},${lensY}" fill="#FFE98A" opacity=".55"/>
        <polygon points="${140},${lensY} ${260},${lensY} ${200 + r},200 ${200 - r},200" fill="#FFE35A" opacity=".55"/>
        <ellipse cx="200" cy="${lensY}" rx="64" ry="11" fill="#BFE8FF" stroke="#2B2233" stroke-width="3"/><line x1="264" y1="${lensY}" x2="320" y2="${lensY - 30}" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>
        <rect x="90" y="200" width="220" height="20" fill="${black ? '#2B2233' : '#FFFFFF'}" stroke="#2B2233" stroke-width="3"/>
        <circle cx="200" cy="200" r="${r}" fill="#FFF7B0" opacity=".9"/>
        ${burnt[k] ? `${emo(200, 205, '🔥', 34)}${emo(230, 170, '💨', 24)}` : heat[k] > 50 ? emo(225, 180, '💨', 18) : ''}
        <rect x="20" y="230" width="360" height="12" rx="6" fill="#fff" stroke="#2B2233" stroke-width="2"/><rect x="20" y="230" width="${3.6 * heat[k]}" height="12" rx="6" fill="#FF6B3D"/>
        <text x="20" y="224" font-size="12" font-weight="800">🌡️ سخونية الورقة ${black ? 'السودا' : 'البيضا'}</text>`;
    };
    host.innerHTML = `<svg class="lab-svg" viewBox="0 0 400 250"></svg>
      <label class="lab-slider">🔍 ارتفاع العدسة<input type="range" min="10" max="150" value="40" id="lh"></label>
      ${choiceRow('pc', [['b', '⬛ ورقة سودا'], ['w', '⬜ ورقة بيضا']], 'b')}${labMsg('ارفعي العدسة ونزليها لحد ما بقعة الضوء تبقى أصغر ما يمكن')}`;
    $('#lh').oninput = e => { h = +e.target.value; draw(); };
    pickTap(host, '[data-pc]', 'data-pc', v => { black = v === 'b'; draw(); });
    const iv = setInterval(() => {
      if(!document.contains(host)){ clearInterval(iv); return; }
      const r = Math.abs(h + 40 - F) * .55, k = black ? 'b' : 'w';
      if(burnt[k]) return;
      const gain = r < 6 ? (black ? 6 : 2.2) : r < 15 ? (black ? 1.5 : .5) : -1;
      heat[k] = Math.max(0, Math.min(100, heat[k] + gain));
      if(heat[k] >= 100){ burnt[k] = true; api.good(); api.say(black ? '🔥 الورقة السودا ولّعت بسرعة! جربي البيضا' : '🔥 البيضا ولّعت بس خدت وقت أطول بكتير!'); if(burnt.b) setTimeout(api.done, 800); }
      else if(r < 6 && heat[k] > 5) api.say('✨ الضوء اتجمّع في نقطة صغيرة... الورقة بتسخن!');
      draw();
    }, 200);
    draw();
  }};

LAB.c4l4 = {t:'الساعة الشمسية', goal:'حركي الوقت من الصبح لحد المغرب، وشوفي ظل العصاية بيتغير إزاي. لاقي إمتى الظل بيبقى أقصر حاجة.',

function pluck(freq, vol = .18, dur = 1.2, type = 'triangle'){
  const c = actx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}

      }
    }, 40);
  };
  draw();
}

LAB.c8l2 = {t:'انقلي التمثال زي الفراعنة', goal:'زوّدي عدد العمال، وجربي ترشّي مية على الرمل قدام الزلاجة. هتقدري تحركي التمثال بأقل عدد عمال؟',

    $('#wn').oninput = e => { n = +e.target.value; $('#nn').textContent = n; x = 0; draw(); };

      busy = true; let k = 0;

function gameListen(o = {}){
  setTop(true);
  const pool = o.pool || topicWords();
  const qs = shuffle(pool).slice(0, Math.min(8, pool.length));
  const results = []; let i = 0;
  function q(){
    if(i >= qs.length) return o.pool ? finish(() => gameListen(o), `قريتي ${results.filter(Boolean).length} من ${qs.length} كلمات صح من أول مرة`, o.back, o.backLabel) : finish('listen', `جاوبتي صح من أول مرة ${results.filter(Boolean).length} من ${qs.length}`);
    const w = qs[i], mode = o.readOnly ? 'read' : i % 2 === 0 ? 'listen' : 'read';
    let tries = 0, done = false;
    const same = shuffle(pool.filter(x => x.en !== w.en && x.e !== w.e));
    const others = same.length >= 3 ? same : shuffle(bookWordsWithPics().filter(x => x.en !== w.en && x.e !== w.e));

/* ============ SPELL IT ============ */
function gameSpell(){
  setTop(true);
  const ok = w => /^[a-z]{3,7}$/.test(w.en);
  let pool = topicWords().filter(ok);
  if(pool.length < 4) pool = bookWordsWithPics().filter(ok);
  const words = shuffle(pool).slice(0, 6), results = []; let i = 0;
  function round(){
    if(i >= words.length) return finish('spell', `كتبتي ${results.filter(Boolean).length} كلمات من غير مساعدة`);
    const w = words[i], L = w.en.split('');
    let tiles;
    for(let n=0;n<6;n++){ tiles = shuffle(L.map(ch => ({ch, used:false}))); if(tiles.map(t=>t.ch).join('') !== w.en) break; }
    const slots = Array(L.length).fill(null), locked = new Set();
    let helped = false, missed = false, finished = false;
    function render(state=''){
      screenEl.innerHTML = `<section class="stage">
        ${gameHead('رتّبي الحروف','Spell it','دوسي على الحروف بالترتيب عشان تكتبي الكلمة', i, words.length, results)}
        <div class="qcard sticker"><div class="pic-big">${pic(w)}</div><div class="row" style="justify-content:center">${sayBtn(w.en)}<span class="muted">${w.ar}</span></div></div>
        <div class="slots ${state}" id="slots">${slots.map((t,k) => `<button class="slot ${t!=null?'full':''} ${locked.has(k)?'lock':''}" data-s="${k}" aria-label="خانة ${k+1}">${t!=null ? tiles[t].ch : ''}</button>`).join('')}</div>
        <div class="letters">${tiles.map((t,k) => `<button class="tileL" data-t="${k}" ${t.used || finished ? 'disabled' : ''}>${t.ch}</button>`).join('')}</div>
        <div class="row" style="justify-content:center"><button class="btn soft" id="hint" ${finished?'disabled':''}>💡 ساعديني بحرف</button></div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </section>`;
      screenEl.querySelectorAll('.tileL').forEach(b => b.onclick = () => place(+b.dataset.t));
      screenEl.querySelectorAll('.slot').forEach(b => b.onclick = () => unplace(+b.dataset.s));
      $('#hint').onclick = hint;
    }
    function place(t){
      if(finished) return;
      const k = slots.indexOf(null); if(k < 0) return;
      slots[k] = t; tiles[t].used = true; sfxTick(); render();
      if(!slots.includes(null)) check();
    }
    function unplace(k){
      if(finished || slots[k] == null || locked.has(k)) return;
      tiles[slots[k]].used = false; slots[k] = null; render();
    }
    function check(){
      const word = slots.map(t => tiles[t].ch).join('');
      if(word === w.en){
        finished = true; results[i] = !helped; if(!helped && !missed) addStars(2); else addStars(1);
        render('ok'); sfxGood(); burst($('#slots'));
        say(`${w.en}! ${rand(PRAISE)}`);
        $('#fb').className = 'feedback good'; $('#fb').innerHTML = `<span class="en">${w.en}</span><span>${rand(['برافو!','شاطرة!','جامدة!'])}</span>`;
        setTimeout(() => { i++; round(); }, 1900);
      } else {
        missed = true; markTricky(w); sfxBad(); render('no');
        $('#fb').className = 'feedback bad'; $('#fb').textContent = 'قربتي! الحروف الصح هتفضل مكانها، جربي تاني.';
        setTimeout(() => {
          slots.forEach((t,k) => { if(t != null && tiles[t].ch !== L[k]){ tiles[t].used = false; slots[k] = null; } });
          render(); $('#fb').className = 'feedback bad'; $('#fb').textContent = 'قربتي! الحروف الصح هتفضل مكانها، جربي تاني.';
        }, 650);
      }
    }
    function hint(){
      if(finished) return;
      helped = true;
      const p = slots.findIndex((t,k) => t == null || tiles[t].ch !== L[k]);
      if(p < 0) return;
      if(slots[p] != null){ tiles[slots[p]].used = false; slots[p] = null; }
      let t = tiles.findIndex(x => !x.used && x.ch === L[p]);
      if(t < 0){
        const k = slots.findIndex((s,kk) => s != null && !locked.has(kk) && tiles[s].ch === L[p]);
        t = slots[k]; slots[k] = null;
      }
      slots[p] = t; tiles[t].used = true; locked.add(p); sfxTick(); render();
      if(!slots.includes(null)) check();
    }
    render(); setTimeout(() => say(w.en), 300);
  }
  round();
}

/* ============ COLOR MISHMISH ============ */
function gameColor(){
  setTop(true);
  const palette = COLORS;
  /* ears, eyes and nose are Unit 1 words (The Five Senses), so they are always in */
  const partIds = shuffle(['ears', 'eyes', 'nose', ...shuffle(Object.keys(PARTS).filter(k => !['ears','eyes','nose'].includes(k))).slice(0, 3)]);
  const cols = shuffle(palette.filter(c => c.en !== 'white'));
  const steps = partIds.map((p,k) => ({part:p, color:cols[k % cols.length]}));
  const fills = {};
  let s = 0, sel = null, miss = 0, free = false;
  const sentence = st => `Color the ${PARTS[st.part].en} ${st.color.en}.`;

  screenEl.innerHTML = `<section class="stage">
    <div id="chead"></div>
    <div class="cgrid">
      <div class="canvas sticker paint" id="canvas">${catSVG(fills)}</div>
      <div class="side">
        <div class="instr sticker" id="instr"></div>
        <div class="sticker" style="padding:16px">
          <div class="palette" id="pal">${palette.map(c => `<button class="swb" style="--c:${c.sw}" data-c="${c.en}" aria-pressed="false" aria-label="${c.en}"></button>`).join('')}</div>
        </div>
        <p class="cfeed" id="cfb" aria-live="polite"></p>
        <div class="row" id="cact"></div>
      </div>
    </div>
  </section>`;

  function head(){
    $('#chead').innerHTML = free
      ? `<div class="g-head"><h2>لوّني براحتك <span class="en" style="font-size:20px;color:var(--ink-soft)">Free painting</span></h2><p class="ask">خلصتي الجمل! كمّلي تلوين مشمش زي ما تحبي.</p></div>`
      : gameHead('لوّني مشمش','Color Mishmish','اقري الجملة، اختاري اللون، ودوسي على الجزء الصح', s, steps.length, steps.map(()=>true));
  }
  function instr(){
    if(free){
      $('#instr').innerHTML = `<span class="step">Free painting</span><p class="sentence">Now paint Mishmish your way!</p>${sayBtn('Now paint Mishmish your way!')}`;
      $('#cact').innerHTML = `<button class="btn primary" id="saveArt">احفظي في المعرض</button><button class="btn" id="newArt">رسمة جديدة</button>`;
      $('#saveArt').onclick = () => {
        S.gallery.unshift({...fills}); S.gallery = S.gallery.slice(0, 12); save('gallery');
        addStars(2); meow(); burst($('#canvas'));
        $('#cact').innerHTML = `<span>اتحفظت في المعرض! (+2 ⭐)</span><button class="btn" id="newArt2">رسمة جديدة</button><button class="btn" id="goHome2">الرئيسية</button>`;
        $('#newArt2').onclick = gameColor; $('#goHome2').onclick = () => home();
      };
      $('#newArt').onclick = gameColor;
      return;
    }
    const st = steps[s];
    $('#instr').innerHTML = `<span class="step">Step ${s+1} of ${steps.length}</span>
      <p class="sentence" lang="en">${sentence(st)}</p>
      <div class="row">${sayBtn(sentence(st))}</div>
      ${miss >= 2 ? `<p class="arhint">مساعدة: لوّني ${PARTS[st.part].ar} باللون ال${st.color.ar}</p>` : ''}`;
  }
  function clearHints(){ screenEl.querySelectorAll('.hint').forEach(x => x.classList.remove('hint')); }
  function showHints(){
    const st = steps[s];
    screenEl.querySelectorAll(`#canvas [data-part="${st.part}"]`).forEach(x => x.classList.add('hint'));
    screenEl.querySelector(`.swb[data-c="${st.color.en}"]`).classList.add('hint');
  }
  function paint(part, c){
    fills[part] = c.sw;
    screenEl.querySelectorAll(`#canvas [data-part="${part}"]`).forEach(x => x.setAttribute('fill', c.sw));
  }

  $('#pal').onclick = e => {
    const b = e.target.closest('.swb'); if(!b) return;
    sel = palette.find(c => c.en === b.dataset.c);
    screenEl.querySelectorAll('.swb').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    say(sel.en);
  };
  $('#canvas').onclick = e => {
    const el = e.target.closest('[data-part]'); if(!el) return;
    const part = el.dataset.part, fb = $('#cfb');
    if(!sel){ fb.style.color = 'var(--grape)'; fb.textContent = 'اختاري لون الأول من الألوان 🎨'; say(PARTS[part].en); return; }
    if(free){ paint(part, sel); sfxTick(); say(`${sel.en} ${PARTS[part].en}`); return; }
    const st = steps[s];
    if(part === st.part && sel.en === st.color.en){
      paint(part, sel); clearHints(); sfxGood(); burst(el);
      addStars(miss < 2 ? 1 : 0); say(rand(PRAISE));
      fb.style.color = 'var(--good)'; fb.innerHTML = `<span class="en">${st.color.en} ${PARTS[st.part].en}</span> ✔`;
      s++; miss = 0;
      if(s >= steps.length){ free = true; meow(); }
      head(); setTimeout(() => { instr(); if(!free) say(sentence(steps[s])); else say('Now paint Mishmish your way!'); }, 900);
    } else {
      miss++; sfxBad(); fb.style.color = 'var(--bad)';
      if(part !== st.part){
        fb.innerHTML = `ده <span class="en">${PARTS[part].en}</span>. دوّري على <span class="en">${PARTS[st.part].en}</span>`;
        say(`This is the ${PARTS[part].en}. Find the ${PARTS[st.part].en}.`);
      } else {
        fb.innerHTML = `اللون ده <span class="en">${sel.en}</span>. محتاجين <span class="en">${st.color.en}</span>`;
        say(`This is ${sel.en}. We need ${st.color.en}.`);
        const cw = VOCAB.find(v => v.en === st.color.en); if(cw) markTricky(cw);
      }
      if(miss >= 2){ instr(); showHints(); }
    }
  };
  head(); instr(); setTimeout(() => say(sentence(steps[0])), 300);
}

  });

  $('#startQ').onclick = q;
  function q(){
    const fb = $('#fb'); fb.className = 'feedback'; fb.innerHTML = '';
    if(qi >= st.qs.length){

      <div class="opts opts3">${Q.o.map((o,k) => `<button class="opt" data-k="${k}" aria-label="${o.en}">${optHTML(o)}</button>`).join('')}</div>`;
    $('#qa').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
    $('#qa').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if(done) return;
      const k = +b.dataset.k;
      if(k === Q.a){
        done = true; b.classList.add('right'); sfxGood(); burst(b);
        if(tries === 0){ firstTry++; addStars(1); }
        say(`${Q.o[k].en}! ${rand(PRAISE)}`);
        fb.className = 'feedback good'; fb.innerHTML = `<span class="en">${Q.o[k].en}</span><span>${rand(['برافو!','شاطرة!','صح كده!'])}</span>`;
        qi++; setTimeout(q, 2500);
      } else {
        tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad();
        fb.className = 'feedback bad'; fb.textContent = 'ارجعي اقري القصة تاني وجربي 👀';
        if(tries >= 2) $('#qa').querySelector(`.opt[data-k="${Q.a}"]`).classList.add('hint');
      }
    });
  }
}

/* ---------- learn: meet → match → recall ---------- */
function learnSession(keys, pool, back){
  setTop(true);
  let i = 0;
  const bedSt = keys.map(() => -1), bedWet = keys.map(() => false);
  const bed = (cur=-1, hideLabels=false) => `<div class="bed" style="--n:${keys.length}">${keys.map((k, j) =>
    `<span class="bed-pot ${j === cur ? 'now' : ''}" data-bed="${j}">${potSVG(bedSt[j], {wet:bedWet[j]})}<small lang="en">${bedSt[j] >= 0 && !hideLabels ? WORDS[k].en : '&nbsp;'}</small></span>`).join('')}</div>`;
  const potAt = j => screenEl.querySelector(`[data-bed="${j}"]`);
  function setPot(j, cls){ const el = potAt(j); if(!el) return; el.querySelector('svg').outerHTML = potSVG(bedSt[j], {wet:bedWet[j], cls}); }
  function meet(){
    if(i >= keys.length) return match();
    const w = WORDS[keys[i]];
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>ازرعي الكلمة <span class="en" style="font-size:20px;color:var(--ink-soft)">Plant</span></h2>
        <p class="ask">اسمعي الكلمة وقوليها بصوت عالي ٣ مرات، وبعدين ازرعي بذرتها 🌰</p></div>
      ${bed(i)}
      <div class="flash sticker">
        ${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}
        <p class="bigword" lang="en">${w.en}</p>
        <p class="flash-ar">${w.ar}</p>
        ${sayBtn(w.en)}
      </div>
      <button class="btn primary" id="nx">🌰 ازرعي <span class="en">${w.en}</span></button>
    </section>`;
    setTimeout(() => say(w.en, .75), 250);
    let busy = false;
    $('#nx').onclick = () => {
      if(busy) return; busy = true;
      const pot = potAt(i), seed = document.createElement('span');
      seed.className = 'seed-drop'; seed.textContent = '🌰'; pot.appendChild(seed);
      setTimeout(() => { bedSt[i] = 0; setPot(i, 'grew'); seed.remove(); sfxPlop(); pot.querySelector('small').textContent = w.en; }, reduce ? 50 : 520);
      setTimeout(() => { i++; meet(); }, reduce ? 300 : 1100);
    };
  }
  function match(){
    let selEn = null, left = keys.length;
    const ar = shuffle(keys), en = shuffle(keys);
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>اسقي البذور <span class="en" style="font-size:20px;color:var(--ink-soft)">Water</span></h2>
        <p class="ask">دوسي على الكلمة الإنجليزي وبعدين على معناها. كل ما تطابقي صح، بذرتها بتشرب مية 💧</p></div>
      ${bed()}
      <div class="match">
        <div class="mcol" dir="ltr">${en.map(k => `<button class="mbtn en" data-en="${esc(k)}">${WORDS[k].en}</button>`).join('')}</div>
        <div class="mcol">${ar.map(k => `<button class="mbtn" data-ar="${esc(k)}">${WORDS[k].ar}</button>`).join('')}</div>
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>`;
    screenEl.querySelectorAll('[data-en]').forEach(b => b.onclick = () => {
      if(b.classList.contains('ok')) return;
      screenEl.querySelectorAll('[data-en]').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); selEn = b.dataset.en; say(WORDS[selEn].en);
    });
    screenEl.querySelectorAll('[data-ar]').forEach(b => b.onclick = () => {
      if(b.classList.contains('ok')) return;
      if(!selEn){ $('#fb').className = 'feedback'; $('#fb').textContent = 'اختاري الكلمة الإنجليزي الأول'; return; }
      const eb = screenEl.querySelector(`[data-en="${CSS.escape(selEn)}"]`);
      if(b.dataset.ar === selEn){
        b.classList.add('ok'); eb.classList.add('ok'); eb.classList.remove('sel'); sfxGood(); left--;
        const j = keys.indexOf(selEn); selEn = null;
        const pt = potAt(j), can = document.createElement('span');
        can.className = 'bp-can'; can.innerHTML = CAN_SVG + '<span class="drops">' + '<i></i>'.repeat(4) + '</span>'; pt.appendChild(can); sfxWater();
        setTimeout(() => { bedWet[j] = true; setPot(j, 'grew'); }, reduce ? 50 : 700); setTimeout(() => can.remove(), 1250);
        if(!left){ setTimeout(recall, 1300); }
      } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad(); }
    });
  }
  function recall(){
    const queue = shuffle(keys), firstTry = {};
    let n = 0;
    function q(){
      if(!queue.length){
        keys.forEach(k => { if(!S.wl[k]) grow(k, true); });
        addStars(keys.length);
        return finish(() => learnSession(keys, pool, back), `زرعتي ${keys.length} كلمات جديدة في حديقتك وطلعت نبتات 🌱 بكرة هتعطش، ارجعي اسقيها عشان تكبر وتبقى شجرة 🌳`, back, 'ارجعي للدرس');
      }
      const k = queue[0], w = WORDS[k];
      const opts = shuffle([k, ...distract(k, 3, 'en', pool)]);
      let tries = 0, done = false;
      screenEl.innerHTML = `<section class="stage">
        <div class="g-head"><h2>طلّعي النبتة <span class="en" style="font-size:20px;color:var(--ink-soft)">Grow</span></h2>
          <p class="ask">إيه الكلمة الإنجليزي اللي معناها كده؟ كل كلمة تفتكريها بتطلع نبتة 🌱</p></div>
        ${bed(keys.indexOf(k), true)}
        <div class="qcard sticker">${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}<p class="flash-ar">${w.ar}</p></div>
        <div class="opts words">${opts.map(o => `<button class="opt wopt en" data-k="${esc(o)}">${WORDS[o].en}</button>`).join('')}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </section>`;
      screenEl.querySelectorAll('.wopt').forEach(b => b.onclick = () => {
        if(done) return;
        if(b.dataset.k === k){
          done = true; b.classList.add('right'); sfxGood(); say(w.en); queue.shift(); n++;
          const j = keys.indexOf(k); bedSt[j] = 1; setPot(j, 'sprout'); setTimeout(sfxGrow, 150);
          $('#fb').className = 'feedback good'; $('#fb').innerHTML = `<span class="en">${w.en}</span><span>${w.ar}</span>`;
          setTimeout(q, 2200);
        } else {
          tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad(); markTricky(w);
          if(tries === 1){ queue.push(queue.shift()); queue.unshift(k); }
          $('#fb').className = 'feedback bad'; $('#fb').innerHTML = `دي <span class="en">${WORDS[b.dataset.k].en}</span> = ${WORDS[b.dataset.k].ar}. جربي تاني`;
          if(tries >= 2) screenEl.querySelector(`.wopt[data-k="${CSS.escape(k)}"]`).classList.add('hint');
        }
      });
    }
    q();
  }
  meet();
}

/* ---------- review / watering ---------- */
function review(keys, pool, back, backLabel){
  setTop(true);
  if(!keys.length){ return back(); }
  const queue = [...keys], results = {}; let n = 0;
  function q(){
    if(!queue.length){
      const ok = Object.values(results).filter(Boolean).length;
      return finish(() => review(shuffle(keys), pool, back, backLabel), `سقيتي ${keys.length} زرعات، و${ok} منهم كبروا 🌷${ok < keys.length ? ' واللي ذبلوا هنسقيهم تاني قريب' : ''}`, back, backLabel === 'garden' ? 'الحديقة' : 'ارجعي للدرس');
    }
    const k = queue.shift(), w = WORDS[k];
    const enToAr = Math.random() < .5;
    const opts = shuffle([k, ...distract(k, 3, enToAr ? 'ar' : 'en', pool)]);
    let done = false;
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>اسقي الزرعة <span class="en" style="font-size:20px;color:var(--ink-soft)">Water</span></h2>
        <p class="ask">${isDue(k) ? 'الزرعة دي عطشانة! ' : ''}جاوبي صح عشان تسقيها وتكبر · ${enToAr ? 'معنى الكلمة دي إيه؟' : 'إيه الكلمة الإنجليزي؟'}</p>
        <div class="dots">${keys.map((_,j) => `<i class="${j < n ? 'done' : j === n ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="qcard sticker water-card">
        <div class="wc-plant">${waterScene(lvl(k), {dry:isDue(k)})}<span class="wc-stage" id="wcStage">${STAGE_AR[lvl(k)]}</span></div>
        <div class="wc-q">${enToAr ? `<p class="bigword" lang="en">${w.en}</p>${sayBtn(w.en)}` : `${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}<p class="flash-ar">${w.ar}</p>`}</div></div>
      <div class="opts words">${opts.map(o => `<button class="opt wopt ${enToAr ? '' : 'en'}" data-k="${esc(o)}">${enToAr ? WORDS[o].ar : WORDS[o].en}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>`;
    if(enToAr) setTimeout(() => say(w.en, .8), 250);
    screenEl.querySelectorAll('.wopt').forEach(b => b.onclick = () => {
      if(done) return; done = true; n++;

function grammarRun(gid, back){
  setTop(true);
  const G = GRAMMAR[gid];
  let si = 0;
  function slide(){
    const s = G.slides[si];
    const vis = typeof s.vis === 'function' ? s.vis() : (s.vis || '');
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>${G.ar} <span class="en" style="font-size:20px;color:var(--ink-soft)">${G.en}</span></h2>
        <div class="dots">${G.slides.map((_,k) => `<i class="${k < si ? 'done' : k === si ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="teach">
        <div class="teach-cat">${catSVG(S.mish, (() => { const x = {...S.equip}; delete x.bg; return x; })())}</div>
        <div class="teach-card sticker">
          <h3>${s.h}</h3>

        </div>

        ${si > 0 ? '<button class="btn" id="prev">السابق</button>' : ''}
        <button class="btn primary" id="next">${si < G.slides.length - 1 ? 'التالي' : 'فهمت! يلا نتمرن'}</button>
      </div>
    </section>`;
    setTimeout(() => say(s.ex[0].replace(/<[^>]+>/g, '')), 300);
    if($('#prev')) $('#prev').onclick = () => { si--; slide(); };
    $('#next').onclick = () => { if(si < G.slides.length - 1){ si++; slide(); } else practice(); };
  }
  function practice(){
    const qs = G.qs === 'PREP' ? prepQs() : G.qs;
    const results = []; let i = 0;
    function next(){
      if(i >= qs.length){
        const first = !S.gDone[gid]; S.gDone[gid] = true; save('gDone'); if(first) addStars(3);
        return finish(() => grammarRun(gid, back), `جاوبتي ${results.filter(Boolean).length} من ${qs.length} صح من أول مرة`, back, 'ارجعي للدرس');
      }

      const head = gameHead(G.ar, G.en, q.sub || (q.t === 'b' ? 'رتّبي الكلمات وكوّني الجملة' : q.t === 's' || q.t === 'o' ? q.q : q.t === 'l' ? 'اسمعي واختاري' : q.t === 'm' ? 'الـ e السحرية' : 'اختاري الإجابة الصح'), i, qs.length, results);
      const done = ok => { results[i] = ok; if(ok) addStars(1); setTimeout(() => { i++; next(); }, 1700); };
      if(q.t === 'c') choose(q, head, done);

const aspectOf = it => { if(it.vb){ const v = it.vb.split(' ').map(Number); return v[3] / v[2]; } return 1; };
const itemHPct = it => (it.size || 8) * aspectOf(it) / RH * 100;
const zOf = (it, pl) => it.kind === 'rug' ? 2 : it.kind === 'wall' ? 3 : 10 + Math.round(pl.y * 2);
function clampPl(it, x, y){
  const half = (it.size || 8) / 2, h = itemHPct(it);
  x = Math.max(half, Math.min(100 - half, x));
  if(it.kind === 'wall') y = Math.max(h + 2, Math.min(61, y));
  else if(it.kind === 'rug') y = Math.max(72, Math.min(99, y));
  else y = Math.max(67, Math.min(99, y));
  return {x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10};
}
function defaultSpot(it, fixed){
  const r = fixed ? .5 : Math.random(), r2 = fixed ? .5 : Math.random();
  if(it.kind === 'wall') return clampPl(it, Math.min(64 - it.size / 2, 8 + it.size / 2 + r * 44), 30 + r2 * 18);
  if(it.kind === 'rug') return clampPl(it, 30 + r * 40, 93);
  return clampPl(it, 8 + r * 84, 72 + r2 * 24);
}
function perchOf(it, pl){

  const f = it.perch != null ? 1 - it.perch / it.vb.split(' ').map(Number)[3] : (it.perchF != null ? it.perchF : .3);
  return {x: pl.x, y: pl.y - h * f, z: it.front ? zOf(it, pl) + 1 : zOf(it, pl) - 1};
}

  return `<div class="rwin sky-${s} ${S.room.curtain ? 'closed' : ''}" id="rwin"><div class="sky">${s === 'night' ? '<span class="moon">🌙</span><i></i><i></i><i></i><i></i>' : s === 'day' ? '<span class="sun">☀️</span><span class="cloud">☁️</span>' : '<span class="sun">🌇</span>'}</div><div class="frame"></div><div class="cur l"></div><div class="cur r"></div></div>`;
}
function mishHTML(x, y, z, id){
  return `<div class="rmish" ${id ? 'id="rmish"' : ''} style="left:${x}%;top:${y}%;z-index:${z}"><div class="flip">${catSVG(S.mish, lookNoBg())}</div><div class="bubble-r" hidden></div></div>`;
}
function roomScene(opts = {}){
  let items = S.room.items.slice(), wall = S.room.wall, floor = S.room.floor;
  const pv = opts.preview;
  if(pv){
    if(pv.kind === 'wallpaper') wall = pv.id;
    else if(pv.kind === 'flooring') floor = pv.id;
    else if(isPlaceable(pv) && !items.some(p => p.id === pv.id)) items.push({uid:'pv', id:pv.id, ...defaultSpot(pv, true)});
  }
  const W = ITEM_BY_ID[wall] || ITEM_BY_ID.w_default, F = ITEM_BY_ID[floor] || ITEM_BY_ID.f_default;
  const nodes = items.map(pl => { const it = ITEM_BY_ID[pl.id]; return it ? itemNode(pl, it, pl.uid === 'pv' ? 'pv' : '', opts.mini) : ''; }).join('');
  let m = '';
  if(opts.mini){
    const bed = items.find(p => ITEM_BY_ID[p.id] && ITEM_BY_ID[p.id].kind === 'catbed');
    const q = bed ? perchOf(ITEM_BY_ID[bed.id], bed) : {x:45, y:94, z:200};
    m = mishHTML(q.x, q.y, q.z);
  }
  return `<div class="room ${opts.mini ? 'rmini' : ''}" dir="ltr" ${opts.mini ? 'aria-hidden="true"' : 'id="room" role="img" aria-label="Farha\'s room"'}>
    <div class="r-wall" style="background:${esc(W.bg)}"></div><div class="r-floor" style="background:${esc(F.bg)}"></div><div class="r-skirt"></div>
    ${windowHTML()}${nodes}${m}</div>`;
}

/* Mishmish */
function bubble(text, ms = 2800){
  const m = $('#rmish'); if(!m) return;
  const b = m.querySelector('.bubble-r'); b.textContent = text; b.hidden = false;
  clearTimeout(mishSt.bt); mishSt.bt = setTimeout(() => { b.hidden = true; }, ms);
}
function walkTo(x, y, cb, z){
  const m = $('#rmish'); if(!m) return;
  m.classList.remove('sleeping','eating','dancing');
  mishSt.mode = 'walk';
  const d = Math.hypot(x - mishSt.x, (y - mishSt.y) * .6), t = Math.round(Math.max(250, Math.min(2400, d * 45)));
  if(Math.abs(x - mishSt.x) > .5) m.classList.toggle('left', x < mishSt.x);
  m.classList.add('walking');
  m.style.transition = `left ${t}ms linear, top ${t}ms linear`;
  m.style.left = x + '%'; m.style.top = y + '%'; m.style.zIndex = z != null ? z : 10 + Math.round(y * 2);
  mishSt.x = x; mishSt.y = y; mishSt.busy = Date.now() + t;
  clearTimeout(mishSt.tm);
  mishSt.tm = setTimeout(() => { m.classList.remove('walking'); mishSt.mode = 'idle'; if(cb) cb(); }, t + 40);
}
const clampX = x => Math.max(6, Math.min(94, x));
function mishAnim(cls, ms){ const m = $('#rmish'); if(!m) return; m.classList.remove(cls); void m.offsetWidth; m.classList.add(cls); setTimeout(() => m.classList.remove(cls), ms); }
function wake(){ const m = $('#rmish'); m.classList.remove('sleeping'); mishSt.mode = 'idle'; bubble('Good morning!'); }
function goSleep(pl){
  const it = ITEM_BY_ID[pl.id], q = perchOf(it, pl);
  walkTo(q.x, q.y, () => { $('#rmish').classList.add('sleeping'); mishSt.mode = 'sleep'; bubble('Zzz...'); }, q.z);
}
function playWith(pl, quiet){
  const it = ITEM_BY_ID[pl.id];
  walkTo(clampX(pl.x - it.size / 2 - 5), pl.y, () => {
    mishAnim('jump', 1100);
    const n = $(`#room [data-uid="${pl.uid}"]`); if(n){ n.classList.remove('hop'); void n.offsetWidth; n.classList.add('hop'); }
    bubble("Let's play!");
    if(!quiet){ say("Let's play!"); meow(); if(Date.now() - S.pet.playedAt > 15 * 60e3){ S.pet.playedAt = Date.now(); addJoy(1); } }
  });
}
const friendSt = {};
function friendBubble(id, text, ms = 3000){
  const n = $(`#room [data-friend="${id}"]`); if(!n) return;
  const b = n.querySelector('.bubble-r'); b.textContent = text; b.hidden = false;
  clearTimeout(friendSt[id].bt); friendSt[id].bt = setTimeout(() => { b.hidden = true; }, ms);
}
function friendWalk(id, x, y, cb){
  const n = $(`#room [data-friend="${id}"]`), st = friendSt[id]; if(!n || !st) return;
  const t = Math.round(Math.max(300, Math.min(2600, Math.hypot(x - st.x, (y - st.y) * .6) * 50)));
  if(Math.abs(x - st.x) > .5) n.classList.toggle('left', x < st.x);
  n.classList.add('walking'); n.style.transition = `left ${t}ms linear, top ${t}ms linear`;
  n.style.left = x + '%'; n.style.top = y + '%'; n.style.zIndex = 10 + Math.round(y * 2);
  st.x = x; st.y = y;
  setTimeout(() => { n.classList.remove('walking'); if(cb) cb(); }, t + 40);
}
function friendTap(id){
  const f = ITEM_BY_ID[id], n = $(`#room [data-friend="${id}"]`); if(!f || !n) return;
  tone(1100, 0, .12, 'sine', .08); meow();
  n.classList.remove('jump'); void n.offsetWidth; n.classList.add('jump'); setTimeout(() => n.classList.remove('jump'), 600);
  const line = rand([f.intro, `I love you, ${kidName()}!`, `Mishmish is my best friend!`, `Let's play, ${kidName()}!`]);
  friendBubble(id, line); setTimeout(() => say(line), 300);
}
function mishTap(){
  if(mishSt.mode === 'sleep'){ wake(); say('Good morning!'); return; }
  meow(); mishAnim('jump', 600);
  const line = rand([`I love you, ${kidName()}!`, 'Purr... purr...', "You're my best friend!", 'Thank you!', "Let's study together!"]);
  bubble(line); setTimeout(() => say(line), 450);
  if(Date.now() - S.pet.pettedAt > 20 * 60e3){ S.pet.pettedAt = Date.now(); addJoy(1); }
}
function feed(tid){
  const it = ITEM_BY_ID[tid]; if(!(S.treats[tid] > 0) || findSt) return;
  S.treats[tid]--; save('treats'); renderTreats();
  const bowl = placed('bowl')[0];
  const gx = bowl ? clampX(bowl.x - 7) : mishSt.x, gy = bowl ? bowl.y : mishSt.y;
  walkTo(gx, gy, () => {
    const m = $('#rmish'); m.classList.remove('left');
    S.pet.fedAt = Date.now(); addJoy(it.joy);
    if(bowl) refreshNode(bowl);
    m.classList.add('eating'); floatAt(gx + 4, gy - 16, it.e, 'fnote big');
    const t = `Yum! I love ${it.en}! Thank you, ${kidName()}!`; bubble(t, 3200); say(t);
    setTimeout(() => { m.classList.remove('eating'); meow(); }, 2600);
  });
}
function idleTick(){
  if(!$('#room')){ clearInterval(roomTimer); roomTimer = null; stopListening(); return; }
  if(editMode || findSt || document.hidden) return;
  myFriends().forEach(f => { if(Math.random() < .5 && friendSt[f.id]) friendWalk(f.id, clampX(6 + Math.random() * 88), 76 + Math.random() * 21); });
  if(Date.now() < mishSt.busy + 2500) return;
  const r = Math.random(), beds = placed('catbed'), toys = placed('cattoy');
  if(mishSt.mode === 'sleep'){ if(r < .25) wake(); return; }
  if(S.pet.hearts <= 1 && r < .4) return bubble(rand(["I'm hungry!","Feed me, please!"]));
  if(r < .45) walkTo(clampX(6 + Math.random() * 88), 74 + Math.random() * 23);
  else if(r < .6 && beds.length) goSleep(rand(beds));
  else if(r < .75 && toys.length) playWith(rand(toys), true);
  else bubble(rand(IDLE_LINES));
}

/* ---------- talk to Mishmish: voice (where the browser allows the mic) or typed commands ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let talkLang = 'en-US', talkRec = null;
const TALK_CHIPS = [
  ['Go to your bed', 'روحي سريرك'], ['Come here', 'تعالي هنا'], ['Eat your food', 'كلي أكلك'], ['Dance', 'ارقصي'],
  ['Jump', 'نطي'], ['Play with your toy', 'العبي'], ['Wake up', 'اصحي'], ['I love you', 'بحبك']
];

  const near = S.room.items.map(p => ITEM_BY_ID[p.id]).filter(it => it && !/^(c_|t_)/.test(it.id) && it.kind !== 'wallpaper' && it.kind !== 'flooring').slice(0, 3);

    <p class="talk-heard" id="talkHeard">${SpeechRec ? 'دوسي على المايك وقولي لمشمش تعمل حاجة، زي <span class="en">"Go to your bed"</span>' : 'أو اكتبي الأمر بالإنجليزي، أو دوسي على جملة من تحت.'}</p>
    <form class="talk-type" id="talkForm" dir="ltr"><input id="talkInput" lang="en" autocomplete="off" enterkeyhint="send" placeholder="🎤 Say or type: Go to your bed" maxlength="80"><button class="btn" type="submit">Send ➤</button></form>
    <div class="chips talk-chips" dir="ltr">${TALK_CHIPS.concat(near.map(it => [`Go to the ${it.en}`, `روحي عند ${it.ar}`])).map(([en, ar]) => `<button class="chip" data-cmd="${esc(en)}" title="${esc(ar)}"><span class="en">${esc(en)}</span><small>${esc(ar)}</small></button>`).join('')}</div>
  </div>`;
  $('#talkClose').onclick = () => { stopListening(); el.hidden = true; };

  el.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => { say(b.dataset.cmd); heard(b.dataset.cmd, true); });
  if($('#micGo')) $('#micGo').onclick = listen;

function stopListening(){ if(talkRec){ try{ talkRec.abort(); }catch(e){} talkRec = null; } const b = $('#micGo'); if(b){ b.classList.remove('listening'); b.textContent = '🎤 دوسي واتكلمي'; } }
function listen(){
  if(talkRec) return stopListening();
  const h = $('#talkHeard');
  let r;
  try{ r = new SpeechRec(); }catch(e){ h.textContent = 'المايك مش شغال هنا. اكتبي الجملة بدل كده 👇'; return; }
  talkRec = r; r.lang = talkLang; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  const b = $('#micGo'); b.classList.add('listening'); b.textContent = '👂 بسمعك... اتكلمي';
  let got = false;
  r.onresult = e => {
    const res = e.results[e.results.length - 1];
    const alts = [...res].map(a => a.transcript);
    h.innerHTML = `سمعتك بتقولي: <b class="en" dir="auto">"${esc(alts[0])}"</b>`;
    if(res.isFinal){ got = true; talkCommand(alts.find(a => talkCommand(a, true)) || alts[0]); }
  };
  r.onerror = e => {
    const blocked = /not-allowed|service-not-allowed|audio-capture/.test(e.error);
    h.textContent = blocked ? 'المايك مقفول هنا. استخدمي مايك كيبورد الموبايل: دوسي في المربع تحت، وبعدين على 🎤 اللي في الكيبورد واتكلمي 👇' : e.error === 'no-speech' ? 'مسمعتش حاجة. قربي من الموبايل وجربي تاني.' : 'حصلت مشكلة في المايك. جربي تاني أو اكتبي الجملة 👇';
    if(blocked && $('#micGo')){ $('#micGo').disabled = true; }
  };
  r.onend = () => { talkRec = null; const bb = $('#micGo'); if(bb){ bb.classList.remove('listening'); if(!bb.disabled) bb.textContent = '🎤 دوسي واتكلمي'; } };
  try{ r.start(); }catch(e){ stopListening(); }
}
function heard(text, typed){
  const h = $('#talkHeard'); if(h) h.innerHTML = `${typed ? 'كتبتي' : 'قولتي'}: <b class="en" dir="auto">"${esc(text)}"</b>`;
  talkCommand(text);
}
/* understand a command in English (or simple Egyptian Arabic); returns true when it was understood. With dry, only tests. */
function talkCommand(raw, dry){
  if(!$('#room') || editMode || findSt) return false;
  const t = ' ' + String(raw).toLowerCase().replace(/[^a-z؀-ۿ' ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  const has = (...ws) => ws.some(w => t.includes(w));
  const beds = placed('catbed'), toys = placed('cattoy');
  const reply = (line, ar) => { bubble(line, 3200); setTimeout(() => say(line), 300); const h = $('#talkHeard'); if(h && ar) h.insertAdjacentHTML('beforeend', `<br><small>✔ مشمش فهمتك: ${ar}</small>`); };
  let act = null;
  /* a friend cat by name: she comes to the middle and says hello */
  const fname = myFriends().find(f => t.includes(' ' + f.en.toLowerCase().replace('princess ', '') + ' ') || t.includes(f.ar.replace('الأميرة ', '')));
  if(fname && !dry){ friendWalk(fname.id, 60, 92, () => { friendBubble(fname.id, `Hi! I'm ${fname.en}!`); say(`Hi! I'm ${fname.en}!`); }); const h = $('#talkHeard'); if(h) h.insertAdjacentHTML('beforeend', `<br><small>✔ ${fname.ar} سمعتك وجت!</small>`); return true; }
  if(fname) return true;
  /* an item in the room by its English (or Arabic) name */
  const target = S.room.items.map(p => [p, ITEM_BY_ID[p.id]]).filter(([p, it]) => it && it.kind !== 'wallpaper' && it.kind !== 'flooring')
    .find(([p, it]) => t.includes(' ' + it.en.toLowerCase() + ' ') || (it.ar && t.includes(it.ar.split(' ')[0])));
  if(has(' bed', ' room', ' box', ' basket', ' house', ' sleep', ' nap', 'اوضت', 'أوضت', 'سرير', 'نامي', 'نام ', 'كرتون')) act = () => {
    if(!beds.length) return reply("I don't have a bed! Buy me one from the mall.", 'مشمش معندهاش سرير، اشتريلها واحد من المول');
    goSleep(beds[0]); reply("OK! I'm going to my bed. Good night!", 'راحت سريرها تنام');
  };
  else if(has('wake', 'good morning', 'اصحي', 'صباح')) act = () => { wake(); reply('Good morning! I am awake!', 'صحيت'); };
  else if(has('come', 'here', 'تعالي', 'تعال', 'هنا')) act = () => walkTo(50, 93, () => { mishAnim('jump', 600); reply("I'm here!", 'جت لحد عندك'); });
  else if(has(' eat', 'food', 'hungry', 'dinner', 'lunch', 'breakfast', 'كلي', 'كل ', 'أكل', 'اكل', 'جعان')) act = () => {
    const tid = Object.keys(S.treats).find(k => S.treats[k] > 0);
    if(!tid) return reply("I have no food! Please buy me some.", 'الأكل خلص، اشتريلها من المول');
    feed(tid); const h = $('#talkHeard'); if(h) h.insertAdjacentHTML('beforeend', '<br><small>✔ مشمش فهمتك: راحت تاكل</small>');
  };
  else if(has('dance', 'ارقص')) act = () => { playTune(rand(TUNES), .2); mishAnim('dancing', 3200); reply("Look! I'm dancing!", 'بترقص'); };
  else if(has('jump', 'hop', 'نط')) act = () => { mishAnim('jump', 1100); setTimeout(() => mishAnim('jump', 1100), 600); reply('Jump, jump!', 'بتنط'); };
  else if(has('play', 'ball', 'toy', 'العب', 'لعب')) act = () => {
    /* any toy in the room: her own cat toys first, then the room's toys and fun things */
    const roomToys = S.room.items.filter(p => { const it = ITEM_BY_ID[p.id]; return it && it.dept === 'fun' && !['r_books','r_dollhouse'].includes(it.id); });
    const pool = toys.length ? toys : roomToys;
    const done = '<br><small>✔ مشمش فهمتك: بتلعب</small>', h = $('#talkHeard');
    if(pool.length){ const pl = rand(pool), it = ITEM_BY_ID[pl.id]; playWith(pl); if(h) h.insertAdjacentHTML('beforeend', done); if(it.kind !== 'cattoy') setTimeout(() => say(`I love my ${it.en}!`), 1600); return; }
    const worn = S.equip.toy && ITEM_BY_ID[S.equip.toy];

function startFind(){

  const ids = [...new Set(S.room.items.map(p => p.id))].filter(id => ITEM_BY_ID[id]);
  if(ids.length < 3){ toast('محتاجة ٣ حاجات على الأقل في الأوضة. اشتري حاجات من المول!'); return; }
  if(editMode) setEdit(false);

}
function nextFind(){
  if(!findSt) return;
  if(findSt.round >= 4){ const t = `Great job, ${kidName()}!`; bubble(t); say(t); endFind(); return; }
  let id; do { id = rand(findSt.ids); } while(id === findSt.target && findSt.ids.length > 1);
  findSt.target = id; findSt.round++;
  const q = `Where is the ${ITEM_BY_ID[id].en}?`;
  bubble(q, 5000); say(q);
  const d = dayState();
  $('#findInfo').hidden = false;
  $('#findInfo').innerHTML = `<span class="pill">سؤال ${findSt.round} من 4</span> <b>مشمش بتسأل:</b> <span class="en">${esc(q)}</span> ${sayBtn(q, 'اسمعي تاني')} <small class="muted">${d.find < 5 ? `كل إجابة صح = ⭐ (لسه ${5 - d.find} نجوم النهارده)` : 'خلّصتي نجوم اللعبة دي النهارده، بس كمّلي اتمرني!'}</small>`;
}
function findCheck(pl, it, n){

function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DEALS = (() => {
  const d = new Date(), r = mulberry(d.getFullYear() * 500 + d.getMonth() * 40 + d.getDate()), out = [];
  const pick = (pool, n) => { let g = 0; while(n > 0 && g++ < 500){ const id = pool[Math.floor(r() * pool.length)].id; if(!out.includes(id)){ out.push(id); n--; } } };
  pick(ITEMS.filter(i => !isRoomThing(i) && !isFriend(i) && i.price >= 12), 3);
  pick(ITEMS.filter(i => isRoomThing(i) && i.kind !== 'treat' && i.price >= 12), 3);
  pick(ITEMS.filter(i => i.kind === 'treat'), 1);
  return new Set(out);
})();
const priceOf = it => DEALS.has(it.id) ? Math.ceil(it.price / 2) : it.price;
const MALL_LEVELS = [
  {id:'cat', ico:'🐱', ar:'دور مشمش', en:'Mishmish Fashion'},

];
const levelItems = lv => ITEMS.filter(i => (DEPTS.find(d => d.id === i.dept) || {}).floor === lv && i.price > 0);
function ownState(it){
  if(it.kind === 'treat') return {own:false, count:S.treats[it.id] || 0};
  const own = S.owned.includes(it.id);
  if(!own) return {own:false};
  if(isFriend(it)) return {own, on:true, label:'في الأوضة 🏠'};
  if(it.kind === 'wallpaper' || it.kind === 'flooring'){ const on = S.room[it.kind === 'wallpaper' ? 'wall' : 'floor'] === it.id; return {own, on, label: on ? 'متركّبة' : 'عندك ✓'}; }
  if(isRoomThing(it)){ const on = S.room.items.some(p => p.id === it.id); return {own, on, label: on ? 'في الأوضة' : 'في الدولاب'}; }
  const on = S.equip[it.slot] === it.id; return {own, on, label: on ? 'لابساه' : 'عندك ✓'};
}

/* ---------- Farha's money box: real pocket money for curriculum words and reading passages ----------
   The ledger (earned words, paid passages, every deposit/withdrawal) is the source of truth; balance and
   progress are derived from it. It is kept in the artifact's shared db so every device sees the same box,
   with localStorage as an offline copy. Copies from two devices merge by union, so nothing is lost. */
const BANK_KEEP = ['earned', 'paid', 'log', 'words', 'amount', 'perPassage', 'min', 'pin', 'setTs'];
const BANK_DEF = {earned:{}, paid:{}, log:[], words:10, amount:5, perPassage:1, min:10, pin:'', setTs:0};
const bankId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function bankNorm(o){
  const B = Object.assign({}, BANK_DEF, o || {});
  B.earned = Object.assign({}, B.earned); B.paid = Object.assign({}, B.paid);
  B.log = (Array.isArray(B.log) ? B.log : []).map(e => {
    const x = Object.assign({}, e);
    if(!x.id) x.id = String(x.ts || 0) + ':' + x.t + ':' + x.amt;
    if(x.t === 'in' && x.n == null && /كلمة/.test(x.why || '')){ const m = String(x.why).match(/^(\d+)/); x.n = m ? +m[1] : 1; }
    return x;
  });
  return B;
}
function bankDerive(B){
  let tin = 0, tout = 0, used = 0;
  B.log.forEach(e => { if(e.t === 'in'){ tin += e.amt; used += e.n || 0; } else tout += e.amt; });
  B.total = Math.round(tin * 100) / 100; B.out = Math.round(tout * 100) / 100;
  B.balance = Math.round((tin - tout) * 100) / 100;
  B.pending = Math.max(0, Object.keys(B.earned).length - used);
  B.log.sort((a, b) => (b.ts - a.ts) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return B;
}
function bankMerge(a, b){
  const m = bankNorm(a), r = bankNorm(b);
  Object.keys(r.earned).forEach(k => { if(!m.earned[k] || r.earned[k] < m.earned[k]) m.earned[k] = r.earned[k]; });
  Object.keys(r.paid).forEach(k => { if(!m.paid[k]) m.paid[k] = r.paid[k]; });
  const ids = new Set(m.log.map(e => e.id)); r.log.forEach(e => { if(!ids.has(e.id)) m.log.push(e); });
  if((r.setTs || 0) > (m.setTs || 0)) ['words', 'amount', 'perPassage', 'min', 'pin', 'setTs'].forEach(k => m[k] = r[k]);
  return m;
}
const bankPlain = B => { const o = {}; BANK_KEEP.forEach(k => o[k] = B[k]); return o; };
const canon = v => Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}' : JSON.stringify(v);
const bankCanon = o => canon(bankPlain(bankDerive(bankNorm(o))));
S.bank = bankDerive(bankNorm(store.get('bank', null)));
/* cloud sync state: 'local' (no db on this view), 'wait', 'ok', 'off' */
let bankDoc = null, bankSync = 'wait', bankWriting = false, bankDirty = false;
function bankSave(){
  store.set('bank', bankPlain(S.bank));
  if(!bankDoc) return;
  if(bankWriting){ bankDirty = true; return; }
  bankWriting = true;
  bankDoc.set(JSON.parse(JSON.stringify(bankPlain(S.bank)))).then(() => { if(bankSync !== 'ok'){ bankSync = 'ok'; bankStatusPaint(); } })
    .catch(e => { if(e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')){ bankDoc = null; bankSync = 'local'; bankStatusPaint(); } })
    .finally(() => { bankWriting = false; if(bankDirty){ bankDirty = false; bankSave(); } });
}
function bankStatusPaint(){
  const el = $('#bankSync'); if(!el) return;
  el.textContent = bankSync === 'ok' ? '☁️ الحصالة محفوظة على كل الأجهزة' : bankSync === 'wait' ? '☁️ بنوصل الحصالة بكل الأجهزة...' : '📱 الحصالة محفوظة على الجهاز ده بس دلوقتي';
  el.className = 'bank-sync ' + bankSync;
}
(async () => {
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ bankSync = 'local'; bankStatusPaint(); return; }
  bankDoc = db.doc('bank/farha');
  const timer = setTimeout(() => { if(bankSync === 'wait'){ bankSync = 'local'; bankStatusPaint(); } }, 10000);
  bankDoc.onSnapshot(snap => {
    if(snap.metadata && snap.metadata.fromCache) return;
    clearTimeout(timer);
    const remote = snap.exists ? snap.data() : null;
    const before = bankCanon(S.bank);
    if(remote) S.bank = bankDerive(bankMerge(S.bank, remote));
    const after = bankCanon(S.bank);
    bankSync = 'ok';
    store.set('bank', bankPlain(S.bank));
    if(!remote || bankCanon(remote) !== after) bankSave();
    bankStatusPaint();
    if(after !== before) bankRefresh();
  }, () => { clearTimeout(timer); bankDoc = null; bankSync = 'local'; bankStatusPaint(); });
})();

const KB_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function spellTest(words, back, forMoney){
  setTop(true);
  let i = 0, earnedNow = 0, gotWords = 0;
  let keyHandler = null;
  const stop = () => { if(keyHandler){ document.removeEventListener('keydown', keyHandler); keyHandler = null; } };
  function q(){
    stop();
    if(i >= words.length) return summary();
    const w = words[i], target = w.en.toLowerCase(), already = !!S.bank.earned[bk(w)];
    let typed = '', tries = 0, helped = false, done = false;
    screenEl.innerHTML = `<section class="stage spell-test">
      <div class="g-head"><h2>اكتبي الكلمة بالإنجليزي <span class="en" style="font-size:20px;color:var(--ink-soft)">Write it</span></h2>
        <div class="dots">${words.map((_, j) => `<i class="${j < i ? 'done' : j === i ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="st-top">
        <span class="mini-box" id="miniBox">${boxSVG()}<b>${money(S.bank.balance)}</b></span>
        ${forMoney && S.bank.words > 1 ? `<small class="st-prog">🪙 ${S.bank.pending}/${S.bank.words} كلمة للـ ${money(S.bank.amount)} جنيه الجاية</small>` : forMoney ? '' : '<small class="st-prog">تدريب (من غير فلوس)</small>'}
      </div>
      <div class="qcard sticker st-card">${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}<p class="flash-ar">${esc(w.ar)}</p>
        ${forMoney && !already ? '<span class="st-badge">🪙 عليها فلوس</span>' : ''}</div>
      <div class="slots" dir="ltr" id="slots"></div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="kb" dir="ltr" id="kb">
        ${KB_ROWS.map((r, ri) => `<div class="kb-row">${ri === 2 ? '<button class="key wide" data-key="back" aria-label="امسحي">⌫</button>' : ''}${[...r].map(c => `<button class="key" data-key="${c}">${c}</button>`).join('')}${ri === 2 ? '<button class="key wide ok" data-key="enter">✔</button>' : ''}</div>`).join('')}
        ${target.includes(' ') ? '<div class="kb-row"><button class="key space" data-key=" ">space</button></div>' : ''}
      </div>
      <div class="row st-help">
        <button class="btn sm" id="hHear">🔊 اسمعيها</button>
        <button class="btn sm" id="hLetter">💡 حرف</button>
        <button class="btn sm" id="hSkip">مش عارفاها</button>
      </div>
      <small class="muted">${forMoney && !already ? 'لو استخدمتي مساعدة، الكلمة مش هتتحسب فلوس المرة دي.' : ''}</small>
    </section>`;
    const slots = () => {
      $('#slots').innerHTML = [...target].map((c, j) => c === ' ' ? '<i class="gap"></i>' : `<span class="slot ${j === typed.length ? 'cur' : ''}">${typed[j] && typed[j] !== ' ' ? typed[j] : ''}</span>`).join('');
    };
    slots();
    const press = k => {
      if(done) return;
      if(k === 'back'){ typed = typed.slice(0, -1); if(typed.endsWith(' ')) typed = typed.slice(0, -1); slots(); sfxTick(); return; }
      if(k === 'enter') return check();
      if(typed.length >= target.length) return;
      typed += k; if(target[typed.length] === ' ' && k !== ' ') typed += ' ';
      sfxTick(); slots();
      if(typed.length === target.length) setTimeout(check, 250);
    };
    function check(){
      if(done || !typed.trim()) return;
      if(typed.length < target.length){ $('#fb').className = 'feedback'; $('#fb').textContent = `الكلمة ${target.replace(/ /g, '').length} حروف. كمّلي!`; return; }
      if(typed === target){
        done = true; gotWords++; sfxGood(); say(w.en); addStars(1);
        $('#slots').classList.add('right');
        let paid = 0, counted = false;
        if(forMoney && !helped && !already){ counted = true; paid = bankWord(w); earnedNow += paid; if(WORDS[w.en] && !S.wl[w.en]) grow(w.en, true); }
        if(counted){ flyCoin($('#slots'), paid ? money(paid) : '🪙'); setTimeout(paid ? sfxMoney : sfxCoin, 500); }
        $('#fb').className = 'feedback good';
        $('#fb').innerHTML = counted ? (paid ? `<span>برافو! نزل <b>${money(paid)} جنيه</b> في الحصالة! 🎉</span>` : `<span>برافو! الكلمة اتحسبت 🪙 · فاضل ${nWords(S.bank.words - S.bank.pending)} وتكسبي ${money(S.bank.amount)} جنيه</span>`)
          : `<span class="en">${esc(w.en)}</span><span>صح! ${helped && forMoney ? '(استخدمتي مساعدة، جربيها تاني بعدين عشان تتحسب)' : ''}</span>`;
        if(paid) burst($('#miniBox'));
        setTimeout(() => { $('#miniBox b').textContent = money(S.bank.balance); }, 700);
        setTimeout(() => { i++; q(); }, paid ? 3600 : 2800);
      } else {
        tries++; sfxBad();
        $('#slots').innerHTML = [...target].map((c, j) => c === ' ' ? '<i class="gap"></i>' : `<span class="slot ${typed[j] === c ? 'ok' : 'bad'}">${typed[j] || ''}</span>`).join('');
        if(tries < 2){
          $('#fb').className = 'feedback bad'; $('#fb').textContent = 'قربتي! الحروف الحمرا غلط. صلّحيها وجربي تاني';
          setTimeout(() => { if(!done){ let keep = ''; for(let j = 0; j < target.length && typed[j] === target[j]; j++) keep += typed[j]; typed = keep; slots(); } }, 2000);
        } else reveal();
      }
    }
    function reveal(){
      done = true; sfxBad(); markTricky(w); say(w.en);
      $('#slots').innerHTML = [...target].map(c => c === ' ' ? '<i class="gap"></i>' : `<span class="slot show">${c}</span>`).join('');
      $('#fb').className = 'feedback bad'; $('#fb').innerHTML = `<span class="en">${esc(w.en)}</span><span>${esc(w.ar)} · ذاكريها كمان شوية وجربي تاني</span>`;
      setTimeout(() => { i++; q(); }, 3800);
    }
    $('#kb').onclick = e => { const b = e.target.closest('[data-key]'); if(b) press(b.dataset.key); };
    keyHandler = e => {
      if(e.ctrlKey || e.metaKey || e.altKey) return;
      if(e.key === 'Backspace'){ e.preventDefault(); press('back'); }
      else if(e.key === 'Enter'){ e.preventDefault(); press('enter'); }
      else if(/^[a-zA-Z ]$/.test(e.key)){ e.preventDefault(); press(e.key.toLowerCase()); }
    };
    document.addEventListener('keydown', keyHandler);
    $('#hHear').onclick = () => { helped = true; say(w.en, .7); };
    $('#hLetter').onclick = () => {
      if(done) return; helped = true;
      let keep = ''; for(let j = 0; j < target.length && typed[j] === target[j]; j++) keep += typed[j];
      typed = keep + target[keep.length]; if(target[typed.length] === ' ') typed += ' ';
      slots(); if(typed.length === target.length) setTimeout(check, 250);
    };
    $('#hSkip').onclick = () => { if(!done) reveal(); };
  }
  function summary(){
    stop();
    const B = S.bank;
    screenEl.innerHTML = `<section class="done-wrap">
      <div class="box-wrap big" id="moneyBox">${boxSVG()}</div>
      <h2 lang="en" dir="ltr">${gotWords === words.length ? 'Amazing!' : 'Good job!'}</h2>
      <div class="sum-list sticker">
        <p>✔ كتبتي <b>${gotWords}</b> من <b>${words.length}</b> صح</p>
        ${forMoney ? `${earnedNow ? `<p class="sum-win">🎉 كسبتي <b>${money(earnedNow)} جنيه</b> في الجولة دي!</p>` : ''}
        <p>💰 في حصالتك دلوقتي: <b>${money(B.balance)} جنيه</b></p>
        ${B.words > 1 && B.amount > 0 ? `<div class="sum-next"><p>🪙 المكافأة الجاية: حفظتي <b>${B.pending}</b> من <b>${B.words}</b></p>
          <span class="bar"><i style="width:${B.pending / B.words * 100}%"></i></span>
          <p>${B.words - B.pending === 1 ? 'كلمة واحدة كمان' : `${nWords(B.words - B.pending)} كمان`} وتاخدي <b>${money(B.amount)} جنيه</b></p></div>` : ''}` : ''}
      </div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn primary" id="again">${forMoney ? 'كلمات تانية' : 'تدريب تاني'}</button>
        <button class="btn" id="toBank">الحصالة 💰</button>
      </div>
    </section>`;
    if(earnedNow){ sfxMoney(); burst($('#moneyBox')); }
    $('#again').onclick = back;
    $('#toBank').onclick = bankScreen;
  }
  q();
}

function readPassage(pid){
  setTop(true);
  const P = PASSAGES.find(p => p.id === pid), B = S.bank, key = 'p:' + pid, already = !!B.paid[key];
  const lines = P.lines;
  let i = 0, timer = null;
  const fmtLine = t => {
    const m = t.match(/^([A-Z][\w.' ]{0,20}):\s(.*)$/);
    const words = s => s.split(/(\s+)/).map(x => /\w/.test(x) ? `<span class="rw" data-say="${esc(x.replace(/[^\w'-]/g, ''))}">${esc(x)}</span>` : esc(x)).join('');
    return m ? `<b class="spk">${esc(m[1])}:</b> ${words(m[2])}` : words(t);
  };
  function draw(){
    clearInterval(timer);
    const t = lines[i], wait = Math.max(2, Math.round(t.split(/\s+/).length * .45));
    screenEl.innerHTML = `<section class="stage read-run">
      <div class="g-head"><h2 class="en">${esc(P.title)}</h2>
        <p class="ask">اقري الجملة بصوت عالي. لو في كلمة صعبة دوسي عليها تسمعيها.</p>
        <div class="dots">${lines.map((_, j) => `<i class="${j < i ? 'done' : j === i ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="st-top"><span class="mini-box" id="miniBox">${boxSVG()}<b>${money(B.balance)}</b></span>
        <small class="st-prog">${already ? 'قريتيها قبل كده (تدريب)' : `🪙 القطعة دي عليها ${money(B.perPassage)} جنيه`}</small></div>
      <div class="read-prev en" dir="ltr">${lines.slice(Math.max(0, i - 2), i).map(l => `<p>${fmtLine(l)}</p>`).join('')}</div>
      <div class="read-line sticker en" dir="ltr" lang="en">${fmtLine(t)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="rHear">🔊 اسمعي الجملة</button>
        <button class="btn primary" id="rNext" disabled>✔ قريتها (<span id="rWait">${wait}</span>)</button>
      </div>
      <small class="muted">جملة ${i + 1} من ${lines.length}</small>
    </section>`;
    let left = wait;
    timer = setInterval(() => {
      left--; const w = $('#rWait'); if(!w){ clearInterval(timer); return; }
      if(left > 0) w.textContent = left;
      else { clearInterval(timer); const n = $('#rNext'); n.disabled = false; n.textContent = i < lines.length - 1 ? '✔ قريتها' : '✔ خلصت القطعة!'; }
    }, 1000);
    $('#rHear').onclick = () => say(t.replace(/^[A-Z][\w.' ]{0,20}:\s/, ''), .8);
    $('#rNext').onclick = () => { clearInterval(timer); sfxTick(); i++; if(i < lines.length) draw(); else done(); };
  }
  function done(){
    let paid = 0;
    const B = S.bank;
    if(!already && !B.paid[key] && B.perPassage > 0){ B.paid[key] = Date.now(); paid = B.perPassage; bankAdd(paid, `قطعة: ${P.title}`); }
    addStars(2);
    screenEl.innerHTML = `<section class="done-wrap">
      <div class="box-wrap big" id="moneyBox">${boxSVG()}</div>
      <h2 lang="en" dir="ltr">Great reading!</h2>
      <p>قريتي القطعة كلها: <span class="en">${esc(P.title)}</span></p>
      ${paid ? `<p class="pill stars" style="font-size:22px">نزل ${money(paid)} جنيه في حصالتك! 🎉</p>` : '<p>القطعة دي خدتي فلوسها قبل كده. اقري قطعة جديدة عشان تكسبي أكتر!</p>'}
      <p>في حصالتك دلوقتي <b>${money(B.balance)} جنيه</b></p>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn primary" id="more">قطعة تانية 📖</button>
        <button class="btn" id="toBank">الحصالة 💰</button>
      </div>
    </section>`;
    if(paid){ sfxMoney(); burst($('#moneyBox')); meow(); }
    $('#more').onclick = readHub; $('#toBank').onclick = bankScreen;
  }
  draw();
}

const NOTE_COLORS = ['#FFF6C9', '#FFE1EC', '#DDF3FF', '#E3F8DD', '#EDE3FF', '#FFE8D1'];
const NOTE_STICKERS = ['🐱', '😺', '⭐', '🌸', '💖', '🎀', '🦋', '🍓', '🎨', '📚', '✏️', '🌙', '☀️', '🎉', '🧁', '🐾', '🌷', '🍀'];
const nbStored = store.get('notes', {notes: []});
let NB = {notes: nbStored.notes || [], pin: nbStored.pin || '', pinTs: nbStored.pinTs || 0};
let nbUnlocked = false;
const liveNotes = () => NB.notes.filter(n => !n.deleted).sort((a, b) => b.updated - a.updated);
function nbMerge(a, b){
  const m = new Map();
  [...a, ...b].forEach(n => { const o = m.get(n.id); if(!o || (n.updated || 0) > (o.updated || 0)) m.set(n.id, n); });
  return [...m.values()].sort((x, y) => (y.updated - x.updated) || (x.id < y.id ? -1 : 1));
}
let nbDoc = null, nbWriting = false, nbDirty = false;
function nbSave(){
  NB.notes = nbMerge(NB.notes, []);
  store.set('notes', NB);
  if(!nbDoc) return;
  if(nbWriting){ nbDirty = true; return; }
  nbWriting = true;
  nbDoc.set(JSON.parse(JSON.stringify(NB))).catch(e => { if(e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) nbDoc = null; })
    .finally(() => { nbWriting = false; if(nbDirty){ nbDirty = false; nbSave(); } });
}
(async () => {
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db) return;
  nbDoc = db.doc('notebook/farha');
  nbDoc.onSnapshot(snap => {
    if(snap.metadata && snap.metadata.fromCache) return;
    const rd = snap.exists ? snap.data() : null, remote = rd ? (rd.notes || []) : null;
    const before = canon(NB);
    if(remote){ NB.notes = nbMerge(NB.notes, remote); if((rd.pinTs || 0) > (NB.pinTs || 0)){ NB.pin = rd.pin || ''; NB.pinTs = rd.pinTs; } }
    const after = canon(NB);
    store.set('notes', NB);
    if(!rd || canon({notes: nbMerge(remote, []), pin: rd.pin || '', pinTs: rd.pinTs || 0}) !== after) nbSave();
    if(after !== before && screenEl.querySelector('.nb-list')) notesScreen(true);
  }, () => { nbDoc = null; });
})();
const noteDate = ts => new Date(ts).toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});

        <button class="btn sm" id="nbLockBtn">🔒 اقفلي الدفتر</button><button class="btn sm" id="nbPinBtn">🔑 غيّري الرقم السري</button></div>
    </div>
    ${list.length ? `<div class="nb-list">${list.map(n => `<button class="nb-card" data-note="${n.id}" style="--paper:${n.color || NOTE_COLORS[0]}">

        <small>${noteDate(n.updated)}</small></button>`).join('')}</div>`
      : `<p class="empty">الدفتر لسه فاضي. دوسي «اكتبي حاجة جديدة» وابدأي أول صفحة! 📝</p>`}

  $('#newNote').onclick = () => noteEdit(null);
  $('#nbLockBtn').onclick = () => { nbUnlocked = false; home(); toast('الدفتر اتقفل 🔒'); };
  $('#nbPinBtn').onclick = () => notebookLock(() => toast('اتغيّر الرقم السري بتاع دفترك 🔑'), true);

}
function noteEdit(id){
  setTop(true);
  let n = id ? NB.notes.find(x => x.id === id) : null;
  const draft = n ? {...n} : {id: bankId(), text: '', color: NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)], sticker: '🐱', created: Date.now(), updated: Date.now()};
  let saved = !!n, timer = null;
  screenEl.innerHTML = `<section class="stage nb-edit">
    <nav class="crumbs"><button id="cNotes">دفتر ${KID_AR}</button><span aria-hidden="true">‹</span><span>${n ? 'صفحة' : 'صفحة جديدة'}</span></nav>
    <div class="nb-paper sticker" id="paper" style="--paper:${draft.color}">
      <div class="nb-top"><span class="nb-stk big" id="stk">${draft.sticker}</span><small>${noteDate(draft.created)}</small></div>
      <textarea id="noteTa" dir="auto" maxlength="3000" placeholder="اكتبي هنا... Write here...">${esc(draft.text)}</textarea>
      <small class="nb-status" id="nbStatus">${n ? '✔ محفوظة' : ''}</small>
    </div>
    <div class="nb-tools">
      <div class="nb-row"><b>لون الورقة:</b>${NOTE_COLORS.map(c => `<button class="nb-color ${c === draft.color ? 'on' : ''}" data-color="${c}" style="background:${c}" aria-label="لون"></button>`).join('')}</div>
      <div class="nb-row"><b>ستيكر:</b>${NOTE_STICKERS.map(s => `<button class="nb-sticker ${s === draft.sticker ? 'on' : ''}" data-stk="${s}">${s}</button>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="nbDone">✔ خلّصت</button>
      <button class="btn" id="nbHear">🔊 اسمعي اللي كتبتيه</button>
      ${n ? '<button class="btn" id="nbDel" style="background:var(--bad-l)">🗑️ امسحي الصفحة</button>' : ''}
    </div>
    <div class="row" id="delRow" style="justify-content:center"></div>
  </section>`;
  const ta = $('#noteTa');
  const commit = () => {
    clearTimeout(timer);
    draft.text = ta.value;
    if(!saved && !draft.text.trim()) return;
    draft.updated = Date.now();
    NB.notes = NB.notes.filter(x => x.id !== draft.id).concat([{...draft}]);
    saved = true; nbSave();
    const st = $('#nbStatus'); if(st) st.textContent = '✔ محفوظة';
  };
  ta.oninput = () => { const st = $('#nbStatus'); if(st) st.textContent = '...'; clearTimeout(timer); timer = setTimeout(commit, 700); };
  if(!n) setTimeout(() => ta.focus(), 100);
  screenEl.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    draft.color = b.dataset.color; $('#paper').style.setProperty('--paper', draft.color);
    screenEl.querySelectorAll('[data-color]').forEach(x => x.classList.toggle('on', x === b)); if(saved || ta.value.trim()) commit();
  });
  screenEl.querySelectorAll('[data-stk]').forEach(b => b.onclick = () => {
    draft.sticker = b.dataset.stk; $('#stk').textContent = draft.sticker; sfxTick();
    screenEl.querySelectorAll('[data-stk]').forEach(x => x.classList.toggle('on', x === b)); if(saved || ta.value.trim()) commit();
  });
  const leave = () => { commit(); notesScreen(); };
  $('#cNotes').onclick = leave;
  $('#nbDone').onclick = () => { commit(); if(ta.value.trim()){ sfxGood(); toast('اتحفظت في دفترك 📒'); } notesScreen(); };
  $('#nbHear').onclick = () => { const t = ta.value.trim(); if(t) say(t, .85); };
  if($('#nbDel')) $('#nbDel').onclick = () => {
    $('#delRow').innerHTML = '<span>متأكدة إنك عاوزة تمسحي الصفحة دي؟</span><button class="btn" id="yesDel" style="background:var(--bad-l)">أيوه امسحي</button><button class="btn" id="noDel">لأ</button>';
    $('#noDel').onclick = () => { $('#delRow').innerHTML = ''; };
    $('#yesDel').onclick = () => {
      clearTimeout(timer);
      NB.notes = NB.notes.filter(x => x.id !== draft.id).concat([{id: draft.id, deleted: true, updated: Date.now()}]);
      nbSave(); notesScreen(); toast('اتمسحت الصفحة');
    };
  };
  ta.onblur = () => { if(document.body.contains(ta)) commit(); };   /* leaving with the top home button blurs first */
}

/* parent PIN, settings and withdrawals */
function modal(html){
  const m = document.createElement('div'); m.className = 'bk-modal'; m.innerHTML = `<div class="bk-box sticker" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m); m.addEventListener('click', e => { if(e.target === m) m.remove(); });
  return m;
}
/* one 4-digit PIN dialog for both locks: the parents' (money) and Farha's own (notebook) */
function pinDialog(o){
  const setting = o.forceSet || !o.current();
  const T = o.text;
  let first = '', pin = '';
  const m = modal(`<h3>${setting ? T.setTitle : T.title}</h3>
    <p class="muted" id="pinNote">${o.note || (setting ? T.setNote : T.note)}</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" dir="ltr">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✕'].map(k => `<button class="key" data-p="${k}">${typeof k === 'number' ? AR_DIG[k] : k}</button>`).join('')}</div>
    ${!setting && o.forgot ? '<button class="btn sm" id="pinForgot">نسيتي الرقم؟</button>' : ''}`);
  const dots = () => { m.querySelector('#pinDots').innerHTML = [0,1,2,3].map(j => `<i class="${j < pin.length ? 'on' : ''}"></i>`).join(''); };
  const say2 = t => { m.querySelector('#pinNote').textContent = t; };
  dots();
  if(m.querySelector('#pinForgot')) m.querySelector('#pinForgot').onclick = () => { m.remove(); o.forgot(); };
  m.querySelector('.pin-pad').onclick = e => {
    const b = e.target.closest('[data-p]'); if(!b) return;
    const k = b.dataset.p;
    if(k === '✕'){ m.remove(); return o.onCancel && o.onCancel(); }
    if(k === '⌫'){ pin = pin.slice(0, -1); return dots(); }
    if(pin.length >= 4) return;
    pin += k; dots(); sfxTick();
    if(pin.length < 4) return;
    m.classList.add('busy');
    setTimeout(() => {
      m.classList.remove('busy');
      if(setting && !first){ first = pin; pin = ''; dots(); say2(T.again); return; }
      if(setting){
        if(pin !== first){ first = ''; pin = ''; dots(); say2(T.mismatch); sfxBad(); return; }
        o.save(pin); m.remove(); return o.onOk();
      }
      if(pin === o.current()){ m.remove(); o.onOk(); }
      else { pin = ''; dots(); sfxBad(); say2(T.wrong); m.querySelector('.bk-box').classList.remove('shake'); void m.offsetWidth; m.querySelector('.bk-box').classList.add('shake'); }
    }, 150);
  };
}
function askPin(onOk, note='', forceSet=false){
  pinDialog({onOk, note, forceSet, current: () => S.bank.pin,
    save: p => { S.bank.pin = p; S.bank.setTs = Date.now(); bankSave(); },
    text: {title:'الرقم السري لبابا أو ماما', note:'اكتبوا الرقم السري.', setTitle:'بابا أو ماما: اعملوا رقم سري',
      setNote:'اختاروا ٤ أرقام. هتحتاجوها لما فرحة تسحب فلوس أو تبدأ تكسب أو تغيّروا الإعدادات.', again:'اكتبوا نفس الرقم تاني للتأكيد.',
      mismatch:'الرقمين مش زي بعض. ابدأوا من الأول.', wrong:'الرقم غلط. جربوا تاني.'}});
}
/* Farha's own notebook lock; if she forgets it, a parent PIN lets her choose a new one */
function notebookLock(onOk, forceSet=false){
  pinDialog({onOk, forceSet, current: () => NB.pin,
    save: p => { NB.pin = p; NB.pinTs = Date.now(); nbSave(); },
    forgot: () => askPin(() => notebookLock(onOk, true), `${KID_AR} نسيت الرقم السري بتاع دفترها. اكتبوا رقمكم علشان تعمل رقم جديد (الدفتر مش هيتفتح ليكم).`),
    text: {title:`🔒 دفتر ${KID_AR}`, note:'اكتبي الرقم السري بتاعك.', setTitle:'🔒 اعملي رقم سري لدفترك',
      setNote:'اختاري ٤ أرقام سهل تفتكريها، ومتقوليهاش لحد. محدش هيقدر يفتح الدفتر غيرك.', again:'اكتبي نفس الرقم تاني علشان نتأكد.',
      mismatch:'الرقمين مش زي بعض. ابدأي من الأول.', wrong:'الرقم غلط. جربي تاني.'}});
}

/* ---------- Arabic digits: numbers in Arabic text show as ٠١٢٣٤٥٦٧٨٩; English stays as is ---------- */
const AR_DIG = '٠١٢٣٤٥٦٧٨٩', DIG_SKIP = '.en,[lang="en"],[dir="ltr"],script,style,textarea,code,.note-text';
function arDigit(n){
  const t = n.data;
  if(!/[0-9]/.test(t) || /[A-Za-z]/.test(t)) return;
  const p = n.parentElement; if(!p || p.closest(DIG_SKIP)) return;
  n.data = t.replace(/[0-9]/g, d => AR_DIG[d]).replace(/%/g, '٪');
}
function arDigitsIn(root){ const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); for(let n = w.nextNode(); n; n = w.nextNode()) arDigit(n); }
new MutationObserver(ms => ms.forEach(m => {
  if(m.type === 'characterData') arDigit(m.target);
  else m.addedNodes.forEach(x => x.nodeType === 3 ? arDigit(x) : x.nodeType === 1 && arDigitsIn(x));
})).observe(document.body, {childList:true, subtree:true, characterData:true});

/* ---------- boot ---------- */
function start(){ renderSound(); renderStars(); home(); arDigitsIn(document.body); }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();

<title>Mishmish Study Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: a sketchbook desk. Sticker-style cards with a hard ink shadow sit on dotted lilac paper; one stage at a time. */
:root{
  --paper:#F3EEFF; --dot:#D9CFF4; --card:#FFFFFF; --ink:#2B2233; --ink-soft:#5E546B;
  --tangerine:#FF8A3D; --tangerine-l:#FFE1CC;
  --teal:#159E8F; --teal-l:#CDF1EA;
  --pink:#F2558F; --pink-l:#FFDCEA;
  --sun:#F5B700; --sun-l:#FFF0BF;
  --grape:#7A4FD6; --grape-l:#E6DCFF;
  --good:#23A452; --good-l:#D7F5E0; --bad:#D93A30; --bad-l:#FFE0DD;
  --display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --learn:"Andika","Baloo Bhaijaan 2","Segoe UI",Arial,sans-serif;
  --r:20px; --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:var(--display);font-size:18px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:26px 26px;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.en{font-family:var(--learn);direction:ltr;unicode-bidi:isolate}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;line-height:1}
.brand svg{width:40px;height:40px}
.brand small{display:block;font-size:13px;font-weight:500;color:var(--ink-soft)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:800}
.stars{background:var(--sun-l);font-size:20px}
.stars b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.icon-btn{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:4px 12px;font-weight:700;font-size:16px}
.icon-btn:hover{background:var(--grape-l)}

main{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}

.sticker{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 22px;font-weight:800;font-size:19px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--tangerine)}
.btn.soft{background:var(--sun-l)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.say{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--teal-l);padding:4px 14px;font-weight:700;font-size:16px}
.say svg{width:20px;height:20px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center}
.hero-cat svg{width:100%;height:auto;display:block}
.bubble{padding:20px 24px;position:relative;display:grid;gap:8px}
.bubble .hello{font-size:34px;font-weight:700;margin:0;line-height:1.2}
.bubble p{margin:0;max-width:56ch}
.sec-title{font-size:24px;font-weight:800;margin:36px 0 12px;text-wrap:balance}
.sec-title span{font-family:var(--learn);font-weight:700;color:var(--ink-soft);font-size:17px;margin-inline-start:8px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:6px 16px;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:baseline}
.chip .en{font-weight:700;color:var(--ink-soft);font-size:15px}
.chip[aria-pressed="true"]{background:var(--grape);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip[aria-pressed="true"] .en{color:#EDE6FF}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;align-items:center;text-align:start;padding:18px 20px;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:7px 7px 0 var(--ink)}
.tile svg{width:84px;height:84px}
.tile h3{margin:0;font-size:26px;line-height:1.15}
.tile .en{display:block;font-size:17px;font-weight:700;color:var(--ink-soft)}
.tile p{margin:4px 0 0;font-size:16px;color:var(--ink-soft)}
.t-listen{background:var(--teal-l)} .t-spell{background:var(--sun-l)} .t-color{background:var(--pink-l)} .t-memory{background:var(--grape-l)}

.closet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.acc{padding:12px;display:grid;justify-items:center;gap:2px;border:3px solid var(--ink);border-radius:18px;background:var(--card)}
.acc .ico{font-size:40px;line-height:1.2}
.acc .en{font-weight:700;font-size:18px}
.acc small{color:var(--ink-soft);font-size:14px}
.acc.locked{background:transparent;border-style:dashed;color:var(--ink-soft)}
.acc.locked .ico{filter:grayscale(1);opacity:.45}
.acc.on{background:var(--tangerine-l);box-shadow:3px 3px 0 var(--ink)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.g-item{padding:10px;display:grid;gap:8px}
.g-item svg{width:100%;height:auto}
.g-item .row{gap:6px;justify-content:center}
.g-item .row button{font-size:13px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:700}
.empty{padding:20px;border:3px dashed var(--ink-soft);border-radius:var(--r);color:var(--ink-soft);margin:0}

.parents{margin-top:36px;padding:0}
.parents summary{padding:16px 20px;font-weight:800;font-size:20px;cursor:pointer}
.parents .in{padding:0 20px 20px;display:grid;gap:18px}
.parents h4{margin:0 0 6px;font-size:18px}
.parents ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:16px}
.parents label{font-weight:700;font-size:16px}
.parents input{font:inherit;font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;width:min(260px,100%)}
.tricky{display:flex;flex-wrap:wrap;gap:8px}
.tricky button{border:2px solid var(--ink);border-radius:999px;background:var(--bad-l);padding:2px 12px;font-size:16px}
.tricky b{font-family:var(--learn)}
.muted{color:var(--ink-soft);font-size:15px;margin:0}

/* game stage */
.stage{display:grid;gap:18px;justify-items:center;text-align:center}
.g-head{display:grid;gap:4px;justify-items:center}
.g-head h2{margin:0;font-size:30px;line-height:1.2}
.g-head .ask{margin:0;font-size:19px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--sun)} .dots i.miss{background:var(--tangerine-l)}
.qcard{padding:18px 28px;display:grid;gap:10px;justify-items:center;min-width:min(420px,100%)}
.bigword{font-family:var(--learn);font-size:64px;font-weight:700;line-height:1.1;margin:0;direction:ltr}
.speaker{width:120px;height:120px;border-radius:50%;border:3px solid var(--ink);background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.speaker svg{width:60px;height:60px}
.speaker:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%;max-width:820px}
.opt{aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .1s}
.opt:hover{transform:translateY(-3px)}
.emo{font-size:clamp(54px,8vw,84px);line-height:1}
.sw{display:block;width:62%;aspect-ratio:1;border-radius:50%;background:var(--c);border:3px solid var(--ink)}
.opt.right{background:var(--good-l);border-color:var(--good);animation:pop .4s}
.opt.wrong{background:var(--bad-l);animation:shake .4s}
.opt.hint{animation:pulse 1s infinite}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--sun)}}
.feedback{min-height:64px;font-size:22px;font-weight:700;display:grid;place-items:center;gap:2px}
.feedback .en{font-size:28px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

/* spell */
.pic-big{font-size:110px;line-height:1}
.pic-big .sw{width:120px}
.slots,.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr}
.slot{width:68px;height:78px;border:3px dashed var(--ink);border-radius:14px;background:var(--card);font-family:var(--learn);font-size:44px;font-weight:700;display:grid;place-items:center}
.slot.full{border-style:solid;background:var(--sun-l)}
.slot.lock{background:var(--teal-l)}
.slots.ok .slot{background:var(--good-l);border-color:var(--good)}
.slots.no{animation:shake .4s}
.tileL{width:68px;height:68px;border:3px solid var(--ink);border-radius:14px;background:var(--tangerine);font-family:var(--learn);font-size:40px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.tileL:disabled{visibility:hidden}

/* color game */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;width:100%;text-align:start}
.canvas{padding:12px}
.canvas svg{width:100%;height:auto;display:block;max-height:62vh}
.paint [data-part]{cursor:pointer;transition:fill .25s}
.paint [data-part]:hover{filter:brightness(.93)}
.paint [data-part].hint{animation:partpulse 1s infinite}
@keyframes partpulse{50%{stroke:var(--sun);stroke-width:9px}}
.side{display:grid;gap:16px}
.instr{padding:18px 20px;display:grid;gap:10px}
.instr .step{font-size:15px;color:var(--ink-soft);font-weight:700}
.instr .sentence{font-family:var(--learn);font-size:34px;font-weight:700;line-height:1.2;margin:0;direction:ltr;text-align:left}
.instr .arhint{margin:0;font-size:18px;color:var(--grape);font-weight:700}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.swb{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--c);transition:transform .1s}
.swb:hover{transform:scale(1.08)}
.swb[aria-pressed="true"]{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink);transform:scale(1.08)}
.swb.hint{animation:pulse 1s infinite}
.cfeed{min-height:56px;font-size:19px;font-weight:700;margin:0}
.cfeed .en{font-size:22px}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:760px}
.mcard{aspect-ratio:4/5;border:0;padding:0;background:none;perspective:800px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .back{background:var(--grape);background-image:radial-gradient(rgba(255,255,255,.28) 6px,transparent 7px);background-size:30px 30px}
.mcard .back svg{width:44%;height:auto}
.mcard .front{background:var(--card);transform:rotateY(180deg)}
.mcard .front .en{font-size:clamp(24px,3.6vw,36px);font-weight:700}
.mcard .front .emo{font-size:clamp(46px,7vw,70px)}
.mcard .front .sw{width:55%}
.mcard.done .front{background:var(--good-l);border-color:var(--good)}

/* finish */
.done-wrap{display:grid;justify-items:center;gap:10px;text-align:center}
.done-wrap svg.cat{width:min(260px,70vw);height:auto}
.done-wrap h2{margin:0;font-family:var(--learn);font-size:56px;line-height:1.1}
.done-wrap p{margin:0;font-size:20px}

/* fx + toast */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
#toast{position:fixed;pointer-events:none;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px 22px;font-weight:700;font-size:18px;max-width:calc(100% - 32px);text-align:center}
.bounce{animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.hero-cat .cat{animation:bounce 3s ease-in-out infinite}

/* reading corner */
.t-read{background:var(--tangerine-l);grid-column:1/-1}
.hub{display:grid;gap:12px}
.hub .g-head{justify-items:start;text-align:start}
.hub .sec-title{margin:22px 0 0}
.hub > .muted{margin:0;max-width:65ch}
.read-count{display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:19px;background:var(--sun-l)}
.read-count svg{width:56px;height:56px;flex:none}
.read-count b{font-size:30px;font-variant-numeric:tabular-nums}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fam,.story-card{border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px;display:grid;justify-items:center;gap:2px;transition:transform .1s}
.fam:hover,.story-card:hover{transform:translateY(-3px)}
.fam .rimebig{font-size:34px;font-weight:700;color:var(--grape);line-height:1.2}
.fam .emos{font-size:24px;letter-spacing:2px}
.fam small,.story-card small{font-size:14px;color:var(--ink-soft);font-weight:700}
.fam.next{background:var(--tangerine-l);box-shadow:4px 4px 0 var(--ink)}
.fam.done,.story-card.done{background:var(--good-l)}
.fam.done small,.story-card.done small{color:var(--good)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.story-card .emos{font-size:40px;letter-spacing:4px}
.story-card .en{font-size:20px;font-weight:700}
.bigword .onset{color:var(--ink)}
.bigword .rime{color:var(--grape);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.opts.opts3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:620px}
.opt .txt{font-size:clamp(22px,4vw,34px);font-weight:700}
.storybox{padding:20px 26px;display:grid;gap:12px;width:100%;max-width:760px}
.storybox .scene{font-size:56px;letter-spacing:8px;text-align:center;line-height:1.2}
.story{text-align:left}
.story p{margin:0;font-size:30px;line-height:1.65}
.wtok{border:0;background:none;padding:0 3px;border-radius:8px;font:inherit;color:inherit;text-decoration:underline dotted var(--ink-soft) 2px;text-underline-offset:7px}
.wtok:hover{background:var(--sun-l)}
.qa{display:grid;gap:16px;justify-items:center;width:100%;scroll-margin-top:90px}
.qtext{font-size:32px;font-weight:700;margin:0}

.stars{cursor:pointer}
/* mall */
.mall-door{display:block;width:100%;margin-top:28px;padding:0;border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;text-align:start;transition:transform .12s,box-shadow .12s}
.mall-door:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.awning{display:block;width:100%;height:44px}
.door-in{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 20px 18px}
.door-text{flex:1 1 260px;min-width:0;font-size:28px;font-weight:800;line-height:1.3}
.door-text .en{font-size:18px;color:var(--ink-soft)}
.door-text small{font-size:16px;font-weight:500;color:var(--ink-soft)}
.door-items{display:flex;gap:8px;flex-wrap:wrap}
.mini{width:60px;height:60px;border:2px solid var(--ink);border-radius:14px;background:var(--grape-l);display:grid;place-items:center;padding:6px}
.mini svg{width:100%;height:100%}
.mini .emo-thumb{font-size:38px}
.mall{display:grid;gap:18px}
.mall-sign{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.sign-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:6px 20px 14px}
.sign-in h2{margin:0;font-size:32px;line-height:1.2}
.sign-in h2 .en{font-size:20px;color:var(--ink-soft)}
.wallet{font-size:20px}
.mall-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
.fitting{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);padding:14px;display:grid;gap:10px}
.fit-label{font-weight:800;font-size:16px;color:var(--ink-soft);text-align:center}
.fit-cat{border-radius:22px;background:var(--grape-l);padding:6px;border:2px dashed var(--grape)}
.fit-cat svg{width:100%;height:auto;display:block}
.fit-cat .tryon{animation:pop .4s}
.fit-info{display:grid;gap:8px;justify-items:center;text-align:center;min-height:120px;align-content:start}
.fit-info .muted{margin:0}
.fit-hint{margin:0;color:var(--ink-soft);font-size:17px}
.fit-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.fit-name .en{font-size:30px;font-weight:700}
.need{margin:0;color:var(--bad);font-weight:700}
.linkish{background:none;border:0;text-decoration:underline;color:var(--ink-soft);font-size:15px}
.shelves{display:grid;gap:14px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:5px 14px;font-weight:700;font-size:17px;display:inline-flex;gap:6px;align-items:baseline}
.tab .en{font-size:14px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--tangerine);box-shadow:3px 3px 0 var(--ink)}
.tab[aria-selected="true"] .en{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:22px 16px 16px;border:3px solid var(--ink);border-radius:var(--r);background:var(--sun-l)}
.item{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px 10px 10px;display:grid;justify-items:center;gap:2px;transition:transform .1s,box-shadow .1s}
.item:hover{transform:translateY(-3px)}
.item .thumb{width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:var(--paper);overflow:hidden;margin-bottom:4px}
.item .thumb svg{width:80%;height:80%}
.item .thumb.t-bg svg,.item .thumb.t-pattern svg{width:100%;height:100%}
.item .name{font-size:18px;font-weight:700;line-height:1.2}
.item small{font-size:14px;color:var(--ink-soft)}
.tag{position:absolute;top:-12px;inset-inline-start:-8px;z-index:1;transform:rotate(-8deg);background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.item.pricey .tag{background:var(--card);color:var(--ink-soft)}
.item.owned .tag{background:var(--good-l);color:var(--ink)}
.item.worn .tag{background:var(--good);color:#FFFFFF}
.item.sel{box-shadow:0 0 0 4px var(--grape);transform:translateY(-3px)}


/* school book */

/* pots & plants */
.pot{display:block;width:100%;height:auto;overflow:visible}
.pot .pl{transform-origin:60px 97px;transition:transform .5s,filter .5s}
.pot:not(.dry) .pl{animation:sway 3.2s ease-in-out infinite}
.pot.dry .pl{transform:rotate(-16deg) scaleY(.93);filter:saturate(.3) sepia(.35)}
.pot.grew .pl{animation:growUp .8s cubic-bezier(.3,1.6,.5,1)}
.pot.sprout .pl{animation:growUp .7s cubic-bezier(.3,1.6,.5,1)}
.pot.wilt .pl{animation:wilt .8s ease-out}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes growUp{0%{transform:scale(.35,.2)}100%{transform:none}}
@keyframes wilt{0%{transform:none;filter:none}100%{transform:rotate(-16deg) scaleY(.93);filter:saturate(.3) sepia(.35)}}
.wscene{position:relative;width:150px;padding:34px 46px 0 0}
.wscene .wpot{display:block;width:104px}
.wscene .can{position:absolute;top:0;right:0;width:74px;transform-origin:30% 60%;transition:transform .35s}
.wscene .can svg{width:100%;height:auto;display:block}
.wscene .drops{position:absolute;top:40px;left:46px;width:44px;height:70px;pointer-events:none}
.drops i{position:absolute;top:0;width:7px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3FA9E0;border:1.5px solid #1F6F9A;opacity:0}
.drops i:nth-child(1){left:2px}.drops i:nth-child(2){left:12px;animation-delay:.12s!important}.drops i:nth-child(3){left:22px;animation-delay:.24s!important}
.drops i:nth-child(4){left:7px;animation-delay:.36s!important}.drops i:nth-child(5){left:17px;animation-delay:.48s!important}.drops i:nth-child(6){left:28px;animation-delay:.6s!important}
.wscene.pour .can{transform:translate(-10px,6px) rotate(-38deg)}
.wscene.pour .drops i,.bp-can .drops i{animation:drip .45s ease-in 2 both}
.bp-can{position:absolute;top:-4px;right:-10px;width:52px;transform-origin:30% 60%;animation:canTip 1.2s ease forwards;z-index:2}
.bp-can svg{width:100%;height:auto;display:block}
.bp-can .drops{position:absolute;top:22px;left:-4px;width:30px;height:46px}
@keyframes canTip{0%{opacity:0;transform:translateY(-8px)}15%{opacity:1;transform:none}30%,80%{opacity:1;transform:rotate(-38deg)}100%{opacity:0;transform:rotate(-10deg)}}
@keyframes drip{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:.9;transform:translateY(60px)}}

.bed{display:grid;grid-template-columns:repeat(var(--n),minmax(0,104px));gap:10px;justify-content:center;width:100%;padding:10px 12px 4px;border:3px solid var(--ink);border-radius:var(--r);background:linear-gradient(#DDF3FF 0 55%,#9ED36A 55% 100%)}

.bed-pot.now::before{content:'⬇';position:absolute;top:-6px;font-size:18px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* farha's room */
.room-page{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.room{position:relative;isolation:isolate;aspect-ratio:16/10;width:100%;max-width:100%;container-type:inline-size;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.room.rmini{pointer-events:none}
.r-wall{position:absolute;inset:0 0 36% 0}
.r-floor{position:absolute;inset:64% 0 0 0}
.r-floor::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(43,34,51,.16),transparent 35%)}
.r-skirt{position:absolute;left:0;right:0;top:62.6%;height:1.8%;background:#FFFFFF;border-block:2px solid rgba(43,34,51,.3);z-index:1}
.rwin{position:absolute;left:68%;top:7%;width:20%;height:34%;z-index:2;cursor:pointer}
.rwin .sky{position:absolute;inset:6%;overflow:hidden;border-radius:3px}
.sky-day .sky{background:linear-gradient(#8FD0FF,#D2F0FF)}
.sky-sunset .sky{background:linear-gradient(#FF8F6B,#FFD08A)}
.sky-night .sky{background:linear-gradient(#1C1A45,#3B3580)}
.rwin .sun,.rwin .moon{position:absolute;top:8%;right:10%;font-size:4.6cqw;line-height:1}
.rwin .cloud{position:absolute;bottom:12%;left:8%;font-size:4.2cqw;line-height:1;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(4cqw)}}
.sky i{position:absolute;width:.5cqw;height:.5cqw;background:#FFFFFF;border-radius:50%;animation:tw 1.6s ease-in-out infinite alternate}
.sky i:nth-of-type(1){left:15%;top:20%}.sky i:nth-of-type(2){left:40%;top:60%;animation-delay:.5s}.sky i:nth-of-type(3){left:25%;top:75%;animation-delay:1s}.sky i:nth-of-type(4){left:55%;top:30%;animation-delay:.3s}
.rwin .frame{position:absolute;inset:0;border:1cqw solid #FFFFFF;box-shadow:0 0 0 2px #2B2233,inset 0 0 0 2px #2B2233;border-radius:4px;background:linear-gradient(#FFFFFF,#FFFFFF) center/.7cqw 100% no-repeat,linear-gradient(#FFFFFF,#FFFFFF) center/100% .7cqw no-repeat}
.rwin .cur{position:absolute;top:-5%;bottom:-10%;width:26%;background:repeating-linear-gradient(90deg,#FF9CC6 0 1.2cqw,#FF7FB4 1.2cqw 1.8cqw);border:2px solid #2B2233;border-radius:0 0 8px 8px;transition:width .6s ease}
.rwin .cur.l{left:-9%}.rwin .cur.r{right:-9%}
.rwin.closed .cur{width:61%}
.ritem{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;cursor:pointer;line-height:0}
.ritem svg{width:100%;height:auto;display:block;overflow:visible}
.r-emo{display:block;text-align:center;line-height:1;white-space:nowrap;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ritem.k-floor,.ritem.k-catbed,.ritem.k-bowl,.ritem.k-cattoy{filter:drop-shadow(0 .5cqw 0 rgba(43,34,51,.16))}
.ritem.k-wall{filter:drop-shadow(.3cqw .4cqw 0 rgba(43,34,51,.14))}
.ritem.pv{animation:pvglow .9s ease-in-out infinite alternate}
@keyframes pvglow{to{filter:drop-shadow(0 0 1.4cqw #FFC93C)}}
.ritem .rm{display:none}
.room.editing .ritem{cursor:grab;outline:2px dashed rgba(122,79,214,.75);outline-offset:3px;touch-action:none}
.room.editing .ritem .rm{display:grid;place-items:center;position:absolute;top:-12px;right:-12px;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #2B2233;background:#FFFFFF;color:#2B2233;font-size:13px;line-height:1;z-index:2}
.room.editing .rmish{display:none}
.room.editing::before{content:"وضع الترتيب";position:absolute;top:2%;left:2%;z-index:300;background:var(--grape);color:#FFFFFF;border-radius:99px;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:14px}
.ritem.dragging{cursor:grabbing;opacity:.85;filter:drop-shadow(0 1cqw 1cqw rgba(43,34,51,.35))}
.ritem.bop{animation:bop .5s}
@keyframes bop{30%{transform:translate(-50%,-100%) scale(1.12,.88)}65%{transform:translate(-50%,-108%) scale(.95,1.08)}}
.ritem.hop{animation:hop .8s}
@keyframes hop{30%,65%{transform:translate(-50%,-128%)}}
.ritem.spin>*{animation:spin 1.2s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.ritem.launch{animation:launch 1.6s ease-in}
@keyframes launch{55%{transform:translate(-50%,-320%);opacity:1}56%{opacity:0}57%{transform:translate(-50%,-100%);opacity:0}100%{opacity:1}}
.ritem.dancing{animation:wig .45s ease-in-out 6}
@keyframes wig{25%{transform:translate(-50%,-100%) rotate(-9deg)}75%{transform:translate(-50%,-100%) rotate(9deg)}}
.glow{opacity:0;transition:opacity .4s}
.ritem.on .glow{opacity:.75}
.swim{animation:swim 4s ease-in-out infinite alternate}
.swim.s2{animation-duration:5.5s;animation-direction:alternate-reverse}
@keyframes swim{to{transform:translateX(46px)}}
.tw{animation:tw 1.3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.3}}
.rmish{position:absolute;width:12cqw;transform:translate(-50%,-100%);cursor:pointer}
.room.rmini .rmish{width:12cqw}
.rmish .flip{transition:transform .25s}
.rmish.left .flip{transform:scaleX(-1)}
.rmish svg{width:100%;height:auto;display:block;transform-origin:50% 100%}
.rmish.walking svg{animation:walkbob .3s ease-in-out infinite alternate}
@keyframes walkbob{to{transform:translateY(-5%) rotate(3deg)}}
.rmish.sleeping svg{transform:scaleY(.9)}
.rmish.sleeping::after{content:"💤";position:absolute;top:-6%;right:-6%;font-size:3.4cqw;animation:zz 2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(.6cqw,-1cqw)}}
.rmish.eating svg{animation:eat .28s ease-in-out 9 alternate}
@keyframes eat{to{transform:rotate(7deg) translateY(4%)}}
.rmish.dancing svg{animation:dance2 .4s ease-in-out 9 alternate}
@keyframes dance2{from{transform:rotate(-11deg)}to{transform:rotate(11deg) translateY(-7%)}}
.rmish.jump svg{animation:jumpc .5s ease-out 2}
@keyframes jumpc{50%{transform:translateY(-32%)}}
.bubble-r{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:.5cqw;white-space:nowrap;background:#FFFFFF;border:2px solid #2B2233;border-radius:1.6cqw;padding:.3cqw 1.2cqw;font-family:var(--learn);font-weight:700;font-size:2.1cqw;line-height:1.4;color:#2B2233;box-shadow:2px 2px 0 rgba(43,34,51,.2)}

@keyframes fl{0%{opacity:0}12%{opacity:1}80%{opacity:1;margin-top:-2cqw}100%{opacity:0;margin-top:-4cqw}}
.fnote{position:absolute;z-index:400;pointer-events:none;font-size:3cqw;line-height:1;transform:translate(-50%,-100%);animation:note 1.7s ease-out forwards}

.room.disco::after{content:"";position:absolute;inset:0;z-index:350;pointer-events:none;background:conic-gradient(from 0deg at 50% 0%,rgba(255,0,128,.28),rgba(255,230,0,.28),rgba(0,200,255,.28),rgba(140,0,255,.28),rgba(255,0,128,.28));animation:disco .8s linear infinite}

 {id:'c4l4', title:'الظلال والشمس (٢)', ico:'🕰️',

   {e:'🌅➡️🌇', h:'حركة الظلال والشمس', t:'الشمس بتشرق الصبح من ناحية الشرق، وبعدين تغرب المسا من ناحية الغرب. وطول واتجاه الظل بيتغيروا مع حركة الشمس المنتظمة والثابتة طول النهار.'},
   {e:'🪵🚩⏰', h:'نشاط: تتبع حركة الظل', t:'الأدوات: عصاية وأعلام صغيرة أو علامات وساعة. أولًا نثبت العصاية في الأرض الصبح ونحط علامة عند طرف ضل العصاية. تانيًا نحط علامة جديدة عند طرف الضل كل ساعة ونكتب الوقت جنبها. تالتًا نوصّل خط بين العلامات علشان نشوف الضل بيتحرك إزاي. بنلاحظ إن اتجاه وطول وموضع ضل العصاية بيتغيروا مع مرور الوقت خلال اليوم.',
    note:'الاستنتاج: عندما تتحرك الشمس يتغير اتجاه الظل ويكون دائمًا في الجهة المقابلة للشمس، ويتغير طول الظل بتغير ارتفاع الشمس في السماء خلال النهار.'},
   {e:'🌅 | 🌞 | 🌇', h:'طول الظل خلال اليوم', t:'لما الشمس بتتحرك من الشرق للجنوب للغرب، اتجاه الظل بيتغير لأنه بيتكون في الجهة المقابلة للشمس، وطوله بيتغير كمان. وقت الصبح، يعني شروق الشمس، الشمس بتكون واطية في السما فالظل بيكون طويل. وقت الضهر الشمس بتكون عالية في السما فالظل بيكون قصير. ووقت المسا، يعني غروب الشمس، الشمس بتكون واطية فالظل بيكون طويل.',
    pts:[['🌅','الصباح (شروق): الشمس منخفضة ← الظل طويل'],['🌞','الظهيرة: الشمس مرتفعة ← الظل قصير'],['🌇','المساء (غروب): الشمس منخفضة ← الظل طويل']]},
   {sort:{q:'الظل في الوقت ده طويل ولا قصير؟', groups:['ظل طويل','ظل قصير'], items:[['🌅','وقت الصباح',0],['🌞','وقت الظهيرة',1],['🌇','وقت المساء',0]]}},
   {e:'🕰️☀️', h:'الساعة الشمسية', t:'الساعة الشمسية أداة بنستخدمها علشان نعرف الوقت. وفكرة شغلها إن حركة الشمس منتظمة وثابتة طول النهار، وبالتالي حركة الظل كمان منتظمة، فنقدر نعرف الوقت التقريبي من مراقبة مكان الظل. ومن زمان، الشعوب القديمة كانت بتراقب حركة الشمس علشان تنظم أوقاتها، والمصريين القدما استخدموا ضلال المسلات الحجرية الضخمة علشان يعرفوا الوقت طول النهار، وبعدين اخترعوا أول ساعة، وهي الساعة الشمسية.',
    note:'الساعة الشمسية: أداة تستخدم لمعرفة الوقت. معلومة إثرائية: استخدم المصريون القدماء ظلال المسلات الحجرية الضخمة لمعرفة الوقت خلال النهار ثم اخترعوا أول ساعة وهي الساعة الشمسية.'}
  ],

 {id:'c4l5', title:'الشمس والظل', ico:'🌡️',

    ask:{q:'تكون الأرض المشمسة أكثر دفئًا من الأرض الظليلة لأنها ......', o:['تتعرض لضوء الشمس المباشر','تمنع مرور ضوء الشمس تمامًا'], a:0, why:'لأنها بتتعرض لضوء الشمس المباشر.'}},
   {e:'☀️🟫 | 🌳🪑', h:'الأماكن المشمسة والأماكن الظليلة', t:'حرارة الأرض بتعتمد على كمية ضوء الشمس اللي بتوصلها. الأماكن المشمسة بتكون أدفى، لأن ضوء الشمس بيرفع حرارة الأرض المعرضة له، ودرجة حرارتها بتزيد مع الوقت لأنها بتمتص أشعة الشمس، وبتكون أنشف وأقل رطوبة. أما الأماكن الضليلة فبتكون أبرد، لأن ضوء الشمس المباشر مابيوصلهاش، وحرارتها أقل، وبتكون أكتر رطوبة.',
    pts:[['☀️','المشمسة: أكثر دفئًا – ترتفع حرارتها بمرور الوقت – أكثر جفافًا وأقل رطوبة'],['🌳','الظليلة: أبرد – تنخفض حرارتها – أكثر رطوبة']]},
   {sort:{q:'المكان ده مشمس ولا ضليل؟', groups:['مكان مشمس','مكان ظليل'], items:[['🔥','أكثر دفئًا',0],['❄️','أبرد',1],['💧','أكثر رطوبة',1],['🏜️','أكثر جفافًا',0]]}},
   {e:'🌡️🔫', h:'قياس درجة حرارة الأرض', t:'بنقيس حرارة الأرض بأجهزة: مقياس الحرارة العادي، يعني الترمومتر، وده بيقيس الحرارة عن طريق التلامس. ومقياس الحرارة بالأشعة تحت الحمرا، يعني الترمومتر الإشعاعي، وده بيقيس الحرارة عن بعد من غير تلامس. ولما نستخدم الإشعاعي، لازم مايلمسش سطح الأرض ويكون على مسافة مناسبة منها.',
    pts:[['🌡️','الترمومتر العادي: يقيس الحرارة عن طريق التلامس'],['🔫','الترمومتر الإشعاعي: يقيس الحرارة عن بعد دون تلامس']]},
   {e:'✋🌡️', h:'احتياطات الترمومتر', t:'ماتلمسيش الجزء اللي فيه السائل الأحمر، واسمه البصيلة، بصوابعك، وامسكي الترمومتر من فوق، علشان حرارة إيدك ماتنتقلش له وتبوّظ دقة القياس. والبصيلة هي الجزء المنتفخ اللي فيه السائل الأحمر في الترمومتر العادي.',
    note:'البصيلة: الجزء المنتفخ الذي يحتوي على السائل الأحمر في مقياس الحرارة العادي. علل: لا تلمس البصيلة بأصابعك وأمسك المقياس من الأعلى؟ حتى لا تنتقل حرارة يدك إليه وتفسد دقة القياس.'},
   {e:'🌡️🟫🪵', h:'قياس حرارة الأرض بالترمومتر العادي', t:'أولًا: اختاري مكان الشمس بتوصله كويس، ومكان تاني في ضل شجرة أو حيطة. تانيًا: حطي الترمومتر بحيث الجزء اللي تحت منه يلمس سطح الأرض مباشرة. تالتًا: احجبي ضوء الشمس المباشر عن الترمومتر بلوح أو بضل جسمك، علشان نقدر نقيس حرارة الأرض بدقة.',
    note:'علل: احجب ضوء الشمس المباشر عن المقياس بلوح أو ظل جسمك؟ حتى يمكن قياس درجة حرارة الأرض بدقة.'},

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mishmish_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mishmish_'+k, JSON.stringify(v)); }catch(e){} }
};

const DEFAULT_MISH = {tail:'#FF9F4A',body:'#FF9F4A',paws:'#FFFFFF',ball:'#3A7BE8',ears:'#FF9F4A',head:'#FF9F4A',eyes:'#3DBB5C',nose:'#FF8FC2',bow:'#F2558F'};
const S = {
  stars: store.get('stars', 0),
  topic: store.get('topic', 'all'),
  owned: store.get('owned', null),
  equip: store.get('equip', {}),
  gallery: store.get('gallery', []),
  tricky: store.get('tricky', {}),
  mish: store.get('mish', DEFAULT_MISH),
  room: store.get('room', null),
  treats: store.get('treats', null),
  pet: store.get('pet', null),
  day: store.get('day', null),
  name: store.get('name', ''),
  sound: store.get('sound', true),
  readWords: store.get('readWords', []),
  famDone: store.get('famDone', {}),
  storyDone: store.get('storyDone', {}),
  wl: store.get('wl', {}),
  gDone: store.get('gDone', {}),
  vDone: store.get('vDone', {}),
  writings: store.get('writings', []),
  exams: store.get('exams', {}),
  pDone: store.get('pDone', {}),
  wDone: store.get('wDone', {}),
  sci: store.get('sci', {})
};
/* Stars are a per-device ledger so stars earned on two devices add up instead of overwriting each other:
   balance = base (stars from before the ledger) + everything earned on every device - everything spent.
   Each device only ever raises its own two counters, so copies merge by taking the larger number. */
const DEV = (() => { let d = store.get('device_id', ''); if(!d){ d = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); store.set('device_id', d); } return d; })();
S.starLedger = store.get('starLedger', null) || {base: S.stars || 0, dev: {}};
const ledgerStars = L => Math.max(0, (L.base || 0) + Object.values(L.dev || {}).reduce((t, x) => t + (x.e || 0) - (x.s || 0), 0));
const myLedger = () => (S.starLedger.dev[DEV] = S.starLedger.dev[DEV] || {e: 0, s: 0});
S.stars = ledgerStars(S.starLedger);
function ledgerMerge(a, b){
  const o = {base: Math.max(a.base || 0, b.base || 0), dev: {}};
  new Set([...Object.keys(a.dev || {}), ...Object.keys(b.dev || {})]).forEach(id => {
    const x = (a.dev || {})[id] || {}, y = (b.dev || {})[id] || {};
    o.dev[id] = {e: Math.max(x.e || 0, y.e || 0), s: Math.max(x.s || 0, y.s || 0)};
  });
  return o;
}
function starsChange(n){            /* + earn, - spend */
  const me = myLedger();
  if(n >= 0) me.e += n; else me.s += -n;
  S.stars = ledgerStars(S.starLedger);
  store.set('stars', S.stars); save('starLedger');
}
const save = k => { store.set(k, S[k]); progStamp(k); };
/* ---------- whole-game progress synced across devices (artifact db doc progress/farha) ----------
   Every save(k) stamps the key's time. Copies merge per key: lists of things done or owned are united,
   scores keep the best, everything else keeps the newest copy. A reset wins over older data everywhere. */
const PROG_KEYS = ['starLedger','owned','equip','gallery','tricky','mish','room','treats','pet','day','name','readWords','famDone','storyDone','wl','gDone','vDone','writings','exams','pDone','wDone','sci'];
const PROG_META = Object.assign({ts:{}, resetTs:0, joined:false}, store.get('sync_meta', {}));
let progDoc = null, progTimer = null, progWriting = false, progDirty = false, progState = 'wait';
function progStamp(k){ if(PROG_KEYS.includes(k)){ PROG_META.ts[k] = Date.now(); store.set('sync_meta', PROG_META); progSchedule(); } }
function progSchedule(){ clearTimeout(progTimer); progTimer = setTimeout(progPush, 1500); }
const progBody = () => { const data = {}; PROG_KEYS.forEach(k => { if(S[k] !== undefined) data[k] = S[k]; }); return JSON.parse(JSON.stringify({data, ts:PROG_META.ts, resetTs:PROG_META.resetTs})); };
function progPush(){
  clearTimeout(progTimer);
  if(!progDoc) return;
  if(progWriting){ progDirty = true; return; }
  progWriting = true;
  progDoc.set(progBody()).then(() => { progState = 'ok'; progPaint(); })
    .catch(e => { if(e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')){ progDoc = null; progState = 'local'; progPaint(); } })
    .finally(() => { progWriting = false; if(progDirty){ progDirty = false; progPush(); } });
}
function progPaint(){
  const el = $('#progSync'); if(!el) return;
  el.textContent = progState === 'ok' ? '☁️ اللعبة كلها محفوظة على كل الأجهزة' : progState === 'wait' ? '☁️ بنوصل اللعبة بكل الأجهزة...' : '📱 اللعبة محفوظة على الجهاز ده بس دلوقتي';
  el.className = 'bank-sync ' + progState;
}
const pIsObj = v => v && typeof v === 'object' && !Array.isArray(v);
function progMergeKey(k, a, b, ta, tb, joining){
  if(a == null) return b; if(b == null) return a;
  if(k === 'owned' || k === 'readWords') return [...new Set([...b, ...a])];
  if(['gDone','vDone','wDone','famDone','storyDone'].includes(k) && pIsObj(a) && pIsObj(b)){ const o = {...b}; Object.keys(a).forEach(x => { if(a[x]) o[x] = a[x]; }); return o; }
  if(['exams','pDone','tricky','sci'].includes(k) && pIsObj(a) && pIsObj(b)){ const o = {...b}; Object.keys(a).forEach(x => { o[x] = Math.max(+a[x] || 0, +o[x] || 0); }); return o; }
  if(k === 'wl' && pIsObj(a) && pIsObj(b)){ const o = {...b}; Object.keys(a).forEach(x => { if(!o[x] || (a[x].due || 0) > (o[x].due || 0)) o[x] = a[x]; }); return o; }
  if(k === 'writings' && Array.isArray(a) && Array.isArray(b)){ const seen = new Set(), out = []; [...a, ...b].forEach(w => { const id = JSON.stringify([w.wid, w.title, w.text]); if(!seen.has(id)){ seen.add(id); out.push(w); } }); return out.slice(0, 20); }

function progApply(remote){
  let changed = false;
  if(!remote || !remote.data){ PROG_META.joined = true; store.set('sync_meta', PROG_META); return {changed, push:true}; }
  const joining = !PROG_META.joined;
  const rts = remote.ts || {}, rReset = remote.resetTs || 0;
  if(rReset > PROG_META.resetTs){            /* another device reset the game: take its copy as it is */
    PROG_KEYS.forEach(k => { if(k in remote.data){ S[k] = remote.data[k]; store.set(k, S[k]); } });
    if(!S.starLedger || !S.starLedger.dev) S.starLedger = {base: 0, dev: {}};
    S.stars = ledgerStars(S.starLedger); store.set('stars', S.stars);
    PROG_META.ts = {...rts}; PROG_META.resetTs = rReset; PROG_META.joined = true; store.set('sync_meta', PROG_META);
    return {changed:true, push:false};
  }
  if(PROG_META.resetTs > rReset){ PROG_META.joined = true; store.set('sync_meta', PROG_META); return {changed, push:true}; }
  PROG_KEYS.forEach(k => {
    const m = progMergeKey(k, S[k], remote.data[k], PROG_META.ts[k], rts[k], joining && (k in remote.data));
    if(canon(m) !== canon(S[k])){ S[k] = m; store.set(k, m); changed = true; }
    PROG_META.ts[k] = Math.max(PROG_META.ts[k] || 0, rts[k] || 0);
  });
  PROG_META.joined = true;
  store.set('sync_meta', PROG_META);
  S.stars = ledgerStars(S.starLedger); store.set('stars', S.stars);
  const push = PROG_KEYS.some(k => canon(S[k]) !== canon(remote.data[k]));
  return {changed, push};
}

const NUM_W = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');

function numWords(n){
  if(n < 20) return NUM_W[n];
  if(n < 100) return TENS_W[Math.floor(n / 10)] + (n % 10 ? ' ' + NUM_W[n % 10] : '');
  if(n < 1000) return NUM_W[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numWords(n % 100) : '');
  if(n < 1e6) return numWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + numWords(n % 1000) : '');
  return numWords(Math.floor(n / 1e6)) + ' million' + (n % 1e6 ? ' ' + numWords(n % 1e6) : '');

let clipRun = 0, clipSrcs = [];
async function sayClips(text){
  const run = ++clipRun;
  clipSrcs.forEach(x => { try{ x.stop(); }catch(e){} }); clipSrcs = [];
  const c = actx(); if(!c) return;
  const t = String(text).replace(/[’‘]/g, "'").replace(/(\d+):(\d\d)/g, (m, h, mm) => numWords(+h) + (+mm ? ' ' + (+mm < 10 ? 'oh ' : '') + numWords(+mm) : " o'clock"))
    .replace(/\d[\d,]*/g, m => numWords(+m.replace(/,/g, '')) || m).toLowerCase();
  const words = t.match(/[a-z][a-z']*/g) || [];
  await Promise.all([...new Set(words.map(w => w[0]))].map(voiceChunk));
  if(run !== clipRun) return;
  const bufs = [];
  for(const w of words){
    const key = [w, w.replace(/'s$/, ''), w.replace(/'/g, '')].find(k => VOICE[k]);
    if(!key) continue;
    if(!VOICE_BUF[key]){
      try{
        const bin = atob(VOICE[key]), arr = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        VOICE_BUF[key] = await c.decodeAudioData(arr.buffer);
      }catch(e){ continue; }
    }
    bufs.push(VOICE_BUF[key]);
    if(run !== clipRun) return;
  }
  if(!bufs.length){ if(!words.length) return; if(!sayClips.warned){ sayClips.warned = true; toast('الصوت محتاج إنترنت أول مرة. اتأكدي إن النت شغال وجربي تاني.'); } return; }
  let at = c.currentTime + .05;
  bufs.forEach(buf => { const src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination); src.start(at); clipSrcs.push(src); at += buf.duration + .04; });

function say(text, rate=0.82){
  if(!S.sound) return;
  if(useClips) return void sayClips(text);
  if(!hasTTS) return;
  try{
    const go = () => {
      const u = new SpeechSynthesisUtterance(text);

/* Phones keep sound locked until the first touch: unlock both the sound effects and the voice on it.
   On iPhone, also play through the silent switch like a media app. */
let sfxUnlocked = false, ttsUnlocked = false;
function unlockAudio(){
  if(!S.sound) return;
  try{ if(navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; }catch(e){}
  if(!sfxUnlocked){
    const c = actx();
    if(c){
      try{ const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); }catch(e){}
      const done = () => { if(c.state === 'running') sfxUnlocked = true; };
      try{ c.resume().then(done, () => {}); }catch(e){} done();
    }
  }
  if(!ttsUnlocked && hasTTS){
    ttsUnlocked = true;

function tone(f, t0, dur, type='triangle', vol=.14){

  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfxGood = () => { tone(660,0,.15); tone(880,.11,.17); tone(1320,.22,.28,'triangle',.09); };
const sfxBad  = () => { tone(330,0,.16,'sine',.12); tone(247,.14,.26,'sine',.12); };

function meow(){
  const c = actx(); if(!c) return;
  const t = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520,t); o.frequency.linearRampToValueAtTime(880,t+.16); o.frequency.linearRampToValueAtTime(560,t+.55);
  f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(1900,t+.16); f.frequency.linearRampToValueAtTime(900,t+.55);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.06); g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.65);
}

/* ---------- fx ---------- */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el){
  if(reduce || !el) return;
  const r = el.getBoundingClientRect(), fx = $('#fx');
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = rand(['⭐','🐾','✨','🎨','💛']);
    const a = Math.random()*Math.PI*2, d = 80 + Math.random()*90;
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px'); s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    fx.appendChild(s); setTimeout(() => s.remove(), 1050);
  }
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
}

  const f = p => fills[p] || '#FFFFFF';
  return `<svg class="cat ${cls}" viewBox="0 0 300 330" role="img" aria-label="Mishmish the cat">
  <defs><clipPath id="cb${u}"><ellipse cx="150" cy="245" rx="72" ry="62"/></clipPath><clipPath id="ch${u}"><ellipse cx="150" cy="128" rx="74" ry="60"/></clipPath><clipPath id="cf${u}"><rect width="300" height="330" rx="26"/></clipPath></defs>

</svg>`;
}
function itemThumb(item){
  if(item.e) return `<span class="emo-thumb" aria-hidden="true">${item.e}</span>`;
  if(item.slot === 'room'){ if(item.bg) return `<span class="swatch" style="background:${esc(item.bg)}"></span>`; return `<svg viewBox="${item.vb}" aria-hidden="true"><g stroke="#2B2233" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${item.svg()}</g></svg>`; }
  if(item.slot === 'friend') return friendSVG(item);
  if(item.slot === 'fur') return catSVG(DEFAULT_MISH, {fur:item.id});
  if(item.slot === 'pattern') return catSVG(DEFAULT_MISH, {pattern:item.id});
  if(item.slot === 'bg') return `<svg viewBox="0 0 300 330" aria-hidden="true">${item.draw()}</svg>`;
  return `<svg viewBox="${item.box}" aria-hidden="true"><g stroke="#2B2233" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">${item.draw()}</g></svg>`;
}

function prepQs(){
  const qs = shuffle(PREPS).map(([p]) => ({t:'c', q:`Mishmish is ___ ${p === 'between' ? 'the boxes' : 'the box'}.`, o:shuffle(PREPS.map(x => x[0])).filter(x => x !== p).slice(0,2).concat(p), a:2, vis:scene(p), shuf:true}));
  const pick = shuffle(PREPS).slice(0, 3).map(([p]) => {
    const others = shuffle(PREPS.filter(x => x[0] !== p)).slice(0, 2).map(x => x[0]);
    return {t:'c', q:`Mishmish is ${prepWhere(p)}.`, sub:'اقري الجملة واختاري الصورة الصح', o:[...others, p].map(x => scene(x)), a:2, pics:true, say:`Mishmish is ${prepWhere(p)}.`, shuf:true};
  });
  return [...qs, ...pick];
}

function editDist(a, b){
  if(Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length:a.length + 1}, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

      const body = lines.filter((l, k) => l && !(W.steps[0].title && k === 0));
      const text = body.join(' ').replace(/<[^>]+>/g, '');
      const words = text.split(/\s+/).filter(x => /[A-Za-z0-9]/.test(x)).length;
      const checks = W.check.map(c => { const cc = c.replace('{DATE}', vars.DATE); return [c.replace('{DATE}', 'the date'), text.includes(cc) || title.includes(cc)]; });
      screenEl.innerHTML = `<section class="stage">
        <div class="g-head"><h2>موضوعك جاهز! <span class="en" style="font-size:20px;color:var(--ink-soft)">Well done</span></h2>
          <p class="ask">اقريه بصوت عالي، وبعدين اسمعي مشمش وهي بتقراه</p></div>
        <div class="storybox sticker paper" dir="ltr">
          <h3 class="en paper-title">${esc(title)}</h3>
          <div class="story en">${body.map(l => `<p>${l}</p>`).join('')}</div>
        </div>
        <div class="wcheck sticker">
          <span class="pill ${words >= W.target ? 'ok' : ''}">${words} كلمة ${words >= W.target ? '✔' : `· الامتحان بيطلب ${W.target}`}</span>
          ${checks.map(([c, ok]) => `<span class="pill ${ok ? 'ok' : ''}">${ok ? '✔' : '○'} <span class="en">${esc(c)}</span></span>`).join('')}
        </div>
        <div class="row" style="justify-content:center">
          ${sayBtn(title + '. ' + text, 'اسمعي موضوعك')}
          <button class="btn primary" id="typeW">✍️ اكتبيه بإيدك (+٨ ⭐)</button>
          <button class="btn" id="saveW">احفظيه كده</button>
          <button class="btn" id="again">اكتبي تاني</button>
        </div>
        <p class="muted">في الامتحان هتكتبي الموضوع بإيدك، فجربي تكتبيه هنا كمان.</p>
      </section>`;
      $('#again').onclick = () => writeRun(wid, back);
      $('#typeW').onclick = () => typeIt(W, wid, title, body.map(l => l.replace(/<[^>]+>/g, '')), vars.DATE, back);
      $('#saveW').onclick = () => {
        const first = !S.wDone[wid];
        keepWriting(wid, title, text, vars.DATE, false);
        addStars(first ? 5 : 2); meow(); burst($('.paper'));
        $('#saveW').disabled = true; $('#saveW').textContent = `اتحفظ! (+${first ? 5 : 2} ⭐)`;
        setTimeout(back, 1800);
      };
    }
  }
  model();
}

/* ---------- Arabic voice ----------
   1) recorded Egyptian narration (voice_ar/<chapter>.json: id -> MP3 base64), played through Web Audio;
   2) otherwise the device's own Arabic voice (Egyptian first); 3) otherwise text only. */
const AR_CLIPS = {}, AR_LOADING = {}, AR_BUF = {};
const AR_VER = 4;   /* bump when the recordings change so phones don't keep an old copy */
const arChunk = c => AR_LOADING[c] || (AR_LOADING[c] = fetch('voice_ar/' + c + '.json?v=' + AR_VER).then(r => r.ok ? r.json() : {}).then(d => { Object.assign(AR_CLIPS, d); }).catch(() => { delete AR_LOADING[c]; }));
let arVoice = null;
function pickArVoice(){
  if(!hasTTS) return;
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
    arVoice = vs.find(v => /ar[-_]EG/i.test(v.lang)) || vs.find(v => /ar[-_]SA/i.test(v.lang)) || vs[0] || null;
  }catch(e){}
}
if(hasTTS){ pickArVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickArVoice); }catch(e){} }
let arRun = 0, arSrc = null, arWarned = false;
function stopAr(){ arRun++; if(arSrc){ try{ arSrc.stop(); }catch(e){} arSrc = null; } if(hasTTS) try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.say-ar.on').forEach(b => b.classList.remove('on')); }
async function sayAr(text, id, btn){
  if(!S.sound) return;
  stopAr(); stopSpeech();
  const run = arRun;
  if(btn) btn.classList.add('on');
  const off = () => { if(btn && run === arRun) btn.classList.remove('on'); };
  const ch = id && id.match(/^(c\d+|g)/);
  if(ch){ await Promise.race([arChunk(ch[1]), new Promise(r => setTimeout(r, 2500))]); if(run !== arRun) return; }
  if(id && AR_CLIPS[id]){
    const c = actx();
    if(c){
      try{
        if(!AR_BUF[id]){ const bin = atob(AR_CLIPS[id]), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); AR_BUF[id] = await c.decodeAudioData(arr.buffer); }
        if(run !== arRun) return;
        const src = c.createBufferSource(); src.buffer = AR_BUF[id]; src.connect(c.destination); src.onended = off; src.start(c.currentTime + .05); arSrc = src;
        return;
      }catch(e){}
    }
  }
  if(hasTTS){
    if(!arVoice) pickArVoice();
    if(arVoice || !arWarned){
      try{
        const u = new SpeechSynthesisUtterance(text.replace(/[«»]/g, ''));
        u.lang = arVoice ? arVoice.lang : 'ar-EG'; if(arVoice) u.voice = arVoice; u.rate = .92;
        u.onend = off; u.onerror = off;
        try{ speechSynthesis.resume(); }catch(e){}
        setTimeout(() => { if(run === arRun) speechSynthesis.speak(u); }, 90);
        if(!arVoice){ arWarned = true; noArVoice(id); }
        return;
      }catch(e){}
    }
  }
  off(); noArVoice(id);
}

      if(o.exam && pct >= 90 && best) addStars(5);
      return sciDone(`${o.boss ? (pct >= 60 ? '😵 هزمتي غول النسيان! ' : '👾 الغول هرب المرة دي! ') : ''}جاوبتي ${right} من ${qs.length} صح · درجتك ${pct}%${best && sciGet(o.key) === pct ? ' (أحسن درجة ليكي!)' : ''}${o.exam && pct >= 90 && best ? ' · ومعاهم ٥ نجوم هدية 🏆' : ''}`,
        [['🔁 حلي تاني', o.again], [o.backLabel, o.back]], pct);
    }
    const q = qs[i], tf = q.tf !== undefined;
    const idx = tf ? [0, 1] : shuffle(q.o.map((_, k) => k));

      ${o.boss ? `<div class="boss"><span class="boss-m" id="bossM">👾</span><span class="bar boss-hp"><i style="width:${100 - results.filter(Boolean).length / qs.length * 100}%"></i></span><span class="boss-cat">${sciCat()}</span></div>` : ''}
      <div class="qcard sticker sci-q">

      </div>
      <div class="opts words ${idx.length === 2 ? 'n2' : ''} sci-opts">${idx.map(k => `<button class="opt wopt" data-k="${k}">${label(k)}</button>`).join('')}</div>
      <p class="sci-fb" aria-live="polite"></p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="qNext" hidden>${i < qs.length - 1 ? 'السؤال اللي بعده' : 'النتيجة'}</button></div>
    </section>`;
    const go = () => { i++; next(); };
    $('#qNext').onclick = go;
    screenEl.querySelectorAll('.sci-opts .opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === answer;
      screenEl.querySelectorAll('.sci-opts .opt').forEach(x => { x.disabled = true; if(+x.dataset.k === answer) x.classList.add('right'); });
      results[i] = ok;
      if(ok){ b.classList.add('right'); sfxGood(); addStars(1); burst(b); if(o.boss){ const m = $('#bossM'); m.classList.add('hit'); screenEl.querySelector('.boss-hp i').style.width = (100 - results.filter(Boolean).length / qs.length * 100) + '%'; burst(m); } }
      else { b.classList.add('wrong'); sfxBad(); if(o.boss){ const m = $('#bossM'); m.textContent = '😝'; } }
      cheerAr(ok);

      $('#qNext').hidden = false;
      if(ok) setTimeout(() => { if(document.contains(b) && results.length === i + 1) go(); }, 2200);
    });
  }
  next();
}

/* ---------- games ---------- */
function sciPool(L){
  const mc = L.qs.filter(q => q.tf === undefined).map(q => ({q: q.q, o: q.o, a: q.a}));
  const tf = L.qs.filter(q => q.tf !== undefined).map(q => ({q: q.q, tf: q.tf}));
  const chTerms = L.ch.lessons.flatMap(x => x.terms);
  L.terms.forEach(([t, d]) => {
    const others = shuffle(chTerms.filter(x => x[0] !== t && x[1] !== d)).slice(0, 2);
    if(others.length) mc.push({q: `«${t}» معناها إيه؟`, o: [d, ...others.map(x => x[1])], a: 0});
    tf.push({q: `${t}: ${d}`, tf: true});
    if(others[0]) tf.push({q: `${t}: ${others[0][1]}`, tf: false});
  });
  return {mc, tf};
}
const SCI_GAMES = [
  {id:'catch', ico:'🫧', t:'اصطادي الإجابة', d:'الإجابات بتنزل من السما، اصطادي الصح قبل ما توقع!', c:'#DCEBFF'},
  {id:'race', ico:'🏎️', t:'سباق مشمش والسلحفاة', d:'كل إجابة صح عربية مشمش تتقدم. اسبقي السلحفاة!', c:'#FFE1CC'},
  {id:'swipe', ico:'⚡', t:'صح ولا غلط بسرعة', d:'جملة ورا جملة، اعملي أطول سلسلة إجابات صح 🔥', c:'#FFF0BF'},
  {id:'match', ico:'🔗', t:'وصّلي المصطلح', d:'وصّلي كل مصطلح بمعناه بأسرع وقت', c:'#D8F5E6'},

  {id:'school', ico:'📝', t:'أسئلة زي الامتحان', d:'أسئلة الكتاب بشكل امتحان المدرسة', c:'#FFFFFF'}

function gameWon(lid, pct, msg, again){
  const first = pct >= 60 && sciSet('g_' + lid, 1);
  if(first) addStars(2);
  sciDone(msg + (first ? ' · ومعاهم نجمتين هدية ⭐' : ''), [['🔁 العبي تاني', again], ['🎮 لعبة تانية', () => sciPlay(lid)], ['ارجعي للجزيرة', () => sciLesson(lid)]], pct);
}
const hearts = n => '❤️'.repeat(Math.max(0, n)) + '🤍'.repeat(Math.max(0, 3 - n));

/* catch: answers fall in lanes; tap the right one before it lands */
function gCatch(lid){
  setTop(true); stopAr();
  const L = SCI_LESSON[lid], C = L.ch, P = sciPool(L);
  const fits = q => q.o.every(o => o.length <= 26);
  let qs = shuffle([...P.mc.filter(fits), ...P.tf]).slice(0, 8);
  let i = 0, life = 3, right = 0;
  function round(){
    stopAr();
    if(i >= qs.length || life <= 0){
      const pct = Math.round(right / qs.length * 100);
      return gameWon(lid, pct, life <= 0 ? `خلصت القلوب! اصطدتي ${right} إجابة صح.` : `اصطدتي ${right} من ${qs.length} إجابة صح!`, () => gCatch(lid));
    }
    const q = qs[i], tf = q.tf !== undefined;
    const opts = tf ? [['✔ صح', q.tf], ['✘ خطأ', !q.tf]] : shuffle([[q.o[q.a], true], ...shuffle(q.o.filter((_, k) => k !== q.a)).slice(0, 2).map(o => [o, false])]);
    screenEl.innerHTML = `<section class="stage sci" style="--uc:${C.c};--ucl:${C.cl}">
      <div class="g-head"><h2>🫧 اصطادي الإجابة</h2><p class="ask"><span class="hearts">${hearts(life)}</span> · سؤال ${i + 1} من ${qs.length}</p></div>
      <div class="qcard sticker sci-q"><p class="sci-qt">${q.q}</p></div>
      <div class="sky n${opts.length}">${opts.map(([t, ok], k) => `<button class="drop" data-ok="${ok ? 1 : 0}" style="--lane:${k};--dl:${(k * .45 + Math.random() * .5).toFixed(2)}s">${t}</button>`).join('')}<div class="sky-ground"></div></div>
    </section>`;
    sayAr(q.q, '');
    let over = false;
    const end = ok => { if(over) return; over = true; screenEl.querySelectorAll('.drop').forEach(d => d.style.animationPlayState = 'paused'); i++; setTimeout(round, ok ? 900 : 1600); };
    screenEl.querySelectorAll('.drop').forEach(d => {
      d.onclick = () => {
        if(over) return;
        if(d.dataset.ok === '1'){ right++; d.classList.add('caught'); sfxGood(); addStars(1); burst(d); cheerAr(true); end(true); }
        else { d.classList.add('miss'); sfxBad(); life--; screenEl.querySelector('.hearts').textContent = hearts(life); d.disabled = true; if(life <= 0){ screenEl.querySelector('.drop[data-ok="1"]').classList.add('show'); end(false); } }
      };
      d.addEventListener('animationend', () => {
        if(over || d.dataset.ok !== '1') return;
        life--; sfxBad(); d.classList.add('show'); screenEl.querySelector('.hearts').textContent = hearts(life); toast('الإجابة الصح وقعت! 💦'); end(false);
      });
    });
  }
  round();
}

/* race: every right answer drives Mishmish forward; the turtle moves on its own */
function gRace(lid){
  setTop(true); stopAr();
  const L = SCI_LESSON[lid], C = L.ch, P = sciPool(L);
  const qs = shuffle([...P.mc, ...P.tf]);
  const GOAL = 7, TURTLE_SEC = 150;
  let me = 0, t0 = Date.now(), i = 0, timer = null, over = false;
  screenEl.innerHTML = `<section class="stage sci" style="--uc:${C.c};--ucl:${C.cl}">
    <div class="g-head"><h2>🏎️ سباق مشمش والسلحفاة</h2><p class="ask">جاوبي ${GOAL} إجابات صح قبل ما السلحفاة توصل لخط النهاية!</p></div>
    <div class="track sticker">
      <div class="lane"><span class="racer me" id="rMe">🏎️<small>مشمش</small></span></div>
      <div class="lane"><span class="racer tt" id="rTt">🐢<small>توتو</small></span></div>
      <span class="finish" aria-hidden="true">🏁</span>
    </div>
    <div id="rq" class="rq"></div>
  </section>`;
  const pos = (el, f) => { el.style.insetInlineStart = `calc(${(f * 86).toFixed(1)}% )`; };
  const stop = () => { over = true; clearInterval(timer); };
  timer = setInterval(() => {
    if(!document.contains($('#rTt'))){ clearInterval(timer); return; }
    const f = Math.min(1, (Date.now() - t0) / 1000 / TURTLE_SEC); pos($('#rTt'), f);
    if(f >= 1 && !over){ stop(); setTimeout(() => gameWon(lid, Math.round(me / GOAL * 100), `السلحفاة وصلت الأول! إنتي جاوبتي ${me} صح. جربي تاني وهتسبقيها 💪`, () => gRace(lid)), 600); }
  }, 250);
  function ask(){
    if(over) return;
    const q = qs[i++ % qs.length], tf = q.tf !== undefined;
    const idx = tf ? [0, 1] : shuffle(q.o.map((_, k) => k)), ans = tf ? (q.tf ? 0 : 1) : q.a;
    $('#rq').innerHTML = `<div class="qcard sticker sci-q"><p class="sci-qt">${q.q}</p></div>
      <div class="opts words ${idx.length === 2 ? 'n2' : ''} sci-opts">${idx.map(k => `<button class="opt wopt" data-k="${k}">${tf ? (k === 0 ? '✔ صح' : '✘ خطأ') : q.o[k]}</button>`).join('')}</div>`;
    sayAr(q.q, '');
    $('#rq').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if(over) return;
      const ok = +b.dataset.k === ans;
      $('#rq').querySelectorAll('.opt').forEach(x => { x.disabled = true; if(+x.dataset.k === ans) x.classList.add('right'); });
      if(ok){ me++; sfxGood(); addStars(1); pos($('#rMe'), me / GOAL); $('#rMe').classList.add('zoom'); setTimeout(() => $('#rMe') && $('#rMe').classList.remove('zoom'), 500); }
      else { b.classList.add('wrong'); sfxBad(); $('#rMe').classList.add('spin'); setTimeout(() => $('#rMe') && $('#rMe').classList.remove('spin'), 700); }
      cheerAr(ok);
      if(me >= GOAL){ stop(); burst($('#rMe')); setTimeout(() => gameWon(lid, 100, `كسبتي السباق! 🏆 مشمش وصلت قبل السلحفاة.`, () => gRace(lid)), 900); return; }
      setTimeout(ask, ok ? 1100 : 2000);
    });
  }
  ask();
}

/* swipe: true/false statements, keep the streak going */
function gSwipe(lid){
  setTop(true); stopAr();
  const L = SCI_LESSON[lid], C = L.ch, P = sciPool(L);
  const deck = shuffle(P.tf).slice(0, 12);
  let i = 0, streak = 0, best = 0, right = 0;
  function card(){
    stopAr();
    if(i >= deck.length){ const pct = Math.round(right / deck.length * 100); return gameWon(lid, pct, `جاوبتي ${right} من ${deck.length} صح · أطول سلسلة 🔥 ${best}`, () => gSwipe(lid)); }
    const q = deck[i];
    screenEl.innerHTML = `<section class="stage sci" style="--uc:${C.c};--ucl:${C.cl}">
      <div class="g-head"><h2>⚡ صح ولا غلط؟</h2><p class="ask">كارت ${i + 1} من ${deck.length} · السلسلة 🔥 ${streak}</p></div>
      <div class="swipe-wrap"><div class="swipe-card sticker" id="sw"><p>${q.q}</p><small class="muted">اسحبي الكارت يمين لو صح ✔ وشمال لو غلط ✘</small></div></div>
      <div class="row" style="justify-content:center;gap:24px"><button class="btn sw-no" id="swNo">✘ غلط</button><button class="btn sw-yes" id="swYes">✔ صح</button></div>
      <p class="sci-fb" aria-live="polite"></p>
    </section>`;
    sayAr(q.q, '');
    const el = $('#sw'); let x0 = null, dx = 0, done = false;
    const answer = says => {
      if(done) return; done = true;
      const ok = says === q.tf;
      el.style.transition = 'transform .35s, opacity .35s'; el.style.transform = `translateX(${says ? 140 : -140}%) rotate(${says ? 18 : -18}deg)`; el.style.opacity = '0';
      if(ok){ right++; streak++; best = Math.max(best, streak); sfxGood(); addStars(1); if(streak > 0 && streak % 5 === 0){ addStars(2); toast(`سلسلة ${streak} 🔥 نجمتين زيادة!`); } }
      else { streak = 0; sfxBad(); }
      cheerAr(ok);
      screenEl.querySelector('.sci-fb').innerHTML = ok ? '✔ صح!' : `✘ لأ، الجملة دي <b>${q.tf ? 'صح' : 'غلط'}</b>`;
      i++; setTimeout(card, ok ? 1000 : 2200);
    };
    $('#swYes').onclick = () => answer(true); $('#swNo').onclick = () => answer(false);
    el.addEventListener('pointerdown', e => { x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
    el.addEventListener('pointermove', e => { if(x0 === null || done) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`; el.classList.toggle('lean-yes', dx > 40); el.classList.toggle('lean-no', dx < -40); });
    el.addEventListener('pointerup', () => { if(x0 === null) return; x0 = null; if(Math.abs(dx) > 90) answer(dx > 0); else { el.style.transition = 'transform .2s'; el.style.transform = ''; el.classList.remove('lean-yes', 'lean-no'); } dx = 0; });
  }
  card();
}

/* match: tap a term, then its meaning */
function gMatch(lid){
  setTop(true); stopAr();
  const L = SCI_LESSON[lid], C = L.ch;
  let terms = [...L.terms];
  if(terms.length < 3) terms = terms.concat(shuffle(C.lessons.filter(x => x !== L).flatMap(x => x.terms)).slice(0, 3 - terms.length));
  terms = shuffle(terms).slice(0, 4);
  const t0 = Date.now(); let pick = null, left = terms.length, miss = 0;
  screenEl.innerHTML = `<section class="stage sci" style="--uc:${C.c};--ucl:${C.cl}">
    <div class="g-head"><h2>🔗 وصّلي المصطلح</h2><p class="ask">دوسي على المصطلح، وبعدين على معناه</p></div>
    <div class="mt-terms">${shuffle(terms.map((t, k) => k)).map(k => `<button class="mt-term" data-k="${k}">${terms[k][0]}</button>`).join('')}</div>
    <div class="mt-defs">${shuffle(terms.map((t, k) => k)).map(k => `<button class="mt-def sticker" data-k="${k}"><span class="mt-tag"></span>${terms[k][1]}</button>`).join('')}</div>
  </section>`;
  const ts = screenEl.querySelectorAll('.mt-term');
  ts.forEach(b => b.onclick = () => { if(b.disabled) return; ts.forEach(x => x.classList.remove('picked')); pick = b; b.classList.add('picked'); sfxTick(); sayAr(terms[+b.dataset.k][0], ''); });
  screenEl.querySelectorAll('.mt-def').forEach(d => d.onclick = () => {
    if(d.classList.contains('ok')) return;
    if(!pick){ toast('اختاري مصطلح الأول 👆'); return; }
    if(pick.dataset.k === d.dataset.k){
      d.classList.add('ok'); d.querySelector('.mt-tag').textContent = '✔ ' + terms[+d.dataset.k][0];
      pick.classList.remove('picked'); pick.classList.add('ok'); pick.disabled = true; pick = null; sfxGood(); addStars(1);
      if(--left === 0){ const sec = Math.round((Date.now() - t0) / 1000); cheerAr(true); setTimeout(() => gameWon(lid, miss <= 2 ? 100 : 70, `وصّلتي كل المصطلحات في ${sec} ثانية${miss ? ` وغلطتي ${miss === 1 ? 'مرة واحدة' : miss === 2 ? 'مرتين' : miss + ' مرات'}` : ' من غير ولا غلطة!'}`, () => gMatch(lid)), 700); }
    } else { miss++; sfxBad(); d.classList.add('wrong'); setTimeout(() => d.classList.remove('wrong'), 450); }
  });
}

/* LAB[lesson] = {t: title, goal: what to do, found: what we discovered, run(host, api)}; api.done() marks the discovery */
const LAB = {};
function sciLab(lid){
  setTop(true); stopAr();
  const L = SCI_LESSON[lid], C = L.ch, X = LAB[lid];
  arChunk(C.id);
  screenEl.innerHTML = `<section class="hub sci lab-page" style="--uc:${C.c};--ucl:${C.cl}">
    ${sciCrumbs([['خريطة الرحلة', 'world'], [C.title, C.id], ['المعمل']])}
    <div class="lab-head sticker"><span class="lh-ico" aria-hidden="true">🧪</span><div><h2>${X.t}</h2><p>${X.goal}</p></div>${sayArBtn(X.goal, lid + '_lab0', 'اسمعي')}</div>
    <div class="lab sticker" id="labHost"></div>
    <div class="lab-found sticker" id="labFound" hidden><b>💡 اكتشفتي!</b><p>${X.found}</p>${sayArBtn(X.found, lid + '_lab1', 'اسمعي')}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="labBack">ارجعي للجزيرة</button><button class="btn primary" id="labNext" ${sciGet('lab_' + lid) ? '' : 'hidden'}>🎮 يلا نلعب</button></div>
  </section>`;
  bindSciCrumbs();
  $('#labBack').onclick = () => sciLesson(lid);
  $('#labNext').onclick = () => sciPlay(lid);
  setTimeout(() => { const b = screenEl.querySelector('.lab-head .say-ar'); if(b && document.contains(b)) sayAr(X.goal, lid + '_lab0', b); }, 400);
  let found = false;
  const host = $('#labHost');
  X.run(host, {
    done(){
      if(found || !document.contains(host)) return; found = true;
      const f = $('#labFound'); f.hidden = false; $('#labNext').hidden = false;
      const first = sciSet('lab_' + lid, 1); if(first) addStars(3);
      sfxGood(); burst(f); setTimeout(() => { f.scrollIntoView({block:'nearest', behavior:'smooth'}); sayAr(X.found, lid + '_lab1', f.querySelector('.say-ar')); }, 700);
      if(first) toast('تجربة ناجحة! ٣ نجوم ⭐');
    },
    say(t){ const m = host.querySelector('.lab-msg'); if(m) m.innerHTML = t; },
    good: sfxGood, bad: sfxBad
  });
}
/* helpers */
const labMsg = (t = '') => `<p class="lab-msg" aria-live="polite">${t}</p>`;
const svgPt = (svg, e) => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
const emo = (x, y, e, s = 26, extra = '') => `<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${extra}>${e}</text>`;
const SKY = (h = 150, c = '#CFEFFF') => `<rect width="400" height="${h}" fill="${c}"/>`;
const choiceRow = (name, opts, cur) => `<div class="lab-ctl" role="group">${opts.map(([v, t]) => `<button class="chip" data-${name}="${v}" aria-pressed="${v === cur}">${t}</button>`).join('')}</div>`;
function pickTap(host, sel, attr, onPick){ host.querySelectorAll(sel).forEach(b => b.onclick = () => { host.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', String(x === b))); onPick(b.getAttribute(attr)); }); }
/* generic "tap the card, then the place" sorter used by several experiments */
function labSorter(host, api, rounds, finalMsg){
  let r = 0;
  function show(){
    const R = rounds[r]; let pick = null, left = R.items.length;
    host.innerHTML = `<p class="lab-q">${R.q}</p>
      <div class="sci-pool">${shuffle(R.items.map((_, k) => k)).map(k => `<button class="sci-item" data-it="${k}"><span class="emo">${R.items[k][0]}</span>${R.items[k][1]}</button>`).join('')}</div>
      <div class="lab-bins n${R.groups.length}">${R.groups.map((g, gi) => `<button class="lab-bin" data-g="${gi}" style="--bc:${g[2] || 'var(--ucl)'}"><span class="bin-ico">${g[0]}</span><b>${g[1]}</b><span class="sci-in"></span></button>`).join('')}</div>
      ${labMsg(rounds.length > 1 ? `جولة ${r + 1} من ${rounds.length}` : '')}`;
    const items = host.querySelectorAll('.sci-item');
    items.forEach(b => b.onclick = () => { items.forEach(x => x.classList.remove('picked')); pick = b; b.classList.add('picked'); sfxTick(); });
    host.querySelectorAll('.lab-bin').forEach(g => g.onclick = () => {
      if(!pick){ toast('اختاري كارت الأول 👆'); return; }
      const it = R.items[+pick.dataset.it];
      if(it[2] === +g.dataset.g){
        api.good(); g.querySelector('.sci-in').insertAdjacentHTML('beforeend', `<span class="bin-it">${it[0]}</span>`);
        pick.remove(); pick = null;
        if(--left === 0){ if(++r < rounds.length){ api.say('👏 برافو! الجولة اللي بعدها...'); setTimeout(show, 1100); } else { api.say(finalMsg || '👏 برافو!'); api.done(); } }
      } else { api.bad(); api.say(it[3] || 'لأ، فكّري تاني 🤔'); pick.classList.add('wrong'); const p = pick; setTimeout(() => p.classList.remove('wrong'), 450); }
    });
  }
  show();
}
/* tap the steps in the right order; each step can draw something */
function labSteps(host, api, steps, scene){
  let at = 0;
  host.innerHTML = `<svg class="lab-svg" viewBox="0 0 400 230">${scene(0)}</svg>
    <div class="sci-pool">${shuffle(steps.map((_, k) => k)).map(k => `<button class="sci-item" data-st="${k}"><span class="emo">${steps[k][0]}</span>${steps[k][1]}</button>`).join('')}</div>${labMsg('رتّبي الخطوات: دوسي على الخطوة الأولى')}`;
  host.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    if(+b.dataset.st === at){
      at++; api.good(); b.classList.add('ok'); b.disabled = true;
      host.querySelector('svg').innerHTML = scene(at);
      api.say(at < steps.length ? `✔ ${steps[at - 1][1]}... وبعدين؟` : '🎉 كده عملناها صح!');
      if(at === steps.length) api.done();
    } else { api.bad(); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450); api.say(`لأ، الخطوة دي مش دلوقتي. فكّري: إيه اللي بنعمله ${at === 0 ? 'الأول' : 'بعد ' + steps[at - 1][1]}؟`); }
  });
}

      if(!dark){ if(!hid.has(k)){ hid.add(k); api.good(); api.say(hid.size === 2 ? '✔ الاتنين في الجحر بعيد عن الحر! دلوقتي حركي الوقت لليل 🌙' : '✔ استخبى في الجحر تحت الأرض. والتاني؟'); } }
      else if(k === 1 && !ears){ ears = true; api.good(); api.say('🦊 شوفي ودان الفنك الكبيرة! بتساعده يطلّع الحرارة من جسمه ويسمع الحشرات من بعيد.'); if(night) setTimeout(api.done, 900); }
      draw();
    };
    host.innerHTML = `<svg class="lab-svg tap" viewBox="0 0 400 250"></svg>

    $('#hour').oninput = e => {
      hour = +e.target.value; $('#hr').textContent = fmt(hour);
      if(hour >= 19){
        if(hid.size < 2){ api.say('استني! الأول خبّي الحيوانات من حر الضهر 🥵'); hour = 13; e.target.value = 13; $('#hr').textContent = fmt(13); }
        else if(!night){ night = true; hid.clear(); api.good(); api.say('🌙 الجو برد بالليل، فاليربوع والفنك طلعوا يدوّروا على أكل! دوسي على الفنك 🦊'); if(ears) setTimeout(api.done, 900); }
      }
      draw();
    };
    draw();
  }};

LAB.c2l1 = {t:'من بيضة ليرقة', goal:'فقّسي البيض، وبعدين أكّلي اليرقة ورق شجر وشوفيها بتكبر وبتنسلخ.',
  found:'الحشرة بتبدأ حياتها بيضة، وبتفقس يرقة. اليرقة بتاكل كتير وبتكبر، ولما جلدها يضيق عليها بتغيّره، وده اسمه الانسلاخ.',

        ${stage === 0 ? `<g class="eggs">${[[170, 175], [190, 170], [210, 176], [230, 170]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="9" fill="#FFF7D6" stroke="#2B2233" stroke-width="2"/>`).join('')}</g>`
          : `${molts ? Array.from({length:molts}, (_, k) => emo(60 + k * 30, 205, '🫥', 16)).join('') : ''}<g>${seg(size)}<circle cx="${130 + size * 17}" cy="150" r="${11 + size / 2}" fill="#5DA02E" stroke="#2B2233" stroke-width="2.5"/>${emo(130 + size * 17 + 4, 147, '👀', 12)}</g>
            ${[[320, 80], [350, 120], [280, 60]].map(([x, y], k) => `<g class="leafbtn" data-k="${k}" role="button">${emo(x, y, '🍃', 34)}</g>`).join('')}`}`;
      host.querySelectorAll('.leafbtn').forEach(b => b.onclick = feed);
      const eggs = host.querySelector('.eggs'); if(eggs) eggs.onclick = hatch;
    };
    const hatch = () => { stage = 1; api.good(); api.say('🥚➡️🐛 البيض فقس وطلعت يرقة صغيرة! أكّليها ورق 🍃'); draw(); };
    const feed = () => {
      bites++; api.good(); size = Math.min(9, size + 1);
      if(bites % 3 === 0){ molts++; api.say(`✨ انسلاخ ${molts === 1 ? 'أول' : 'تاني'}! اليرقة كبرت وجلدها القديم ضاق عليها فغيّرته.`); if(molts === 2) setTimeout(api.done, 800); }
      else api.say(`😋 اليرقة بتاكل... ${3 - bites % 3 === 1 ? 'لقمة كمان' : 'كمان لقمتين'} وهتنسلخ`);
      draw();

LAB.c2l2 = {t:'سر الشرنقة', goal:'اليرقة جاهزة! خليها تعمل شرنقة، وعدّي الأيام لحد ما الفراشة تطلع، وبعدين رتّبي دورة الحياة.',

      else if(day < 5) api.say(`يوم ${day + 1}: جوه الشرنقة جسم اليرقة بيتغير... ${day === 4 ? 'خلاص قربت!' : 'كمّلي'}`);
      else { api.say('🦋 الفراشة خرجت من الشرنقة! جناحاتها كانت مكرمشة وبتفردها دلوقتي.'); setTimeout(order, 1600); }

      host.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if(+b.dataset.c === at){ api.good(); $('#cyc').insertAdjacentHTML('beforeend', `<li>${st[at][0]} ${st[at][1]}</li>`); b.remove(); if(++at === 4) api.done(); } else { api.bad(); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450); } });

LAB.c2l3 = {t:'ركّبي حشرة', goal:'ركّبي جسم الفراشة: اختاري الجزء وحطيه في مكانه الصح في الجسم (الرأس، الصدر، البطن).',
  found:'جسم الحشرة البالغة ٣ أجزاء: رأس فيه قرنين استشعار وعيون، وصدر فيه ٦ أرجل والأجنحة، وبطن. والعنكبوت مش حشرة لأن جسمه جزئين وعنده ٨ أرجل.',
  run(host, api){
    const parts = [['📡', 'قرنا الاستشعار', 0], ['👀', 'العيون', 0], ['🦵', '٦ أرجل', 1], ['🪽', 'الأجنحة', 1]];

        ${placed.has(2) ? [-1, 0, 1].map(k => `<path d="M188 ${125 + k * 14} l-34 ${10 + k * 8} M212 ${125 + k * 14} l34 ${10 + k * 8}" stroke="#2B2233" stroke-width="4" stroke-linecap="round"/>`).join('') : ''}
        <g class="zone" data-z="0"><circle cx="200" cy="62" r="20" fill="#6B4E9B" stroke="#2B2233" stroke-width="3"/>${!placed.size ? '<text x="200" y="28" text-anchor="middle" font-size="13" font-weight="800">رأس</text>' : ''}</g>

        <g class="zone" data-z="2"><ellipse cx="200" cy="190" rx="14" ry="44" fill="#9579C9" stroke="#2B2233" stroke-width="3"/></g>
        ${placed.has(0) ? '<path d="M192 46 q-14 -26 -26 -30 M208 46 q14 -26 26 -30" stroke="#2B2233" stroke-width="3" fill="none"/><circle cx="166" cy="16" r="4" fill="#2B2233"/><circle cx="234" cy="16" r="4" fill="#2B2233"/>' : ''}
        ${placed.has(1) ? '<circle cx="191" cy="58" r="6" fill="#fff" stroke="#2B2233" stroke-width="2"/><circle cx="209" cy="58" r="6" fill="#fff" stroke="#2B2233" stroke-width="2"/>' : ''}
        <text x="330" y="66" font-size="14" font-weight="800">← الرأس</text><text x="330" y="116" font-size="14" font-weight="800">← الصدر</text><text x="330" y="196" font-size="14" font-weight="800">← البطن</text>`;
      host.querySelectorAll('.zone').forEach(z => z.onclick = () => drop(+z.dataset.z));

    const drop = z => {

      else { api.bad(); api.say(`لأ، ${p[1]} مش في ${['الرأس', 'الصدر', 'البطن'][z]}. جربي تاني`); }

      host.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { if(b.dataset.sp === '0'){ api.good(); api.say('✔ صح! الحشرة ٣ أجزاء و٦ أرجل، والعنكبوت جزئين و٨ أرجل.'); api.done(); } else { api.bad(); api.say('لأ، عدّي الأرجل: الحشرة ٦ أرجل بس!'); } });

    host.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { host.querySelectorAll('[data-p]').forEach(x => x.classList.remove('picked')); b.classList.add('picked'); pick = +b.dataset.p; sfxTick(); });

LAB.c3l1 = {t:'ازرعي بذرة', goal:'ازرعي بذرة دوار الشمس: رتّبي خطوات الزراعة صح علشان تنبت.',

LAB.c3l2 = {t:'يوميات النبتة', goal:'حركي الأيام وشوفي النبتة بتكبر إزاي. ولما الأوراق تطلع، دوسي على الأوراق البذرية والأوراق الحقيقية.',
  found:'أول ما البذرة تنبت بتطلع الأوراق البذرية (الفلقتين)، وبعدين تطلع الأوراق الحقيقية اللي شكلها مختلف. والنبات بيطول يوم بعد يوم.',
  run(host, api){

      host.querySelector('svg').innerHTML = `${SKY(240, '#F2FBFF')}<rect y="175" width="400" height="65" fill="#8B5A2B"/>

LAB.c3l3 = {t:'من زهرة لثمرة', goal:'حركي مراحل النمو: برعم، زهرة، ثمرة، وبعدين اقطعي الثمرة وشوفي جواها إيه.',
  found:'النبات بيكوّن براعم بتتفتح أزهار، والزهرة بتتحول لثمرة، وجوه الثمرة بذور جديدة. البذور دي لو زرعناها بيطلع نبات جديد، وكده تكمل دورة حياة النبات.',
  run(host, api){
    let s = 0, cut = false;
    const names = ['برعم', 'زهرة متفتحة', 'الأوراق التويجية بتقع', 'ثمرة صغيرة', 'ثمرة ناضجة'];
    const draw = () => {

          : `<g class="fruit" role="button"><circle cx="${X}" cy="${Y}" r="${s === 3 ? 18 : 38}" fill="${s === 3 ? '#9CCB5E' : '#F0443A'}" stroke="#2B2233" stroke-width="3"/><path d="M${X - 8} ${Y - (s === 3 ? 18 : 38)} l8 8 l8 -8" stroke="#2E9B45" stroke-width="4" fill="none"/></g>${s === 4 ? emo(X + 70, Y, '🔪', 26) : ''}`}

LAB.c3l4 = {t:'أجزاء النبات', goal:'حطي اسم كل جزء على النبات، وبعدين اسقي النبات وشوفي المية بتمشي فين.',
  found:'النبات ليه جذور بتمتص المية والأملاح من التربة وبتثبته، وساق بتنقل المية للأوراق وبتشيل النبات، وأوراق بتصنع غذاء النبات.',

        <g class="pz" data-z="flower">${[0, 72, 144, 216, 288].map(a => `<circle cx="${200 + 16 * Math.cos(a * Math.PI / 180)}" cy="${42 + 16 * Math.sin(a * Math.PI / 180)}" r="11" fill="#F2558F" stroke="#2B2233" stroke-width="2"/>`).join('')}<circle cx="200" cy="42" r="9" fill="#F5B700" stroke="#2B2233" stroke-width="2"/></g>

<title>Mishmish English Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: a sketchbook desk. Sticker-style cards with a hard ink shadow sit on dotted lilac paper; one stage at a time. */
:root{
  --paper:#F3EEFF; --dot:#D9CFF4; --card:#FFFFFF; --ink:#2B2233; --ink-soft:#5E546B;
  --tangerine:#FF8A3D; --tangerine-l:#FFE1CC;
  --teal:#159E8F; --teal-l:#CDF1EA;
  --pink:#F2558F; --pink-l:#FFDCEA;
  --sun:#F5B700; --sun-l:#FFF0BF;
  --grape:#7A4FD6; --grape-l:#E6DCFF;
  --good:#23A452; --good-l:#D7F5E0; --bad:#D93A30; --bad-l:#FFE0DD;
  --display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --learn:"Andika","Baloo Bhaijaan 2","Segoe UI",Arial,sans-serif;
  --r:20px; --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:var(--display);font-size:18px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:26px 26px;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.en{font-family:var(--learn);direction:ltr;unicode-bidi:isolate}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;line-height:1}
.brand svg{width:40px;height:40px}
.brand small{display:block;font-size:13px;font-weight:500;color:var(--ink-soft)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:800}
.stars{background:var(--sun-l);font-size:20px}
.stars b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.icon-btn{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:4px 12px;font-weight:700;font-size:16px}
.icon-btn:hover{background:var(--grape-l)}

main{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}

.sticker{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 22px;font-weight:800;font-size:19px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--tangerine)}
.btn.soft{background:var(--sun-l)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.say{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--teal-l);padding:4px 14px;font-weight:700;font-size:16px}
.say svg{width:20px;height:20px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center}
.hero-cat svg{width:100%;height:auto;display:block}
.bubble{padding:20px 24px;position:relative;display:grid;gap:8px}
.bubble .hello{font-size:34px;font-weight:700;margin:0;line-height:1.2}
.bubble p{margin:0;max-width:56ch}
.sec-title{font-size:24px;font-weight:800;margin:36px 0 12px;text-wrap:balance}
.sec-title span{font-family:var(--learn);font-weight:700;color:var(--ink-soft);font-size:17px;margin-inline-start:8px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:6px 16px;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:baseline}
.chip .en{font-weight:700;color:var(--ink-soft);font-size:15px}
.chip[aria-pressed="true"]{background:var(--grape);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip[aria-pressed="true"] .en{color:#EDE6FF}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;align-items:center;text-align:start;padding:18px 20px;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:7px 7px 0 var(--ink)}
.tile svg{width:84px;height:84px}
.tile h3{margin:0;font-size:26px;line-height:1.15}
.tile .en{display:block;font-size:17px;font-weight:700;color:var(--ink-soft)}
.tile p{margin:4px 0 0;font-size:16px;color:var(--ink-soft)}
.t-listen{background:var(--teal-l)} .t-spell{background:var(--sun-l)} .t-color{background:var(--pink-l)} .t-memory{background:var(--grape-l)}

.closet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.acc{padding:12px;display:grid;justify-items:center;gap:2px;border:3px solid var(--ink);border-radius:18px;background:var(--card)}
.acc .ico{font-size:40px;line-height:1.2}
.acc .en{font-weight:700;font-size:18px}
.acc small{color:var(--ink-soft);font-size:14px}
.acc.locked{background:transparent;border-style:dashed;color:var(--ink-soft)}
.acc.locked .ico{filter:grayscale(1);opacity:.45}
.acc.on{background:var(--tangerine-l);box-shadow:3px 3px 0 var(--ink)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.g-item{padding:10px;display:grid;gap:8px}
.g-item svg{width:100%;height:auto}
.g-item .row{gap:6px;justify-content:center}
.g-item .row button{font-size:13px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:700}
.empty{padding:20px;border:3px dashed var(--ink-soft);border-radius:var(--r);color:var(--ink-soft);margin:0}

.parents{margin-top:36px;padding:0}
.parents summary{padding:16px 20px;font-weight:800;font-size:20px;cursor:pointer}
.parents .in{padding:0 20px 20px;display:grid;gap:18px}
.parents h4{margin:0 0 6px;font-size:18px}
.parents ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:16px}
.parents label{font-weight:700;font-size:16px}
.parents input{font:inherit;font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;width:min(260px,100%)}
.tricky{display:flex;flex-wrap:wrap;gap:8px}
.tricky button{border:2px solid var(--ink);border-radius:999px;background:var(--bad-l);padding:2px 12px;font-size:16px}
.tricky b{font-family:var(--learn)}
.muted{color:var(--ink-soft);font-size:15px;margin:0}

/* game stage */
.stage{display:grid;gap:18px;justify-items:center;text-align:center}
.g-head{display:grid;gap:4px;justify-items:center}
.g-head h2{margin:0;font-size:30px;line-height:1.2}
.g-head .ask{margin:0;font-size:19px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--sun)} .dots i.miss{background:var(--tangerine-l)}
.qcard{padding:18px 28px;display:grid;gap:10px;justify-items:center;min-width:min(420px,100%)}
.bigword{font-family:var(--learn);font-size:64px;font-weight:700;line-height:1.1;margin:0;direction:ltr}
.speaker{width:120px;height:120px;border-radius:50%;border:3px solid var(--ink);background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.speaker svg{width:60px;height:60px}
.speaker:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%;max-width:820px}
.opt{aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .1s}
.opt:hover{transform:translateY(-3px)}
.emo{font-size:clamp(54px,8vw,84px);line-height:1}
.sw{display:block;width:62%;aspect-ratio:1;border-radius:50%;background:var(--c);border:3px solid var(--ink)}
.opt.right{background:var(--good-l);border-color:var(--good);animation:pop .4s}
.opt.wrong{background:var(--bad-l);animation:shake .4s}
.opt.hint{animation:pulse 1s infinite}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--sun)}}
.feedback{min-height:64px;font-size:22px;font-weight:700;display:grid;place-items:center;gap:2px}
.feedback .en{font-size:28px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

/* spell */
.pic-big{font-size:110px;line-height:1}
.pic-big .sw{width:120px}
.slots,.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr}
.slot{width:68px;height:78px;border:3px dashed var(--ink);border-radius:14px;background:var(--card);font-family:var(--learn);font-size:44px;font-weight:700;display:grid;place-items:center}
.slot.full{border-style:solid;background:var(--sun-l)}
.slot.lock{background:var(--teal-l)}
.slots.ok .slot{background:var(--good-l);border-color:var(--good)}
.slots.no{animation:shake .4s}
.tileL{width:68px;height:68px;border:3px solid var(--ink);border-radius:14px;background:var(--tangerine);font-family:var(--learn);font-size:40px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.tileL:disabled{visibility:hidden}

/* color game */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;width:100%;text-align:start}
.canvas{padding:12px}
.canvas svg{width:100%;height:auto;display:block;max-height:62vh}
.paint [data-part]{cursor:pointer;transition:fill .25s}
.paint [data-part]:hover{filter:brightness(.93)}
.paint [data-part].hint{animation:partpulse 1s infinite}
@keyframes partpulse{50%{stroke:var(--sun);stroke-width:9px}}
.side{display:grid;gap:16px}
.instr{padding:18px 20px;display:grid;gap:10px}
.instr .step{font-size:15px;color:var(--ink-soft);font-weight:700}
.instr .sentence{font-family:var(--learn);font-size:34px;font-weight:700;line-height:1.2;margin:0;direction:ltr;text-align:left}
.instr .arhint{margin:0;font-size:18px;color:var(--grape);font-weight:700}
.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.swb{aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--c);transition:transform .1s}
.swb:hover{transform:scale(1.08)}
.swb[aria-pressed="true"]{box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink);transform:scale(1.08)}
.swb.hint{animation:pulse 1s infinite}
.cfeed{min-height:56px;font-size:19px;font-weight:700;margin:0}
.cfeed .en{font-size:22px}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:760px}
.mcard{aspect-ratio:4/5;border:0;padding:0;background:none;perspective:800px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .back{background:var(--grape);background-image:radial-gradient(rgba(255,255,255,.28) 6px,transparent 7px);background-size:30px 30px}
.mcard .back svg{width:44%;height:auto}
.mcard .front{background:var(--card);transform:rotateY(180deg)}
.mcard .front .en{font-size:clamp(24px,3.6vw,36px);font-weight:700}
.mcard .front .emo{font-size:clamp(46px,7vw,70px)}
.mcard .front .sw{width:55%}
.mcard.done .front{background:var(--good-l);border-color:var(--good)}

/* finish */
.done-wrap{display:grid;justify-items:center;gap:10px;text-align:center}
.done-wrap svg.cat{width:min(260px,70vw);height:auto}
.done-wrap h2{margin:0;font-family:var(--learn);font-size:56px;line-height:1.1}
.done-wrap p{margin:0;font-size:20px}

/* fx + toast */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px 22px;font-weight:700;font-size:18px;max-width:calc(100% - 32px);text-align:center}
.bounce{animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.hero-cat .cat{animation:bounce 3s ease-in-out infinite}

/* reading corner */
.t-read{background:var(--tangerine-l);grid-column:1/-1}
.hub{display:grid;gap:12px}
.hub .g-head{justify-items:start;text-align:start}
.hub .sec-title{margin:22px 0 0}
.hub > .muted{margin:0;max-width:65ch}
.read-count{display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:19px;background:var(--sun-l)}
.read-count svg{width:56px;height:56px;flex:none}
.read-count b{font-size:30px;font-variant-numeric:tabular-nums}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fam,.story-card{border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px;display:grid;justify-items:center;gap:2px;transition:transform .1s}
.fam:hover,.story-card:hover{transform:translateY(-3px)}
.fam .rimebig{font-size:34px;font-weight:700;color:var(--grape);line-height:1.2}
.fam .emos{font-size:24px;letter-spacing:2px}
.fam small,.story-card small{font-size:14px;color:var(--ink-soft);font-weight:700}
.fam.next{background:var(--tangerine-l);box-shadow:4px 4px 0 var(--ink)}
.fam.done,.story-card.done{background:var(--good-l)}
.fam.done small,.story-card.done small{color:var(--good)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.story-card .emos{font-size:40px;letter-spacing:4px}
.story-card .en{font-size:20px;font-weight:700}
.bigword .onset{color:var(--ink)}
.bigword .rime{color:var(--grape);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.opts.opts3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:620px}
.opt .txt{font-size:clamp(22px,4vw,34px);font-weight:700}
.storybox{padding:20px 26px;display:grid;gap:12px;width:100%;max-width:760px}
.storybox .scene{font-size:56px;letter-spacing:8px;text-align:center;line-height:1.2}
.story{text-align:left}
.story p{margin:0;font-size:30px;line-height:1.65}
.wtok{border:0;background:none;padding:0 3px;border-radius:8px;font:inherit;color:inherit;text-decoration:underline dotted var(--ink-soft) 2px;text-underline-offset:7px}
.wtok:hover{background:var(--sun-l)}
.qa{display:grid;gap:16px;justify-items:center;width:100%;scroll-margin-top:90px}
.qtext{font-size:32px;font-weight:700;margin:0}

.stars{cursor:pointer}
/* mall */
.mall-door{display:block;width:100%;margin-top:28px;padding:0;border:3px solid var(--ink);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;text-align:start;transition:transform .12s,box-shadow .12s}
.mall-door:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.awning{display:block;width:100%;height:44px}
.door-in{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 20px 18px}
.door-text{flex:1 1 260px;min-width:0;font-size:28px;font-weight:800;line-height:1.3}
.door-text .en{font-size:18px;color:var(--ink-soft)}
.door-text small{font-size:16px;font-weight:500;color:var(--ink-soft)}
.door-items{display:flex;gap:8px;flex-wrap:wrap}
.mini{width:60px;height:60px;border:2px solid var(--ink);border-radius:14px;background:var(--grape-l);display:grid;place-items:center;padding:6px}
.mini svg{width:100%;height:100%}
.mall{display:grid;gap:18px}
.mall-sign{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.sign-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:6px 20px 14px}
.sign-in h2{margin:0;font-size:32px;line-height:1.2}
.sign-in h2 .en{font-size:20px;color:var(--ink-soft)}
.wallet{font-size:20px}
.mall-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
.fitting{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);padding:14px;display:grid;gap:10px}
.fit-label{font-weight:800;font-size:16px;color:var(--ink-soft);text-align:center}
.fit-cat{border-radius:22px;background:var(--grape-l);padding:6px;border:2px dashed var(--grape)}
.fit-cat svg{width:100%;height:auto;display:block}
.fit-cat .tryon{animation:pop .4s}
.fit-info{display:grid;gap:8px;justify-items:center;text-align:center;min-height:120px;align-content:start}
.fit-info .muted{margin:0}
.fit-hint{margin:0;color:var(--ink-soft);font-size:17px}
.fit-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.fit-name .en{font-size:30px;font-weight:700}
.need{margin:0;color:var(--bad);font-weight:700}
.linkish{background:none;border:0;text-decoration:underline;color:var(--ink-soft);font-size:15px}
.shelves{display:grid;gap:14px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:3px solid var(--ink);border-radius:999px;background:var(--card);padding:5px 14px;font-weight:700;font-size:17px;display:inline-flex;gap:6px;align-items:baseline}
.tab .en{font-size:14px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--tangerine);box-shadow:3px 3px 0 var(--ink)}
.tab[aria-selected="true"] .en{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:22px 16px 16px;border:3px solid var(--ink);border-radius:var(--r);background:var(--sun-l)}
.item{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px 10px 10px;display:grid;justify-items:center;gap:2px;transition:transform .1s,box-shadow .1s}
.item:hover{transform:translateY(-3px)}
.item .thumb{width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:var(--paper);overflow:hidden;margin-bottom:4px}
.item .thumb svg{width:80%;height:80%}
.item .thumb.t-bg svg,.item .thumb.t-pattern svg{width:100%;height:100%}
.item .name{font-size:18px;font-weight:700;line-height:1.2}
.item small{font-size:14px;color:var(--ink-soft)}
.tag{position:absolute;top:-12px;inset-inline-start:-8px;z-index:1;transform:rotate(-8deg);background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.item.pricey .tag{background:var(--card);color:var(--ink-soft)}
.item.owned .tag{background:var(--good-l);color:var(--ink)}
.item.worn .tag{background:var(--good);color:#FFFFFF}
.item.sel{box-shadow:0 0 0 4px var(--grape);transform:translateY(-3px)}


/* school book */

/* ---------- speech ---------- */
let voice = null;
const hasTTS = 'speechSynthesis' in window;
function pickVoice(){
  if(!hasTTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const pref = ['Samantha','Google US English','Aria','Jenny','Zira','Karen','Google UK English Female','Female'];
  voice = vs.find(v => pref.some(p => v.name.includes(p))) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if(hasTTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(text, rate=0.82){
  if(!hasTTS || !S.sound) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if(voice) u.voice = voice; u.rate = rate; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- sound effects ---------- */
let ac = null;
function actx(){
  if(!S.sound) return null;
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, t0, dur, type='triangle', vol=.14){
  const c = actx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfxGood = () => { tone(660,0,.15); tone(880,.11,.17); tone(1320,.22,.28,'triangle',.09); };
const sfxBad  = () => { tone(330,0,.16,'sine',.12); tone(247,.14,.26,'sine',.12); };
const sfxTick = () => tone(990,0,.06,'square',.04);
function meow(){
  const c = actx(); if(!c) return;
  const t = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520,t); o.frequency.linearRampToValueAtTime(880,t+.16); o.frequency.linearRampToValueAtTime(560,t+.55);
  f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(1900,t+.16); f.frequency.linearRampToValueAtTime(900,t+.55);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.06); g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t+.65);
}

/* ---------- fx ---------- */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el){
  if(reduce || !el) return;
  const r = el.getBoundingClientRect(), fx = $('#fx');
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = rand(['⭐','🐾','✨','🎨','💛']);
    const a = Math.random()*Math.PI*2, d = 80 + Math.random()*90;
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.setProperty('--dx', Math.cos(a)*d+'px'); s.style.setProperty('--dy', Math.sin(a)*d+'px'); s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    fx.appendChild(s); setTimeout(() => s.remove(), 1050);
  }
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
}

if(!S.owned){
  const legacy = {flower:10, glasses:25, crown:45, wand:70}, w = store.get('wear', {});
  S.owned = Object.keys(legacy).filter(k => S.stars >= legacy[k]);

  save('owned'); save('equip');
}

function itemThumb(item){
  if(item.slot === 'pattern') return catSVG(DEFAULT_MISH, {pattern:item.id});
  if(item.slot === 'bg') return `<svg viewBox="0 0 300 330" aria-hidden="true">${item.draw()}</svg>`;
  return `<svg viewBox="${item.box}" aria-hidden="true"><g stroke="#2B2233" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">${item.draw()}</g></svg>`;
}

/* parse words: one entry per English word across the whole book */
const WORDS = {};
const LESSONS = {};
BOOK.forEach(u => u.lessons.forEach(l => {
  l.unit = u; LESSONS[l.id] = l;
  const parse = (str, imp) => str ? str.split(';').filter(Boolean).map(s => {
    const [en, ar, e] = s.split('|');
    const k = en.trim();
    if(!WORDS[k]) WORDS[k] = {en:k, ar:ar.trim(), e:(e||'').trim() || null, unit:u.id, lesson:l.id};
    else if(!WORDS[k].e && e) WORDS[k].e = e.trim();
    return k;
  }) : [];
  l.words = [...new Set([...parse(l.imp, true), ...parse(l.ext, false)])];
  l.verbs = l.v ? l.v.split(';').map(s => { const [b, p, ar] = s.split('|'); return {b, p, ar}; }) : [];
}));
const ALL_VERBS = [];
BOOK.forEach(u => u.lessons.forEach(l => l.verbs.forEach(v => { if(!ALL_VERBS.some(x => x.b === v.b)) ALL_VERBS.push(v); })));
const unitWordsWithPics = uid => {
  const seen = new Set(), out = [];
  BOOK.find(u => u.id === uid).lessons.forEach(l => l.words.forEach(k => {
    const w = WORDS[k]; if(w.e && !seen.has(w.e) && !seen.has(k)){ seen.add(w.e); seen.add(k); out.push(w); }
  }));
  return out;
};

/* ---------- word garden (spaced repetition) ---------- */
const DAY = 864e5;
const GAP = [0, 1, 2, 4, 7, 14];                 // days until next watering, by level
const STAGE = ['🌰','🌱','🌿','🌷','🌻','🌳'];
const STAGE_AR = ['بذرة','نبتة','زرعة','وردة','عباد شمس','شجرة'];
const lvl = k => (S.wl[k] ? S.wl[k].lv : 0);
const isDue = k => S.wl[k] && S.wl[k].due <= Date.now();
const dueWords = () => Object.keys(S.wl).filter(isDue);
function grow(k, ok){
  const w = S.wl[k] || {lv:0, due:0};
  if(ok){ w.lv = Math.min(5, w.lv + 1); w.due = Date.now() + GAP[w.lv] * DAY - 3600e3; }
  else { w.lv = 1; w.due = Date.now() + 6 * 3600e3; }
  S.wl[k] = w; save('wl');
}
const wordPic = w => w.e ? `<span class="emo" aria-hidden="true">${w.e}</span>` : `<span class="wpic-ar">${w.ar}</span>`;
function distract(k, n, field, pool){
  const base = pool && pool.length > n + 1 ? pool : Object.keys(WORDS);
  const used = new Set([WORDS[k][field]]);
  const out = [];
  for(const x of shuffle(base)){ const v = WORDS[x][field]; if(x !== k && !used.has(v)){ used.add(v); out.push(x); } if(out.length >= n) break; }
  return out;
}

function miniCat(x, y, w){
  const look = {...S.equip}; delete look.bg;
  return catSVG(S.mish, look).replace('<svg class="cat ', `<svg x="${x}" y="${y}" width="${w}" height="${(w*1.1).toFixed(1)}" class="cat `);
}
function boxSVG(x, y, w, h, open){
  return `<g stroke="#2B2233" stroke-width="3" stroke-linejoin="round">
    ${open ? `<path d="M${x} ${y} L${x-16} ${y-24} L${x+w*0.46} ${y-24} L${x+w*0.5} ${y} Z" fill="#E9B872"/><path d="M${x+w} ${y} L${x+w+16} ${y-24} L${x+w*0.54} ${y-24} L${x+w*0.5} ${y} Z" fill="#E9B872"/>` : ''}
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#D9A15B"/>
    ${open ? '' : `<rect x="${x+w/2-10}" y="${y}" width="20" height="${(h*0.4).toFixed(0)}" fill="#F3D9A8" stroke="none"/><path d="M${x} ${y} L${x+w} ${y}"/>`}
  </g>`;
}
function scene(p){
  const ground = '<path d="M0 213 H340" stroke="#2B2233" stroke-width="3"/>';
  let inner;
  if(p === 'in') inner = `<g stroke="#2B2233" stroke-width="3" stroke-linejoin="round"><path d="M110 122 L94 98 L165 98 L170 122 Z" fill="#E9B872"/><path d="M230 122 L246 98 L175 98 L170 122 Z" fill="#E9B872"/></g>${miniCat(125,42,90)}<rect x="110" y="122" width="120" height="90" rx="3" fill="#D9A15B" stroke="#2B2233" stroke-width="3"/>`;
  else if(p === 'on') inner = `${boxSVG(110,122,120,90,false)}${miniCat(125,26,90)}`;
  else if(p === 'behind') inner = `${miniCat(150,46,96)}${boxSVG(110,122,120,90,false)}`;
  else if(p === 'in front of') inner = `${boxSVG(110,100,120,90,false)}${miniCat(122,108,96)}`;
  else if(p === 'next to') inner = `${boxSVG(50,122,120,90,false)}${miniCat(196,108,96)}`;
  else inner = `${boxSVG(14,122,100,90,false)}${boxSVG(226,122,100,90,false)}${miniCat(122,108,96)}`;
  return `<svg class="scene" viewBox="0 0 340 222" role="img" aria-label="Mishmish is ${p} the box">${ground}${inner}</svg>`;
}

function writeRun(wid, back){
  setTop(true);
  const W = WRITING[wid];
  const tokLine = s => s.split(' ').map(w => `<button class="wtok" data-say="${esc(w.replace(/[^A-Za-z':0-9.]/g,''))}">${esc(w)}</button>`).join(' ');
  function model(){
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>ورشة الكتابة <span class="en" style="font-size:20px;color:var(--ink-soft)">${W.en}</span></h2>
        <p class="ask">الأول اقري الموضوع ده من كتابك. دوسي على أي كلمة تسمعيها.</p></div>
      <div class="storybox sticker paper">
        <h3 class="en paper-title">${W.model.title}</h3>
        <div class="story en" lang="en">${W.model.text.map(l => `<p>${tokLine(l)}</p>`).join('')}</div>
        <div class="row" style="justify-content:center">${sayBtn(W.model.text.join(' '), 'اسمعي الموضوع كله')}</div>
      </div>
      <button class="btn primary" id="go">قريته! يلا نتعلم أجزاءه</button>
    </section>`;
    $('#go').onclick = parts;
  }
  function parts(){
    const results = []; let i = 0;
    (function next(){
      if(i >= W.parts.length) return builder();
      const head = gameHead('أجزاء الموضوع', W.type, 'اختاري الإجابة الصح', i, W.parts.length, results);
      choose(W.parts[i], head, ok => { results[i] = ok; if(ok) addStars(1); setTimeout(() => { i++; next(); }, 1500); });
    })();
  }
  function builder(){
    const vars = {NAME: S.name || 'Mishmish', DATE: todayStr()};
    const lines = []; let si = 0;
    const fill = s => s.replace(/\{(\w+)\}/g, (m, k) => k === 'p' ? (vars.P || 'he').toLowerCase() : (vars[k] != null ? vars[k] : `<span class="slot-q">...</span>`));
    function step(){
      if(si >= W.steps.length) return final();
      const st = W.steps[si];
      const need = Object.keys(st.v || {}).filter(k => vars[k] == null);
      if(st.auto || (!need.length && !st.pick)){ lines[si] = fill(st.s); si++; return step(); }
      let picks = {};
      const optsFor = k => { const x = st.v[k]; return Array.isArray(x) ? x : (x.map[vars[x.by]] || Object.values(x.map).flat()); };
      function render(){
        const tmp = {...vars, ...picks};
        const preview = st.s.replace(/\{(\w+)\}/g, (m, k) => k === 'p' ? (tmp.P || '...').toLowerCase() : (tmp[k] != null ? `<b class="hl">${esc(tmp[k])}</b>` : `<span class="slot-q">...</span>`));
        const done = need.every(k => picks[k] != null);
        screenEl.innerHTML = `<section class="stage">
          <div class="g-head"><h2>اكتبي مع مشمش <span class="en" style="font-size:20px;color:var(--ink-soft)">${W.en}</span></h2>
            <p class="ask">${st.h}: اختاري من الكلمات وكوّني الجملة</p>
            <div class="dots">${W.steps.map((_,k) => `<i class="${k < si ? 'done' : k === si ? 'now' : ''}"></i>`).join('')}</div></div>
          <div class="draft sticker paper" dir="ltr">${lines.filter(Boolean).map(l => `<p class="en">${l}</p>`).join('')}<p class="en now-line">${preview}</p></div>
          ${need.map(k => `<div class="slot-row"><div class="chips" dir="ltr">${optsFor(k).map(c => `<button class="chip ${picks[k] === c ? 'on' : ''}" data-slot="${k}" data-val="${esc(c)}" aria-pressed="${picks[k] === c}"><span class="en" style="color:inherit;font-size:18px">${esc(c)}</span></button>`).join('')}</div></div>`).join('')}
          <div class="row" style="justify-content:center"><button class="btn primary" id="ok" ${done ? '' : 'disabled'}>${si < W.steps.length - 1 ? 'الجملة اللي بعدها' : 'خلّصت!'}</button></div>
        </section>`;
        screenEl.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { picks[b.dataset.slot] = b.dataset.val; say(b.dataset.val); render(); });
        $('#ok').onclick = () => { Object.assign(vars, picks); lines[si] = st.pick ? '' : fill(st.s); if(!st.pick) say(lines[si].replace(/<[^>]+>/g,'')); si++; step(); };
      }
      render();
    }
    step();
    function final(){
      const title = W.steps[0].title ? lines[0] : W.titleT ? fill(W.titleT) : W.en;
      const body = lines.filter((l, k) => l && !(W.steps[0].title && k === 0));
      const text = body.join(' ').replace(/<[^>]+>/g, '');
      const words = text.split(/\s+/).filter(x => /[A-Za-z0-9]/.test(x)).length;
      const checks = W.check.map(c => { const cc = c.replace('{DATE}', vars.DATE); return [c.replace('{DATE}', 'the date'), text.includes(cc) || title.includes(cc)]; });
      screenEl.innerHTML = `<section class="stage">
        <div class="g-head"><h2>موضوعك جاهز! <span class="en" style="font-size:20px;color:var(--ink-soft)">Well done</span></h2>
          <p class="ask">اقريه بصوت عالي، وبعدين اسمعي مشمش وهي بتقراه</p></div>
        <div class="storybox sticker paper" dir="ltr">
          <h3 class="en paper-title">${esc(title)}</h3>
          <div class="story en">${body.map(l => `<p>${l}</p>`).join('')}</div>
        </div>
        <div class="wcheck sticker">
          <span class="pill ${words >= W.target ? 'ok' : ''}">${words} كلمة ${words >= W.target ? '✔' : `· الامتحان بيطلب ${W.target}`}</span>
          ${checks.map(([c, ok]) => `<span class="pill ${ok ? 'ok' : ''}">${ok ? '✔' : '○'} <span class="en">${esc(c)}</span></span>`).join('')}
        </div>
        <div class="row" style="justify-content:center">
          ${sayBtn(title + '. ' + text, 'اسمعي موضوعك')}
          <button class="btn primary" id="saveW">احفظيه في كتاباتي</button>
          <button class="btn" id="again">اكتبي تاني</button>
        </div>
      </section>`;
      $('#again').onclick = () => writeRun(wid, back);
      $('#saveW').onclick = () => {
        const first = !S.wDone[wid];
        S.writings.unshift({wid, title, text, date: vars.DATE}); S.writings = S.writings.slice(0, 20); save('writings');
        S.wDone[wid] = true; save('wDone');
        addStars(first ? 5 : 2); meow(); burst($('.paper'));
        $('#saveW').disabled = true; $('#saveW').textContent = `اتحفظ! (+${first ? 5 : 2} ⭐)`;
        setTimeout(back, 1800);
      };
    }
  }
  model();
}

function gameHead(title, en, ask, i, n, results){
  return `<div class="g-head"><h2>${title} <span class="en" style="font-size:20px;color:var(--ink-soft)">${en}</span></h2>
    ${ask ? `<p class="ask">${ask}</p>` : ''}
    <div class="dots" aria-label="سؤال ${i+1} من ${n}">${Array.from({length:n}, (_,k) => `<i class="${k<i ? (results[k] ? 'done' : 'miss') : k===i ? 'now' : ''}"></i>`).join('')}</div></div>`;
}

/* ============ LISTEN & FIND ============ */
function gameListen(){
  setTop(true);
  const pool = topicWords();
  const qs = shuffle(pool).slice(0, Math.min(8, pool.length));
  const results = []; let i = 0;
  function q(){
    if(i >= qs.length) return finish('listen', `جاوبتي صح من أول مرة ${results.filter(Boolean).length} من ${qs.length}`);
    const w = qs[i], mode = i % 2 === 0 ? 'listen' : 'read';
    let tries = 0, done = false;
    const same = shuffle(pool.filter(x => x.en !== w.en && x.e !== w.e));
    const others = same.length >= 3 ? same : shuffle(VOCAB.filter(x => x.en !== w.en));
    const opts = shuffle([w, ...others.slice(0,3)]);
    screenEl.innerHTML = `<section class="stage">
      ${gameHead('اسمعي واختاري','Listen & Find', mode==='listen' ? 'اسمعي الكلمة واختاري الصورة الصح' : 'اقري الكلمة واختاري الصورة الصح', i, qs.length, results)}
      <div class="qcard sticker">${mode === 'listen'

/* ============ SPELL IT ============ */
function gameSpell(){
  setTop(true);
  const ok = w => /^[a-z]{3,6}$/.test(w.en);
  let pool = topicWords().filter(ok);
  if(pool.length < 4) pool = VOCAB.filter(ok);
  const words = shuffle(pool).slice(0, 6), results = []; let i = 0;
  function round(){
    if(i >= words.length) return finish('spell', `كتبتي ${results.filter(Boolean).length} كلمات من غير مساعدة`);
    const w = words[i], L = w.en.split('');
    let tiles;
    for(let n=0;n<6;n++){ tiles = shuffle(L.map(ch => ({ch, used:false}))); if(tiles.map(t=>t.ch).join('') !== w.en) break; }
    const slots = Array(L.length).fill(null), locked = new Set();
    let helped = false, missed = false, finished = false;
    function render(state=''){
      screenEl.innerHTML = `<section class="stage">
        ${gameHead('رتّبي الحروف','Spell it','دوسي على الحروف بالترتيب عشان تكتبي الكلمة', i, words.length, results)}
        <div class="qcard sticker"><div class="pic-big">${pic(w)}</div><div class="row" style="justify-content:center">${sayBtn(w.en)}<span class="muted">${w.ar}</span></div></div>
        <div class="slots ${state}" id="slots">${slots.map((t,k) => `<button class="slot ${t!=null?'full':''} ${locked.has(k)?'lock':''}" data-s="${k}" aria-label="خانة ${k+1}">${t!=null ? tiles[t].ch : ''}</button>`).join('')}</div>
        <div class="letters">${tiles.map((t,k) => `<button class="tileL" data-t="${k}" ${t.used || finished ? 'disabled' : ''}>${t.ch}</button>`).join('')}</div>
        <div class="row" style="justify-content:center"><button class="btn soft" id="hint" ${finished?'disabled':''}>💡 ساعديني بحرف</button></div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </section>`;
      screenEl.querySelectorAll('.tileL').forEach(b => b.onclick = () => place(+b.dataset.t));
      screenEl.querySelectorAll('.slot').forEach(b => b.onclick = () => unplace(+b.dataset.s));
      $('#hint').onclick = hint;
    }
    function place(t){
      if(finished) return;
      const k = slots.indexOf(null); if(k < 0) return;
      slots[k] = t; tiles[t].used = true; sfxTick(); render();
      if(!slots.includes(null)) check();
    }
    function unplace(k){
      if(finished || slots[k] == null || locked.has(k)) return;
      tiles[slots[k]].used = false; slots[k] = null; render();
    }
    function check(){
      const word = slots.map(t => tiles[t].ch).join('');
      if(word === w.en){
        finished = true; results[i] = !helped; if(!helped && !missed) addStars(2); else addStars(1);
        render('ok'); sfxGood(); burst($('#slots'));
        say(`${w.en}! ${rand(PRAISE)}`);
        $('#fb').className = 'feedback good'; $('#fb').innerHTML = `<span class="en">${w.en}</span><span>${rand(['برافو!','شاطرة!','جامدة!'])}</span>`;
        setTimeout(() => { i++; round(); }, 1900);
      } else {
        missed = true; markTricky(w); sfxBad(); render('no');
        $('#fb').className = 'feedback bad'; $('#fb').textContent = 'قربتي! الحروف الصح هتفضل مكانها، جربي تاني.';
        setTimeout(() => {
          slots.forEach((t,k) => { if(t != null && tiles[t].ch !== L[k]){ tiles[t].used = false; slots[k] = null; } });
          render(); $('#fb').className = 'feedback bad'; $('#fb').textContent = 'قربتي! الحروف الصح هتفضل مكانها، جربي تاني.';
        }, 650);
      }
    }
    function hint(){
      if(finished) return;
      helped = true;
      const p = slots.findIndex((t,k) => t == null || tiles[t].ch !== L[k]);
      if(p < 0) return;
      if(slots[p] != null){ tiles[slots[p]].used = false; slots[p] = null; }
      let t = tiles.findIndex(x => !x.used && x.ch === L[p]);
      if(t < 0){
        const k = slots.findIndex((s,kk) => s != null && !locked.has(kk) && tiles[s].ch === L[p]);
        t = slots[k]; slots[k] = null;
      }
      slots[p] = t; tiles[t].used = true; locked.add(p); sfxTick(); render();
      if(!slots.includes(null)) check();
    }
    render(); setTimeout(() => say(w.en), 300);
  }
  round();
}

/* ============ COLOR MISHMISH ============ */
function gameColor(){
  setTop(true);
  const palette = COLORS;
  const partIds = shuffle(Object.keys(PARTS)).slice(0, 6);
  const cols = shuffle(palette.filter(c => c.en !== 'white'));
  const steps = partIds.map((p,k) => ({part:p, color:cols[k % cols.length]}));
  const fills = {};
  let s = 0, sel = null, miss = 0, free = false;
  const sentence = st => `Color the ${PARTS[st.part].en} ${st.color.en}.`;

  screenEl.innerHTML = `<section class="stage">
    <div id="chead"></div>
    <div class="cgrid">
      <div class="canvas sticker paint" id="canvas">${catSVG(fills)}</div>
      <div class="side">
        <div class="instr sticker" id="instr"></div>
        <div class="sticker" style="padding:16px">
          <div class="palette" id="pal">${palette.map(c => `<button class="swb" style="--c:${c.sw}" data-c="${c.en}" aria-pressed="false" aria-label="${c.en}"></button>`).join('')}</div>
        </div>
        <p class="cfeed" id="cfb" aria-live="polite"></p>
        <div class="row" id="cact"></div>
      </div>
    </div>
  </section>`;

  function head(){
    $('#chead').innerHTML = free
      ? `<div class="g-head"><h2>لوّني براحتك <span class="en" style="font-size:20px;color:var(--ink-soft)">Free painting</span></h2><p class="ask">خلصتي الجمل! كمّلي تلوين مشمش زي ما تحبي.</p></div>`
      : gameHead('لوّني مشمش','Color Mishmish','اقري الجملة، اختاري اللون، ودوسي على الجزء الصح', s, steps.length, steps.map(()=>true));
  }
  function instr(){
    if(free){
      $('#instr').innerHTML = `<span class="step">Free painting</span><p class="sentence">Now paint Mishmish your way!</p>${sayBtn('Now paint Mishmish your way!')}`;
      $('#cact').innerHTML = `<button class="btn primary" id="saveArt">احفظي في المعرض</button><button class="btn" id="newArt">رسمة جديدة</button>`;
      $('#saveArt').onclick = () => {
        S.gallery.unshift({...fills}); S.gallery = S.gallery.slice(0, 12); save('gallery');
        addStars(2); meow(); burst($('#canvas'));
        $('#cact').innerHTML = `<span>اتحفظت في المعرض! (+2 ⭐)</span><button class="btn" id="newArt2">رسمة جديدة</button><button class="btn" id="goHome2">الرئيسية</button>`;
        $('#newArt2').onclick = gameColor; $('#goHome2').onclick = () => home();
      };
      $('#newArt').onclick = gameColor;
      return;
    }
    const st = steps[s];
    $('#instr').innerHTML = `<span class="step">Step ${s+1} of ${steps.length}</span>
      <p class="sentence" lang="en">${sentence(st)}</p>
      <div class="row">${sayBtn(sentence(st))}</div>
      ${miss >= 2 ? `<p class="arhint">مساعدة: لوّني ${PARTS[st.part].ar} باللون ال${st.color.ar}</p>` : ''}`;
  }
  function clearHints(){ screenEl.querySelectorAll('.hint').forEach(x => x.classList.remove('hint')); }
  function showHints(){
    const st = steps[s];
    screenEl.querySelectorAll(`#canvas [data-part="${st.part}"]`).forEach(x => x.classList.add('hint'));
    screenEl.querySelector(`.swb[data-c="${st.color.en}"]`).classList.add('hint');
  }
  function paint(part, c){
    fills[part] = c.sw;
    screenEl.querySelectorAll(`#canvas [data-part="${part}"]`).forEach(x => x.setAttribute('fill', c.sw));
  }

  $('#pal').onclick = e => {
    const b = e.target.closest('.swb'); if(!b) return;
    sel = palette.find(c => c.en === b.dataset.c);
    screenEl.querySelectorAll('.swb').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    say(sel.en);
  };
  $('#canvas').onclick = e => {
    const el = e.target.closest('[data-part]'); if(!el) return;
    const part = el.dataset.part, fb = $('#cfb');
    if(!sel){ fb.style.color = 'var(--grape)'; fb.textContent = 'اختاري لون الأول من الألوان 🎨'; say(PARTS[part].en); return; }
    if(free){ paint(part, sel); sfxTick(); say(`${sel.en} ${PARTS[part].en}`); return; }
    const st = steps[s];
    if(part === st.part && sel.en === st.color.en){
      paint(part, sel); clearHints(); sfxGood(); burst(el);
      addStars(miss < 2 ? 1 : 0); say(rand(PRAISE));
      fb.style.color = 'var(--good)'; fb.innerHTML = `<span class="en">${st.color.en} ${PARTS[st.part].en}</span> ✔`;
      s++; miss = 0;
      if(s >= steps.length){ free = true; meow(); }
      head(); setTimeout(() => { instr(); if(!free) say(sentence(steps[s])); else say('Now paint Mishmish your way!'); }, 900);
    } else {
      miss++; sfxBad(); fb.style.color = 'var(--bad)';
      if(part !== st.part){
        fb.innerHTML = `ده <span class="en">${PARTS[part].en}</span>. دوّري على <span class="en">${PARTS[st.part].en}</span>`;
        say(`This is the ${PARTS[part].en}. Find the ${PARTS[st.part].en}.`);
      } else {
        fb.innerHTML = `اللون ده <span class="en">${sel.en}</span>. محتاجين <span class="en">${st.color.en}</span>`;
        say(`This is ${sel.en}. We need ${st.color.en}.`);
        const cw = VOCAB.find(v => v.en === st.color.en); if(cw) markTricky(cw);
      }
      if(miss >= 2){ instr(); showHints(); }
    }
  };
  head(); instr(); setTimeout(() => say(sentence(steps[0])), 300);
}

function gameMemory(){
  setTop(true);

  const ws = shuffle(pool).slice(0, 6);

  let first = null, lock = false, moves = 0, pairs = 0;
  screenEl.innerHTML = `<section class="stage">

    c.open = true; c.el = b; b.classList.add('open'); say(c.w.en);
    if(!first){ first = c; return; }
    moves++; $('#moves').textContent = moves;
    if(first.w.en === c.w.en){
      first.done = c.done = true; first.el.classList.add('done'); b.classList.add('done');
      pairs++; $('#pairs').textContent = pairs; addStars(1); sfxGood(); burst(b);
      first = null;
      if(pairs === ws.length) setTimeout(() => finish('memory', `خلصتي في ${moves} محاولة`), 1100);
    } else {
      lock = true; const a = first; first = null;
      setTimeout(() => { a.open = c.open = false; a.el.classList.remove('open'); b.classList.remove('open'); lock = false; }, 1100);
    }
  });
}

      const k = +b.dataset.k;
      if(k === Q.a){
        done = true; b.classList.add('right'); sfxGood(); burst(b);
        if(tries === 0){ firstTry++; addStars(1); }
        say(`${Q.o[k].en}! ${rand(PRAISE)}`);
        fb.className = 'feedback good'; fb.innerHTML = `<span class="en">${Q.o[k].en}</span><span>${rand(['برافو!','شاطرة!','صح كده!'])}</span>`;
        qi++; setTimeout(q, 1700);
      } else {
        tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad();
        fb.className = 'feedback bad'; fb.textContent = 'ارجعي اقري القصة تاني وجربي 👀';
        if(tries >= 2) $('#qa').querySelector(`.opt[data-k="${Q.a}"]`).classList.add('hint');
      }
    });
  }
}

/* ---------- learn: meet → match → recall ---------- */
function learnSession(keys, pool, back){
  setTop(true);
  let i = 0;
  function meet(){
    if(i >= keys.length) return match();
    const w = WORDS[keys[i]];
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>اتعرّفي على الكلمة <span class="en" style="font-size:20px;color:var(--ink-soft)">Meet</span></h2>
        <p class="ask">اسمعي الكلمة وقوليها بصوت عالي ٣ مرات</p>
        <div class="dots">${keys.map((_,k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="flash sticker">
        ${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}
        <p class="bigword" lang="en">${w.en}</p>
        <p class="flash-ar">${w.ar}</p>
        ${sayBtn(w.en)}
      </div>
      <button class="btn primary" id="nx">${i < keys.length - 1 ? 'الكلمة اللي بعدها' : 'يلا نطابق!'}</button>
    </section>`;
    setTimeout(() => say(w.en, .75), 250);
    $('#nx').onclick = () => { i++; meet(); };
  }
  function match(){
    let selEn = null, left = keys.length;
    const ar = shuffle(keys), en = shuffle(keys);
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>طابقي <span class="en" style="font-size:20px;color:var(--ink-soft)">Match</span></h2>
        <p class="ask">دوسي على الكلمة الإنجليزي وبعدين على معناها</p></div>
      <div class="match">
        <div class="mcol" dir="ltr">${en.map(k => `<button class="mbtn en" data-en="${esc(k)}">${WORDS[k].en}</button>`).join('')}</div>
        <div class="mcol">${ar.map(k => `<button class="mbtn" data-ar="${esc(k)}">${WORDS[k].ar}</button>`).join('')}</div>
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>`;
    screenEl.querySelectorAll('[data-en]').forEach(b => b.onclick = () => {
      if(b.classList.contains('ok')) return;
      screenEl.querySelectorAll('[data-en]').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); selEn = b.dataset.en; say(WORDS[selEn].en);
    });
    screenEl.querySelectorAll('[data-ar]').forEach(b => b.onclick = () => {
      if(b.classList.contains('ok')) return;
      if(!selEn){ $('#fb').className = 'feedback'; $('#fb').textContent = 'اختاري الكلمة الإنجليزي الأول'; return; }
      const eb = screenEl.querySelector(`[data-en="${CSS.escape(selEn)}"]`);
      if(b.dataset.ar === selEn){
        b.classList.add('ok'); eb.classList.add('ok'); eb.classList.remove('sel'); sfxGood(); selEn = null; left--;
        if(!left){ burst($('.match')); setTimeout(recall, 900); }
      } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad(); }
    });
  }
  function recall(){
    const queue = shuffle(keys), firstTry = {};
    let n = 0;
    function q(){
      if(!queue.length){
        keys.forEach(k => { if(!S.wl[k]) grow(k, true); });
        addStars(keys.length);
        return finish(() => learnSession(keys, pool, back), `زرعتي ${keys.length} كلمات جديدة في الحديقة 🌱`, back, 'ارجعي للدرس');
      }
      const k = queue[0], w = WORDS[k];
      const opts = shuffle([k, ...distract(k, 3, 'en', pool)]);
      let tries = 0, done = false;
      screenEl.innerHTML = `<section class="stage">
        <div class="g-head"><h2>افتكري <span class="en" style="font-size:20px;color:var(--ink-soft)">Remember</span></h2>
          <p class="ask">إيه الكلمة الإنجليزي اللي معناها كده؟</p></div>
        <div class="qcard sticker">${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}<p class="flash-ar">${w.ar}</p></div>
        <div class="opts words">${opts.map(o => `<button class="opt wopt en" data-k="${esc(o)}">${WORDS[o].en}</button>`).join('')}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </section>`;
      screenEl.querySelectorAll('.wopt').forEach(b => b.onclick = () => {
        if(done) return;
        if(b.dataset.k === k){
          done = true; b.classList.add('right'); sfxGood(); say(w.en); queue.shift(); n++;
          $('#fb').className = 'feedback good'; $('#fb').innerHTML = `<span class="en">${w.en}</span><span>${w.ar}</span>`;
          setTimeout(q, 1300);
        } else {
          tries++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfxBad(); markTricky(w);
          if(tries === 1){ queue.push(queue.shift()); queue.unshift(k); }
          $('#fb').className = 'feedback bad'; $('#fb').innerHTML = `دي <span class="en">${WORDS[b.dataset.k].en}</span> = ${WORDS[b.dataset.k].ar}. جربي تاني`;
          if(tries >= 2) screenEl.querySelector(`.wopt[data-k="${CSS.escape(k)}"]`).classList.add('hint');
        }
      });
    }
    q();
  }
  meet();
}

/* ---------- review / watering ---------- */
function review(keys, pool, back, backLabel){
  setTop(true);
  if(!keys.length){ return back(); }
  const queue = [...keys], results = {}; let n = 0;
  function q(){
    if(!queue.length){
      const ok = Object.values(results).filter(Boolean).length;
      return finish(() => review(shuffle(keys), pool, back, backLabel), `سقيتي ${keys.length} كلمات، و${ok} منهم كبروا 🌷`, back, backLabel === 'garden' ? 'الحديقة' : 'ارجعي للدرس');
    }
    const k = queue.shift(), w = WORDS[k];
    const enToAr = Math.random() < .5;
    const opts = shuffle([k, ...distract(k, 3, enToAr ? 'ar' : 'en', pool)]);
    let done = false;
    screenEl.innerHTML = `<section class="stage">
      <div class="g-head"><h2>اسقي الكلمة <span class="en" style="font-size:20px;color:var(--ink-soft)">Water</span></h2>
        <p class="ask">${enToAr ? 'معنى الكلمة دي إيه؟' : 'إيه الكلمة الإنجليزي؟'}</p>
        <div class="dots">${keys.map((_,j) => `<i class="${j < n ? 'done' : j === n ? 'now' : ''}"></i>`).join('')}</div></div>
      <div class="qcard sticker water-card"><span class="plant" id="plant">${STAGE[lvl(k)]}</span>
        ${enToAr ? `<p class="bigword" lang="en">${w.en}</p>${sayBtn(w.en)}` : `${w.e ? `<span class="emo big" aria-hidden="true">${w.e}</span>` : ''}<p class="flash-ar">${w.ar}</p>`}</div>
      <div class="opts words">${opts.map(o => `<button class="opt wopt ${enToAr ? '' : 'en'}" data-k="${esc(o)}">${enToAr ? WORDS[o].ar : WORDS[o].en}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>`;
    if(enToAr) setTimeout(() => say(w.en, .8), 250);
    screenEl.querySelectorAll('.wopt').forEach(b => b.onclick = () => {
      if(done) return; done = true; n++;
      const ok = b.dataset.k === k;
      results[k] = ok; grow(k, ok);
      if(ok){ b.classList.add('right'); sfxGood(); addStars(1); $('#plant').textContent = STAGE[lvl(k)]; $('#plant').classList.add('grew'); burst($('#plant')); }
      else {
        b.classList.add('wrong'); sfxBad(); markTricky(w);
        screenEl.querySelector(`.wopt[data-k="${CSS.escape(k)}"]`).classList.add('right');
        $('#plant').textContent = STAGE[1];
      }
      say(w.en);
      $('#fb').className = `feedback ${ok ? 'good' : 'bad'}`;
      $('#fb').innerHTML = `<span class="en">${w.en}</span><span>${w.ar}${ok ? ` · كبرت وبقت ${STAGE_AR[lvl(k)]}` : ' · هنرجعلها تاني قريب'}</span>`;
      setTimeout(q, ok ? 1500 : 2300);
    });
  }
  q();
}

/* ---------- past tense challenge ---------- */
function verbQuiz(l, back){
  setTop(true);
  const vs = shuffle(l.verbs), results = []; let i = 0;
  function q(){
    if(i >= vs.length){
      S.vDone[l.id] = true; save('vDone');
      return finish(() => verbQuiz(l, back), `عرفتي ماضي ${results.filter(Boolean).length} من ${vs.length} أفعال من أول مرة`, back, 'ارجعي للدرس');
    }
    const v = vs[i];
    const set = new Set([v.p]);
    const cand = [v.b.split(' ')[0].replace(/e$/, '') + 'ed' + (v.b.includes(' ') ? ' ' + v.b.split(' ').slice(1).join(' ') : ''), v.b, ...shuffle(ALL_VERBS).map(x => x.p)];
    const opts = [v.p];
    for(const c of cand){ if(!set.has(c)){ set.add(c); opts.push(c); } if(opts.length >= 3) break; }
    const sh = shuffle(opts); let tries = 0, done = false;
    screenEl.innerHTML = `<section class="stage">
      ${gameHead('تحدي الأفعال', 'Past Tense', 'إيه الماضي بتاع الفعل ده؟', i, vs.length, results)}

function grammarRun(gid, back){

      <div class="teach">

  }

    const qs = G.qs === 'PREP' ? prepQs() : G.qs;

      if(i >= qs.length){

      }

        <div class="ex-sec"><span class="ex-num">${si + 1}</span><span class="en">${esc(s.en)}</span><small>${s.ar}</small></div>
      </div>${ctxHTML(s)}`;
    const after = ok => { if(it.t !== 'w'){ if(ok){ score++; addStars(1); } else wrong.push(it); } };
    const nextBtn = () => { const nb = document.createElement('button'); nb.className = 'btn primary'; nb.id = 'exNext'; nb.textContent = i < flat.length - 1 ? 'السؤال اللي بعده' : 'شوفي النتيجة'; nb.onclick = () => { i++; next(); }; $('#exActions').appendChild(nb); nb.focus(); };
    if(it.t === 'c') exChoose(it, head, ok => { after(ok); nextBtn(); });
    else if(it.t === 'b') exBuild(it, head, ok => { after(ok); nextBtn(); });
    else if(it.t === 'p') exPunct(it, head, ok => { after(ok); nextBtn(); });
    else exWrite(it, head, () => nextBtn());
  }
  function result(){
    const pct = graded ? Math.round(score / graded * 100) : 100;
    const [g, ic] = gradeOf(pct);
    if(ex.isPassage){ S.pDone[ex.passageId] = Math.max(S.pDone[ex.passageId] || 0, pct); save('pDone'); }
    else { S.exams[ex.id] = Math.max(S.exams[ex.id] || 0, pct); save('exams'); }
    if(pct >= 90){ meow(); }
    setTimeout(() => say(pct >= 75 ? `Great job! You got ${score} out of ${graded}!` : `You got ${score} out of ${graded}. Let's practice more!`), 400);
    const ansOf = it => it.tf ? `${it.q} → ${it.a === 0 ? 'True' : 'False'}` : it.t === 'c' ? it.q.replace('___', it.o[it.a]).replace(/\s*\([^)]*\)\s*$/, '') : it.t === 'b' ? it.w.join(' ') : it.fixed;
    screenEl.innerHTML = `<section class="stage">
      <div class="result sticker">
        <span class="res-ic">${ic}</span>
        <h2>${g}</h2>
        <p class="res-score"><b>${score}</b> / ${graded} · ${pct}%</p>
        <p class="muted">${esc(ex.title)} · كسبتي ⭐ ${roundStars}</p>
      </div>
      ${wrong.length ? `<div class="mistakes sticker"><h3>راجعي الأسئلة دي</h3>${wrong.map(it => `<button class="mis en" data-say="${esc(it.tf ? it.q : ansOf(it))}">✔ ${esc(ansOf(it))}</button>`).join('')}</div>` : '<p class="feedback good">ولا غلطة! برافو عليكي</p>'}
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="again">امتحني تاني</button>
        <button class="btn" id="hall">قاعة الامتحانات</button>
      </div>
    </section>`;
    burst($('.result'));
    $('#again').onclick = () => { roundStars = 0; examRun(ex.id === 'final' ? finalExam() : ex, back); };
    $('#hall').onclick = back;
  }
  next();
}
function exChoose(it, head, done){
  let idx = it.o.map((_, k) => k); if(it.shuf) idx = shuffle(idx);
  const L = 'abcdefgh';
  screenEl.innerHTML = `<section class="stage exam">${head}
    <div class="qcard sticker gq">${it.listen ? `<button class="speaker sm" id="lspk" aria-label="اسمعي">${SPK}</button>` : ''}${it.vis || ''}<p class="gsent en" lang="en">${esc(it.q).replace('___', '<span class="blank">?</span>')}</p></div>
    <div class="opts words ${it.tf ? 'n2 tfopts' : 'n' + idx.length}">${idx.map((k, j) => `<button class="opt wopt en exo" data-k="${k}"><span class="lt">${it.tf ? (k === 0 ? '✔' : '✘') : L[j]}</span> ${esc(it.o[k])}</button>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="exActions" style="justify-content:center"></div></section>`;
  let over = false;
  if(it.listen){ $('#lspk').onclick = () => say(it.listen, .75); setTimeout(() => say(it.listen, .75), 350); }
  screenEl.querySelectorAll('.exo').forEach(b => b.onclick = () => {
    if(over) return; over = true;
    const ok = +b.dataset.k === it.a;
    screenEl.querySelectorAll('.exo').forEach(x => x.disabled = true);
    screenEl.querySelector(`.exo[data-k="${it.a}"]`).classList.add('right');
    if(!ok){ b.classList.add('wrong'); sfxBad(); } else { sfxGood(); burst(b); }
    const blank = $('.blank'); if(blank && !it.tf){ blank.textContent = it.o[it.a]; blank.classList.add('filled'); }
    $('#fb').className = `feedback ${ok ? 'good' : 'bad'}`; $('#fb').textContent = ok ? rand(['صح!','برافو!','شاطرة!']) : `الإجابة الصح: ${it.tf ? (it.a === 0 ? 'True' : 'False') : it.o[it.a]}`;
    done(ok);
  });
}
function exBuild(it, head, done){
  let tiles; for(let n = 0; n < 6; n++){ tiles = shuffle(it.w.map((w, k) => ({w, k, used:false}))); if(tiles.map(t => t.k).join() !== it.w.map((_, k) => k).join()) break; }
  const line = []; let over = false;
  function render(state = ''){
    screenEl.innerHTML = `<section class="stage exam">${head}
      <div class="qcard sticker"><p class="flash-ar">${it.ar}</p></div>
      <div class="bline ${state}" dir="ltr">${line.length ? line.map((t, p) => `<button class="btile on en" data-p="${p}">${esc(tiles[t].w)}</button>`).join('') : '<span class="muted">دوسي على الكلمات بالترتيب...</span>'}</div>
      <div class="bpool" dir="ltr">${tiles.map((t, k) => `<button class="btile en" data-t="${k}" ${t.used || over ? 'disabled' : ''}>${esc(t.w)}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="exActions" style="justify-content:center"></div></section>`;
    if(over) return;
    screenEl.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = +b.dataset.t; tiles[t].used = true; line.push(t); sfxTick(); render(); if(line.length === tiles.length) check(); });
    screenEl.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = +b.dataset.p; tiles[line[p]].used = false; line.splice(p, 1); render(); });
  }
  function check(){
    over = true;
    const ok = line.map(t => tiles[t].w).join(' ') === it.w.join(' ');
    render(ok ? 'ok' : 'no'); ok ? sfxGood() : sfxBad();
    $('#fb').className = `feedback ${ok ? 'good' : 'bad'}`;
    $('#fb').innerHTML = ok ? 'ترتيب مظبوط!' : `الصح: <span class="en">${esc(it.w.join(' '))}</span>`;
    say(it.w.join(' ')); done(ok);
  }
  render();
}
function exPunct(it, head, done){
  const words = it.raw.split(' '); const caps = words.map(() => false); let end = '';
  const shown = () => words.map((w, k) => caps[k] ? w[0].toUpperCase() + w.slice(1) : w).join(' ') + end;
  let over = false;
  function render(){
    screenEl.innerHTML = `<section class="stage exam">${head}
      <p class="muted">دوسي على أي كلمة محتاجة حرف كبير (Capital)، وبعدين اختاري العلامة اللي في آخر الجملة.</p>
      <div class="punct sticker" dir="ltr">${words.map((w, k) => `<button class="pword en ${caps[k] ? 'cap' : ''}" data-w="${k}" ${over ? 'disabled' : ''}>${esc(caps[k] ? w[0].toUpperCase() + w.slice(1) : w)}</button>`).join('')}<span class="pend en">${end || '▢'}</span></div>
      <div class="row" style="justify-content:center" dir="ltr">${['.', '?', '!'].map(m => `<button class="btn ${end === m ? 'soft' : ''}" data-m="${m}" ${over ? 'disabled' : ''}>${m}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="row" id="exActions" style="justify-content:center">${over ? '' : `<button class="btn primary" id="chk" ${end ? '' : 'disabled'}>صححي</button>`}</div></section>`;
    if(over) return;
    screenEl.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { caps[+b.dataset.w] = !caps[+b.dataset.w]; sfxTick(); render(); });
    screenEl.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { end = b.dataset.m; sfxTick(); render(); });
    $('#chk').onclick = () => {
      over = true; const ok = shown() === it.fixed; render();
      ok ? sfxGood() : sfxBad();
      $('#fb').className = `feedback ${ok ? 'good' : 'bad'}`;
      $('#fb').innerHTML = ok ? `<span class="en">${esc(it.fixed)}</span><span>مظبوطة!</span>` : `<span>الصح:</span><span class="en">${esc(it.fixed)}</span><span>أول الجملة والأسماء بتبدأ بحرف كبير</span>`;
      done(ok);
    };
  }
  render();
}
function exWrite(it, head, done){
  screenEl.innerHTML = `<section class="stage exam">${head}
    <div class="qcard sticker"><p class="gsent en" lang="en">${esc(it.title)}</p>
      <div class="row" style="justify-content:center"><span class="muted">Guiding elements:</span>${it.guide.map(g => `<span class="pill en">${esc(g)}</span>`).join('')}</div></div>
    <textarea id="wtext" class="wbox en" dir="ltr" rows="6" placeholder="Start writing here..."></textarea>
    <p class="muted" id="wcount">0 كلمة · المطلوب ${it.target}</p>
    <p class="muted">الكتابة مش بتتصحح أوتوماتيك. هتتحفظ في «كتاباتها» في ركن الأهل علشان تصححوها معاها. ولو محتاجة مساعدة، ادخلي ورشة الكتابة من منهج المدرسة.</p>
    <div class="row" id="exActions" style="justify-content:center"><button class="btn primary" id="wdone">سلّمي الموضوع</button></div></section>`;
  const ta = $('#wtext');
  ta.oninput = () => { const n = ta.value.split(/\s+/).filter(Boolean).length; $('#wcount').textContent = `${n} كلمة · المطلوب ${it.target}${n >= it.target ? ' ✔' : ''}`; };
  $('#wdone').onclick = () => {
    const text = ta.value.trim();
    if(text){ S.writings.unshift({wid:'exam', title:it.title, text, date:todayStr()}); S.writings = S.writings.slice(0, 20); save('writings'); addStars(2); }
    $('#wdone').remove(); ta.readOnly = true;
    done();
  };
}

/* ============ MISHMISH MALL ============ */
const AWNING = `<svg class="awning" viewBox="0 0 400 38" preserveAspectRatio="none" aria-hidden="true">${Array.from({length:10}, (_,k) => {
  const c = k % 2 ? '#FFFFFF' : '#FF8A3D';
  return `<rect x="${k*40}" width="40" height="24" fill="${c}"/><path d="M${k*40} 24 Q${k*40+20} 42 ${k*40+40} 24" fill="${c}" stroke="#2B2233" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
}).join('')}<path d="M0 1.5 H400" stroke="#2B2233" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
const PLURAL = new Set(['glasses','sunglasses','hearts','stripes','spots','heartsfur']);
const NO_ART = new Set(['space']);
function itemLine(it, withPrice){
  const pl = PLURAL.has(it.id);
  const name = pl || NO_ART.has(it.id) ? it.en : (/^[aeiou]/.test(it.en) ? 'an ' : 'a ') + it.en;
  const head = (pl ? `They're ${name}!` : `It's ${name}!`);
  return withPrice ? `${head} ${pl ? 'They cost' : 'It costs'} ${it.price} stars.` : head;
}
const sfxCash = () => { tone(1046,0,.08,'square',.05); tone(1318,.08,.12,'triangle'); tone(1568,.18,.25,'triangle'); };
let mallTab = 'hat', preview = null;

function mall(){
  setTop(true);
  preview = null;
  screenEl.innerHTML = `<section class="mall">
    <div class="mall-sign">${AWNING}
      <div class="sign-in"><h2>مول مشمش <span class="en">Mishmish Mall</span></h2>
        <span class="pill stars wallet">معاكي ⭐ <b id="wallet">${S.stars}</b></span></div></div>
    <div class="mall-grid">
      <aside class="fitting sticker" id="fitting">
        <span class="fit-label">غرفة القياس · <span class="en">Fitting room</span></span>
        <div class="fit-cat" id="fitCat"></div>
        <div class="fit-info" id="fitInfo" aria-live="polite"></div>
      </aside>
      <div class="shelves">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="shelf" id="shelf"></div>
      </div>
    </div>
  </section>`;
  renderTabs(); renderShelf(); renderFit();
}
function renderTabs(){
  const tabs = [...SLOTS, {id:'mine',en:'My things',ar:'حاجاتي'}];
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${mallTab === t.id}">${t.ar} <span class="en">${t.en}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { mallTab = b.dataset.tab; renderTabs(); renderShelf(); if(b.dataset.tab !== 'mine') say(tabs.find(t => t.id === mallTab).en); });
}
function renderShelf(){
  const list = mallTab === 'mine' ? ITEMS.filter(i => S.owned.includes(i.id)) : ITEMS.filter(i => i.slot === mallTab);
  if(!list.length){ $('#shelf').innerHTML = '<p class="empty" style="grid-column:1/-1">لسه مشترتيش حاجة. لفّي على الأقسام واختاري اللي يعجبك!</p>'; return; }
  $('#shelf').innerHTML = list.map(it => {
    const own = S.owned.includes(it.id), on = S.equip[it.slot] === it.id;
    return `<button class="item ${own ? 'owned' : ''} ${on ? 'worn' : ''} ${!own && it.price > S.stars ? 'pricey' : ''} ${preview === it.id ? 'sel' : ''}" data-item="${it.id}">
      <span class="tag">${on ? 'لابساه ✓' : own ? 'عندك ✓' : `⭐ ${it.price}`}</span>
      <span class="thumb t-${it.slot}">${itemThumb(it)}</span>
      <span class="en name">${it.en}</span><small>${it.ar}</small></button>`;
  }).join('');
  $('#shelf').querySelectorAll('.item').forEach(b => b.onclick = () => {
    preview = b.dataset.item; const it = ITEM_BY_ID[preview];
    say(itemLine(it, !S.owned.includes(it.id)));
    renderShelf(); renderFit(true);
    if(window.innerWidth <= 760) $('#fitting').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
  });
}
function renderFit(anim){
  const look = {...S.equip};
  const it = preview ? ITEM_BY_ID[preview] : null;
  if(it) look[it.slot] = it.id;
  $('#fitCat').innerHTML = catSVG(S.mish, look, anim ? 'tryon' : '');
  const info = $('#fitInfo');
  if(!it){ info.innerHTML = '<p class="fit-hint">دوسي على أي حاجة في الرفوف عشان تجربيها على مشمش قبل ما تشتري.</p>'; return; }
  const own = S.owned.includes(it.id), on = S.equip[it.slot] === it.id;
  let act;
  if(own) act = on ? '<button class="btn" id="act">اقلعيه</button>' : '<button class="btn primary" id="act">البسيه</button>';
  else if(S.stars >= it.price) act = `<button class="btn primary" id="act">اشتري بـ ⭐ ${it.price}</button>`;
  else act = `<p class="need">محتاجة <b>${it.price - S.stars}</b> نجمة كمان</p><button class="btn soft" id="earn">العبي واجمعي نجوم</button>`;
  info.innerHTML = `<div class="fit-name"><span class="en">${it.en}</span>${sayBtn(itemLine(it, !own), 'اسمعي')}</div>
    <p class="muted">${it.ar}${own ? '' : ` · ⭐ ${it.price}`}</p>
    <div class="row" style="justify-content:center">${act}</div>
    ${!on ? '<button class="linkish" id="cancel">رجّعي مشمش زي ما كانت</button>' : ''}`;
  const actB = $('#act');
  if(actB) actB.onclick = () => {
    if(!own){
      S.stars -= it.price; S.owned.push(it.id); S.equip[it.slot] = it.id;
      save('stars'); save('owned'); save('equip'); renderStars(true); $('#wallet').textContent = S.stars;
      sfxCash(); setTimeout(meow, 350); burst($('#fitCat'));
      say(`You bought ${PLURAL.has(it.id) || NO_ART.has(it.id) ? '' : 'a '}${it.en}! Thank you!`);
      toast(`🛍️ اشتريتي ${it.ar}! مشمش لابساه دلوقتي`);
    } else if(on){ delete S.equip[it.slot]; save('equip'); preview = null; }
    else { S.equip[it.slot] = it.id; save('equip'); meow(); }
    renderShelf(); renderFit();
  };
  const earn = $('#earn'); if(earn) earn.onclick = () => home();
  const cancel = $('#cancel'); if(cancel) cancel.onclick = () => { preview = null; renderShelf(); renderFit(); };
}

/* ============ FINISH ============ */
const GAMES = {listen:gameListen, spell:gameSpell, color:gameColor, memory:gameMemory, read:readingHub};
function finish(game, msg, back, backLabel='الرئيسية'){
  const again = typeof game === 'function' ? game : GAMES[game];
  setTop(true);
  const afford = ITEMS.filter(i => !S.owned.includes(i.id) && i.price <= S.stars).sort((a,b) => a.price - b.price)[0];
  meow(); setTimeout(() => say(`Great job${S.name ? ', ' + S.name : ''}! You are a star!`), 500);
  screenEl.innerHTML = `<section class="done-wrap">
    ${catSVG(S.mish, S.equip, 'bounce')}
    <h2 lang="en" dir="ltr">Great job!</h2>
    <p>${msg}</p>
    <p class="pill stars" style="font-size:22px">كسبتي ⭐ ${roundStars} في الجولة دي</p>
    ${afford ? `<p>معاكي ⭐ ${S.stars}، تقدري تشتري لمشمش <span class="en">${afford.en}</span> (${afford.ar}) من المول!</p>` : ''}
    <div class="row" style="justify-content:center;margin-top:8px">
      ${afford ? '<button class="btn soft" id="toMall">روحي المول 🛍️</button>' : ''}
      <button class="btn primary" id="again">العبي تاني</button>
      <button class="btn" id="goHome">${backLabel}</button>
    </div>
  </section>`;
  burst($('.done-wrap svg'));
  $('#again').onclick = () => { roundStars = 0; again(); };
  $('#goHome').onclick = () => (back ? back() : home());
  const tm = $('#toMall'); if(tm) tm.onclick = () => { mallTab = afford.slot; mall(); };
}

/* ---------- boot ---------- */
function start(){ renderSound(); renderStars(); home(); }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
